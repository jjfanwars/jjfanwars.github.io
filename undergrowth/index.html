<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0c09">
<title>Undergrowth</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a0c09'/%3E%3Cpath d='M8 2c-3 3-4 6-1 12 4-4 4-8 1-12z' fill='%236f7d45'/%3E%3C/svg%3E">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root { color-scheme: dark; --ink: #d7d1bc; --ink2: rgba(215, 209, 188, .55); --ink3: rgba(215, 209, 188, .16); --bg: #0a0c09; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #game {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    outline: none; touch-action: none; background: var(--bg); z-index: 0;
  }
  body.ug-capture #game { cursor: none; }
  #hud, #menu { position: fixed; inset: 0; pointer-events: none; }
  #hud { z-index: 10; }
  #menu { z-index: 20; }

  #loading {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(120% 80% at 50% 115%, rgba(58, 74, 40, .38), transparent 60%),
      radial-gradient(90% 60% at 50% -10%, rgba(30, 38, 24, .55), transparent 70%),
      var(--bg);
    transition: opacity .7s ease, visibility 0s linear .7s;
  }
  #loading.done { opacity: 0; visibility: hidden; pointer-events: none; }
  #loading .ld-box { width: min(300px, 72vw); display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #loading .ld-title {
    font-size: 15px; letter-spacing: .62em; text-indent: .62em; font-weight: 600; color: var(--ink);
    opacity: .9;
  }
  #loading .ld-bar { position: relative; width: 100%; height: 2px; background: var(--ink3); overflow: hidden; border-radius: 1px; }
  #loading .ld-fill {
    position: absolute; inset: 0 auto 0 0; width: calc(var(--p, 0) * 100%);
    background: linear-gradient(90deg, rgba(160, 150, 110, .55), var(--ink));
    transition: width .35s ease;
  }
  #loading .ld-bar::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 30%;
    background: linear-gradient(90deg, transparent, rgba(215, 209, 188, .35), transparent);
    animation: ld-sweep 1.6s ease-in-out infinite;
  }
  @keyframes ld-sweep { from { left: -30%; } to { left: 100%; } }
  #loading .ld-label {
    min-height: 1.4em; font: 11px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink2);
  }
  #loading.ld-error .ld-label { color: #d98a6a; }
  #loading.ld-error .ld-bar::after { animation: none; display: none; }
  #loading .ld-btn {
    display: none; margin-top: 6px; padding: 9px 26px; border: 1px solid rgba(215, 209, 188, .35);
    background: rgba(215, 209, 188, .06); color: var(--ink); font: 600 12px/1 system-ui, sans-serif;
    letter-spacing: .3em; text-indent: .3em; text-transform: uppercase; cursor: pointer; border-radius: 2px;
  }
  #loading .ld-btn:hover, #loading .ld-btn:focus-visible { background: rgba(215, 209, 188, .14); outline: none; }
  #loading.ld-action .ld-btn { display: inline-block; }
  #loading.ld-action .ld-bar { display: none; }
  @media (prefers-reduced-motion: reduce) { #loading .ld-bar::after { animation: none; } }
</style>
</head>
<body>
<canvas id="game" tabindex="-1" aria-label="Undergrowth"></canvas>
<div id="hud"></div>
<div id="menu"></div>
<div id="loading" role="status" aria-live="polite">
  <div class="ld-box">
    <div class="ld-title">UNDERGROWTH</div>
    <div class="ld-bar"><div class="ld-fill"></div></div>
    <div class="ld-label">Loading</div>
    <button class="ld-btn" type="button">Deploy</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
