name = "jjfanwars-relay"
main = "worker.js"
compatibility_date = "2024-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIR"
class_name = "Dir"

[[durable_objects.bindings]]
name = "ACCTS"
class_name = "Accts"

[[durable_objects.bindings]]
name = "TRACK"
class_name = "Track"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Dir"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Accts"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Track"]

# Accounts admin (ban, history, rollback): run `npx wrangler@3 secret put ADMIN_KEY` once

# Optional GitHub log of every room: set vars below and run `npx wrangler@3 secret put GH_TOKEN`
# [vars]
# GH_REPO = "owner/repo"
# GH_ISSUE = "1"
