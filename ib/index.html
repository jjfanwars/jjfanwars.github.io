<style>
/* Exercise-book world: paper ground, fountain-pen ink, teacher's red pen for marking */

@media (prefers-color-scheme:dark){:root:not([data-theme=light]){

  --acc:#9db1ff;--acc-ink:#111526;--acc2:#252d45;--red:#ff8a6b;--red2:#3a221d;--good:#86d39a;--good2:#1d3123;--warn:#f0b35a;--warn2:#33281a;
  --kt:#2c2819;--cs:#20263a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5)}}
:root[data-theme=dark]{--bg:#15171c;--panel:#1c1f26;--sunk:#121418;--ink:#ebe7dd;--ink2:#cfcabe;--mut:#9a9fa9;--line:#2c3039;--line2:#3a3f4a;
  --acc:#9db1ff;--acc-ink:#111526;--acc2:#252d45;--red:#ff8a6b;--red2:#3a221d;--good:#86d39a;--good2:#1d3123;--warn:#f0b35a;--warn2:#33281a;
  --kt:#2c2819;--cs:#20263a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5)}
:root{--bad:var(--red);--side:224px}
*{box-sizing:border-box}

button:hover{border-color:var(--ink2)}

svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
select{max-width:100%;text-overflow:ellipsis}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}#main{overflow-x:clip;min-width:0}.card:has(>.ctab){overflow-x:auto;position:relative}.fx,.katex-display{position:relative}.katex .katex-mathml{width:1px;height:1px;overflow:hidden}

a{color:var(--acc);text-underline-offset:3px}

.ppbar{position:sticky;top:64px;z-index:4;display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:var(--sh)}#ppT{font:600 20px var(--f-read);min-width:80px;text-align:right}

.mt:hover{transform:translateY(-1px);box-shadow:var(--sh)}.mt b{font-size:12px}.mt span{font-size:12.5px;line-height:1.25;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.mt i{font-style:normal;font-size:12px;font-weight:600;margin-top:auto;font-variant-numeric:tabular-nums}

<script>
'use strict';
const RELAY = (new URLSearchParams(location.search).get('relay') || 'https://jjfanwars-relay.businessautomationvic.workers.dev').replace(/^ws/, 'http');
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const LS = {get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
let PASS = LS.get('ib-pass', ''), USER = LS.get('ib-user', null); // USER = {key, name, tok}
// "finn" / "FINN" -> "Finn" (mixed case is kept as typed); matches the relay's nice()
const niceName = n => { n = String(n || '').trim().replace(/\s+/g, ' ').slice(0, 30); return n === n.toLowerCase() || n === n.toUpperCase() ? n.toLowerCase().replace(/(^|[\s'-])(\p{L})/gu, (m, a, c) => a + c.toUpperCase()) : n; };
if (USER && USER.name !== niceName(USER.name)) { USER.name = niceName(USER.name); LS.set('ib-user', USER); }
const UID = LS.get('ib-uid', null) || (() => { const u = Math.random().toString(36).slice(2, 12); LS.set('ib-uid', u); return u; })(); // anonymous browser id for usage stats
const UK = () => USER ? USER.key : '', LSK = k => k + ':' + (UK() || 'guest'); // no account = guest: everything stays in this browser
async function api(op, body = {}) {
  const r = await fetch(RELAY + '/ib/' + op, {method: 'POST', body: JSON.stringify({pass: PASS, user: UK(), name: USER ? USER.name : '', uid: UID, ...body})});
  const j = await r.json().catch(() => ({err: 'HTTP ' + r.status}));
  if (r.status === 403 && op !== 'login' && PASS) { LS.set('ib-pass', ''); PASS = ''; location.reload(); }
  if (j && j.err) throw new Error(j.err);
  return j;
}
const S = {books: [], qs: [], book: null, tab: 'home', n: 1, view: LS.get('ib-view', 'text'), mode: LS.get('ib-mode', 'page'), rfs: LS.get('ib-rfs', 18), cache: new Map(), hl: '', prog: null, reading: false};
// per-account local copies; the first account on this device inherits the data saved before accounts existed
function loadLocal() {
  const mig = !LS.get('ib-migrated', 0);
  S.prog = LS.get(LSK('ib-prog'), null) || (mig && LS.get('ib-prog', null)) || {att: {}, terms: {}, last: null};
  for (const k of ['pins', 'marks', 'hls']) S.prog[k] = S.prog[k] || []; S.prog.lastBy = S.prog.lastBy || {}; S.prog.decks = S.prog.decks || {}; S.prog.maps = S.prog.maps || {}; S.prog.recall = S.prog.recall || {};
  S.plan = LS.get(LSK('ib-plan'), null) || (mig ? LS.get('ib-plan', null) : null);
  if (mig) { LS.set('ib-migrated', 1); LS.set(LSK('ib-prog'), S.prog); if (S.plan) LS.set(LSK('ib-plan'), S.plan); }
}

// ---------- markdown ----------
const CO = {ahl: 'Higher level only', worked: 'Worked example', exercise: 'Practice questions', practice: 'Practice questions', guiding: 'Guiding questions', link: 'Linking', nos: 'Nature of science', atl: 'ATL', tool: 'Tools and inquiry', challenge: 'Challenge', keyterm: 'Key term', concept: 'Concept', case: 'Case study', activity: 'Activity', tok: 'TOK', atl: 'ATL skills', tip: 'Assessment tip', questions: 'Questions', box: ''};
// maths: books flagged math (and their chats) render $...$ / $$...$$ with KaTeX + mhchem; other books keep $ as money
let MATH = false;
const mdm = (src, inline) => { const o = MATH; MATH = true; try { return mdx(src, inline); } finally { MATH = o; } }; // always render $maths$ (chat, mind maps)
function mathOut(src) {
  if (!MATH || !window.katex) return {src, put: h => h};
  const M = [], hold = (tex, disp) => { M.push([tex, disp]); return '\u0000' + (M.length - 1) + '\u0000'; };
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => hold(t, true)).replace(/\\\[([\s\S]+?)\\\]/g, (m, t) => hold(t, true))
    .replace(/\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g, (m, t) => hold(t, false)).replace(/\\\(([\s\S]+?)\\\)/g, (m, t) => hold(t, false));
  return {src, put: h => h.replace(/\u0000(\d+)\u0000/g, (m, i) => { const [t, d] = M[+i]; try { return katex.renderToString(t, {displayMode: d, throwOnError: false}); } catch (e) { return esc(t); } })};
}
const mdx = (src, inline) => { const m = mathOut(src); return m.put(inline ? marked.parseInline(m.src) : marked.parse(m.src)); };
const FIGS = {};
async function getFigs(b) { if (!FIGS[b]) FIGS[b] = api('figs', {book: b}).catch(() => ({})); return FIGS[b]; }
function md(src, fig) {
  src = src.replace(/^<!--.*?-->\s*/s, '');
  if (fig && fig.ks && fig.ks.length) { let k = -1; // same matching as ib/figs.py: k = index of the figure line on the page
    src = src.replace(/^\s*\*\[(Figure[^\n]*?)\]\*\s*$/gm, (m, t) => { k++; return fig.ks.includes(k) ? `\n\n<figure class="fimg"><img loading="lazy" src="${imgUrl(fig.b + '~f', fig.n * 100 + k)}" alt="${esc(t)}" title="${esc(t)}"></figure>\n\n` : m; }); }
  src = src.replace(/^\*\[(.+?)\]\*\s*$/gm, (m, t) => '<em class="fig">' + esc(t) + '</em>');
  const mo = mathOut(src); src = mo.src;
  let html = mo.put(marked.parse(src, {gfm: true, breaks: false}));
  html = html.replace(/<blockquote>\s*<p>\[!(\w+)\]\s*([^\n<]*)\n?([\s\S]*?)<\/blockquote>/g, (m, type, title, rest) => {
    type = type.toLowerCase(); const lab = CO[type] ?? type;
    return `<div class="co ${type}"><div class="ct">${lab}${title ? '<b>' + title + '</b>' : ''}</div><p>${rest}</div>`;
  });
  return html.replace(/<p><\/p>/g, '');
}
function highlight(el, q) {
  if (!q) return; const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  let first = null;
  for (const t of nodes) { if (!re.test(t.data)) continue; re.lastIndex = 0; const s = document.createElement('span'); s.innerHTML = esc(t.data).replace(re, m => '<mark>' + m + '</mark>'); t.replaceWith(s); first = first || s; }
  if (first) setTimeout(() => first.scrollIntoView({block: 'center'}), 50);
}

// ---------- data ----------
async function getPage(b, n) {
  const k = b + ':' + n; if (S.cache.has(k)) return S.cache.get(k);
  const p = api('page', {b, n}).catch(e => { S.cache.delete(k); throw e; }); S.cache.set(k, p); return p;
}
const imgUrl = (b, n) => `${RELAY}/ib/img?b=${b}&n=${n}&t=${encodeURIComponent(PASS)}`;
const bookOf = id => S.books.find(b => b.id === id);
const secOf = (b, n) => { let s = null; for (const t of b.toc) { if (t.n > n) break; if (t.lvl <= 3) s = t; } return s; };
let syncT = 0;
function saveProg(pref) { if (pref) S.prog.pt = Date.now(); LS.set(LSK('ib-prog'), S.prog); if (!USER) return; clearTimeout(syncT); syncT = setTimeout(() => api('sync', {data: S.prog}).catch(() => {}), 1500); }
async function pullProg() { if (!USER) return; try { const r = await api('sync'); if (r && r.att) mergeIn(r); } catch (e) {} }
function mergeIn(r) {
  { if (!r || !r.att) return;
    for (const [k, v] of Object.entries(r.att)) if (!S.prog.att[k]) S.prog.att[k] = v; else { const ids = new Set(S.prog.att[k].map(a => a.t)); for (const a of v) if (!ids.has(a.t)) S.prog.att[k].push(a); }
    for (const [k, v] of Object.entries(r.terms || {})) if (!S.prog.terms[k] || S.prog.terms[k].t < v.t) S.prog.terms[k] = v;
    if ((r.pt || 0) > (S.prog.pt || 0)) { S.prog.pins = r.pins || []; S.prog.marks = r.marks || []; S.prog.hls = r.hls || []; S.prog.pt = r.pt; }
    const D = S.prog.days = S.prog.days || {}; for (const [d, o] of Object.entries(r.days || {})) { const x = D[d] = D[d] || {}; for (const k of ['m', 'q', 'c', 'p']) x[k] = Math.max(x[k] || 0, o[k] || 0); }
    if ((r.calt || 0) > (S.prog.calt || 0)) { S.prog.cals = r.cals || []; S.prog.calt = r.calt; setTimeout(loadExt, 0); }
    for (const f of ['decks', 'maps']) { const DK = S.prog[f] = S.prog[f] || {}; for (const [id, d] of Object.entries(r[f] || {})) if (!DK[id] || (DK[id].t || 0) < (d.t || 0)) DK[id] = d; }
    for (const k of ['secs', 'rev', 'recall']) { const L = S.prog[k] = S.prog[k] || {}; for (const [kk, v] of Object.entries(r[k] || {})) if (!L[kk] || (L[kk].t || 0) < (v.t || 0)) L[kk] = v; }
    const PP = S.prog.pp = S.prog.pp || {}; for (const [k, v] of Object.entries(r.pp || {})) { const ts = new Set((PP[k] || []).map(x => x.t)); PP[k] = [...(PP[k] || []), ...v.filter(x => !ts.has(x.t))]; }
    for (const [k, v] of Object.entries(r.lastBy || {})) if (!S.prog.lastBy[k] || S.prog.lastBy[k].t < v.t) S.prog.lastBy[k] = v;
    if (r.last && (!S.prog.last || (r.last.t || 0) > (S.prog.last.t || 0))) S.prog.last = r.last;
    LS.set(LSK('ib-prog'), S.prog); drawPins(); if (S.tab === 'home') drawHome(); if (S.tab === 'lib' && !S.reading) renderShelf();
  }
}

// ---------- shell ----------
const TABN = {home: 'Home', lib: 'Library', prac: 'Practice', terms: 'Flashcards', rev: 'Review', ref: 'Reference', prog: 'Progress', plan: 'Planner', search: 'Search'};
// back/forward: each screen writes a hash; same-screen changes (page flips) replace instead of push
function setHash(h) { if (location.hash === h) return; const seg = x => x.split('/').slice(1, x.startsWith('#/lib/') ? 3 : 2).join('/'), a = seg(location.hash), b = seg(h); history[a === b ? 'replaceState' : 'pushState'](null, '', h); }
function title(parts) { $('#ttl').innerHTML = parts.map((x, i) => i < parts.length - 1 ? `<span class="crumb" data-go="${x[1]}">${esc(x[0])}</span><span class="sep">/</span>` : `<span>${esc(Array.isArray(x) ? x[0] : x)}</span>`).join('');
  $('#ttl').querySelectorAll('[data-go]').forEach(c => c.onclick = () => go(c.dataset.go)); }
function shell(t) { // chrome for a screen: nav highlight, contents panel, title
  if (S.tab !== t) closeDrawer();
  S.tab = t; document.querySelectorAll('.tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); $('#moreB').classList.toggle('on', MORE.some(x => x[0] === t));
  const rd = t === 'lib' && S.reading; $('#toc').classList.toggle('hide', !rd); $('#menuBtn').classList.toggle('hide', !rd);
  document.querySelector('.wrap').style.gridTemplateColumns = rd ? '' : 'minmax(0,1fr)'; title([TABN[t]]);
  document.querySelectorAll('#pins [data-b]').forEach(x => x.classList.toggle('on', rd && x.dataset.b === S.book.id));
}
function tab(t) { shell(t); ({home: renderHome, lib: () => S.reading ? openPage(S.book.id, S.n) : renderShelf(), prac: () => renderPrac(), terms: () => renderTerms(), ref: () => renderRef(), prog: renderProg, rev: renderReview, plan: () => renderPlan(true)})[t](); }
function go(t) { if (t === 'lib') S.reading = false; tab(t); }
function drawPins() { const el = $('#pins'); if (!el || !S.prog) return;
  el.innerHTML = S.prog.pins.map(bookOf).filter(Boolean).map(B => `<button class="sub" data-b="${B.id}"><span class="dot" style="background:${bookC(B)}"></span>${esc(B.subject || B.title)}</button>`).join('');
  el.querySelectorAll('[data-b]').forEach(x => x.onclick = () => openBook(x.dataset.b)); }
const bookBar = cur => S.books.length < 2 ? '' : `<select class="bsel" id="bsel">${S.books.map(x => `<option value="${x.id}" ${x.id === cur ? 'selected' : ''}>${esc(x.subject || x.title)}</option>`).join('')}</select>`;
function onBookBar(fn) { const el = $('#bsel'); if (el) el.onchange = () => { S.book = bookOf(el.value); renderToc(); fn(S.book); }; }
function renderToc() {
  const b = S.book;

// ---------- activity, streaks, weekly report ----------
// days[YYYY-MM-DD] = {m: active minutes, q: questions marked, c: cards reviewed, p: pages opened}
function act(k, n = 1) { if (!S.prog) return; const D = S.prog.days = S.prog.days || {}, d = todayS(), o = D[d] = D[d] || {m: 0, q: 0, c: 0, p: 0}; o[k] = (o[k] || 0) + n; saveProg(); }
let lastInput = Date.now(); for (const ev of ['keydown', 'pointerdown', 'scroll', 'mousemove']) addEventListener(ev, () => { lastInput = Date.now(); }, {passive: true, capture: true});
const DEV = (/Mobi|Android|iPhone/.test(navigator.userAgent) ? 'Phone' : /iPad|Tablet/.test(navigator.userAgent) ? 'Tablet' : 'Computer') + ' · ' + ((navigator.userAgent.match(/(Edg|Chrome|Firefox|Safari)\//) || [])[1] || 'Browser').replace('Edg', 'Edge');
setInterval(() => { if (S.prog && document.visibilityState === 'visible' && Date.now() - lastInput < 120000) { act('m'); api('beat', {dev: DEV}).catch(() => {}); } }, 60000);
const activeDay = o => o && (o.m >= 10 || o.q >= 1 || o.c >= 10);

  return `<div class="wkst">${Array.from({length: 7}, (_, i) => { const d = addD(mon, i), o = D[d]; return `<span class="${activeDay(o) ? 'on' : o && o.m ? 'half' : ''} ${d === t ? 'td' : ''}" title="${fmtD(d)}${o ? ' · ' + o.m + ' min' : ''}">${'MTWTFSS'[i]}</span>`; }).join('')}</div>`; }
function weekStats(off = 0) { // off = 0 this week (last 7 days), 1 the week before
  const D = S.prog.days || {}, t = todayS(), days = Array.from({length: 7}, (_, i) => addD(t, -6 + i - off * 7)), s = {m: 0, q: 0, c: 0, days};
  for (const d of days) { const o = D[d]; if (o) { s.m += o.m || 0; s.q += o.q || 0; s.c += o.c || 0; } }
  const from = pd(days[0]).getTime() - 12 * 36e5, to = pd(days[6]).getTime() + 12 * 36e5, at = Object.values(S.prog.att).flat().filter(a => a.t >= from && a.t < to && a.max);
  s.avg = at.length ? at.reduce((x, a) => x + a.score / a.max, 0) / at.length : null; s.n = at.length; return s; }

  const slip = []; for (const q of S.qs) { const a = attOf(q.id); if (a.length >= 2) { const l = a[a.length - 1]; if (Date.now() - l.t < 7 * 864e5 && l.score / l.max < best(q.id) - .15) slip.push(q.topic || '?'); } }
  const dl = (a, b, f) => b == null || a == null ? '' : `<span class="meta" style="color:${a >= b ? 'var(--good)' : 'var(--red)'}">${a >= b ? '+' : ''}${f(a - b)} vs last week</span>`;
  return {html: `<div class="card wrep"><div class="wbars">${w.days.map(d => { const o = D[d] || {}; return `<div><i style="height:${Math.round((o.m || 0) / mx * 100)}%"></i><span>${fmtD(d, {weekday: 'narrow'})}</span></div>`; }).join('')}</div>
    <div class="wnums"><div><b class="num">${Math.round(w.m / 6) / 10}h</b><span class="meta">studied</span>${dl(w.m / 60, p.m / 60, x => Math.round(x * 10) / 10 + 'h')}</div><div><b class="num">${w.q}</b><span class="meta">questions marked</span></div><div><b class="num">${w.avg == null ? '–' : Math.round(w.avg * 100) + '%'}</b><span class="meta">average mark</span>${dl(w.avg, p.avg, x => Math.round(x * 100) + '%')}</div><div><b class="num">${w.c}</b><span class="meta">cards reviewed</span></div><div><b class="num">${streak()}</b><span class="meta">day streak</span></div></div>
    ${slip.length ? `<div class="meta" style="margin-top:10px">Slipping: ${[...new Set(slip)].slice(0, 5).map(esc).join(', ')}</div>` : ''}<div class="row" style="margin-top:12px"><button id="wRev"><svg class="i"><use href="#i-spark"/></svg>Weekly review with Claude</button></div></div>`,

function weeklyReview() { const r = weekReport(); openChat({title: 'Weekly review', book: S.book.id, pages: [], intro: ''}); CH.lastNote = '-'; sendChat(`Give me my weekly review. Here are my stats:\n${r.text}\n\nKeep it short: what went well, what's slipping, and my 3 priorities for next week.`); CH.msgs[0].show = 'Weekly review'; drawChat(true); }

// ---------- mistake log: questions whose latest attempt was under 70% ----------
function mistakes(book) {
  return S.qs.filter(q => (!book || q.book === book)).map(q => { const a = attOf(q.id); if (!a.length) return null; const l = a[a.length - 1]; if (!l.max || l.score / l.max >= .7) return null;
    const lows = a.filter(x => x.max && x.score / x.max < .7).length, due = l.t + (lows > 1 ? 4 : 2) * 864e5;

}

// ---------- exam mode: timed mock papers built from the tagged question bank (no Claude until you submit) ----------

function csvRow(r) { const out = []; let cur = '', q = false; for (let i = 0; i < r.length; i++) { const ch = r[i]; if (q) { if (ch === '"' && r[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; } else if (ch === '"' && !cur.trim()) q = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; }
function parseCards(txt, ts, rs) {

  return rows.map(r => { if (ts === ',') { const m = csvRow(r.trim()); return m.length >= 2 ? [m[0], m.slice(1).join(',')] : null; } const i = r.indexOf(ts); return i < 0 ? null : [r.slice(0, i), r.slice(i + ts.length)]; })
    .filter(x => x && x[0].trim() && x[1].trim()).map(([f, b]) => ({f: f.trim(), b: b.trim()}));
}

// ---------- sections: free-recall targets ----------
const secEnd = (B, sec) => { const nx = B.toc.find(t => t.n > sec.n && t.lvl <= sec.lvl); return Math.min(nx ? nx.n : B.pages + 1, sec.n + 14); };
const secPages = (B, sec) => Array.from({length: secEnd(B, sec) - sec.n}, (_, i) => sec.n + i);
const secLabel = sec => (sec.num ? sec.num + ' ' : '') + sec.title;
function recallTargets(B) { const ok = t => !/^[ivxlc]+$/i.test(t.bp || '') && t.n >= (B.start || 1); const a = B.toc.filter(t => ok(t) && t.lvl >= 2 && t.lvl <= 3); return a.length ? a : B.toc.filter(t => ok(t) && t.lvl <= 1); }
function recallSecAt(B, n) { const ts = recallTargets(B); let s = null; for (const t of ts) { if (t.n > n) break; s = t; } return s || ts[0]; }
const RC_DAYS = [1, 3, 7, 21, 60];
function recallDue() { return Object.entries(S.prog.recall || {}).map(([k, r]) => { const [b, n] = k.split('|'), B = bookOf(b), sec = B && B.toc.find(t => t.n === +n); return sec && r.due && r.due <= Date.now() ? {k, B, sec, r} : null; }).filter(Boolean).sort((a, b) => a.r.due - b.r.due); }
function recallList(B) {
  const ts = recallTargets(B), R = S.prog.recall || {}, cur = S.prog.lastBy[B.id] ? S.prog.lastBy[B.id].n : 0, groups = [];
  for (const t of ts) { const u = B.toc.filter(x => x.lvl === 1 && x.lvl < t.lvl && x.n <= t.n).pop(); const g = u ? secLabel(u) : B.subject; if (!groups.length || groups[groups.length - 1].g !== g) groups.push({g, ts: []}); groups[groups.length - 1].ts.push(t); }
  const done = Object.keys(R).filter(k => k.startsWith(B.id + '|')).length;
  return `<p class="meta" style="margin:14px 0">Pick a section, close the book and write down everything you remember. Claude checks it against the textbook, shows you exactly what you left out, and can turn the gaps into flashcards. Sections come back after 1, 3, 7, 21 and 60 days until you recall them well.${done ? ` You've done ${done} so far.` : ''}</p>
    ${groups.map(g => `<details class="card rcg" ${g.ts.some(t => t.n <= cur && secEnd(B, t) > cur) || groups.length === 1 ? 'open' : ''}><summary><b>${esc(g.g)}</b></summary><div class="lst">${g.ts.map(t => { const r = R[B.id + '|' + t.n]; return `<div class="row" data-rc="${t.n}" style="cursor:pointer;${t.lvl > ts[0].lvl ? 'padding-left:30px' : ''}"><span style="flex:1">${esc(secLabel(t))}</span>${r ? `<span class="num" style="color:${pcCol(r.last)};font-weight:600">${Math.round(r.last * 100)}%</span>${r.due && r.due <= Date.now() ? '<span class="tag r">Due</span>' : r.due ? `<span class="meta">next ${fmtD(ymd(new Date(r.due)), {day: 'numeric', month: 'short'})}</span>` : ''}` : '<span class="meta">not done</span>'}</div>`; }).join('')}</div></details>`).join('')}`;
}
const RECALL_SYS = `You are checking a free-recall ("brain dump") exercise. The student closed their IB textbook and wrote down everything they remember about one section. Compare what they wrote with the textbook pages provided for that section. Judge how much of the section's important, examinable content they recalled correctly: main concepts, key terms and definitions, processes and how ideas connect, equations, examples and case studies. Ignore trivia, spelling and style; notes and bullet points are fine. Be honest and specific, and encouraging in tone.

  if ($('#rcBack')) $('#rcBack').onclick = () => renderRecall(b);
  $('#rcGo').onclick = async () => {

    o.hist = [...(o.hist || []), {t: Date.now(), sc, miss: (fb.missed || []).slice(0, 5).map(m => String(m.point || m).slice(0, 140))}].slice(-6); R[k] = o;
    act('q'); saveProg(); LS.set(dk, ''); sessMark('rc', k, sc);

function startSess(title, items) { if (!items.length) return alert('Nothing to study with those settings.'); S.sess = {title, items, i: 0, res: {}, t: Date.now()}; sessGo(0); }
const sessCur = (t, id) => { const s = S.sess, it = s && s.items[s.i]; return !!it && it.t === t && it.id === id; };
const sessMark = (t, id, v) => { if (sessCur(t, id)) S.sess.res[S.sess.i] = v; };
function sessBar(t, id) {
  if (!sessCur(t, id)) return ''; const s = S.sess, it = s.items[s.i], n = s.items.length;
  return `<div class="card sbar"><div class="row"><b>${esc(s.title)}</b><span class="meta">${s.i + 1} of ${n}</span><span class="sp"></span><button data-sx="skip">Skip</button><button data-sx="end">End</button></div><div class="sprog"><i style="width:${s.i / n * 100}%"></i></div>${it.why ? `<div class="meta"><svg class="i" style="width:13px;height:13px;vertical-align:-2px"><use href="#i-spark"/></svg> ${esc(it.why)}</div>` : ''}</div>`;
}
function sessGo(i) {
  const s = S.sess; if (!s) return; s.i = i; if (i >= s.items.length) return sessDone(); const it = s.items[i];

}

// ---------- interleaved practice: questions from different topics back to back ----------
const tKey = q => q.book + '|' + (q.topic || '?').split('.').slice(0, 2).join('.');
function spread(a, key) { a = a.slice().sort(() => Math.random() - .5); for (let i = 1; i < a.length; i++) if (key(a[i]) === key(a[i - 1])) { const j = a.findIndex((x, k) => k > i && key(x) !== key(a[i - 1])); if (j > 0) [a[i], a[j]] = [a[j], a[i]]; } return a; }
const isShort = q => q.kind !== 'essay' && (q.marks || 0) <= 8;
function buildMixed(books, focus, n, short) {
  const G = {};
  for (const q of S.qs) { if (!books.includes(q.book) || front(q) || q.pp || (short && !isShort(q))) continue;
    const a = attOf(q.id), b = best(q.id), stale = a.length ? Math.min(1, (Date.now() - a[a.length - 1].t) / (14 * 864e5)) : 0;
    const v = focus === 'new' ? (a.length ? -1 : 1) : focus === 'weak' ? (a.length ? 1 - b : .35) : (a.length ? .6 * (1 - b) + .4 * stale : .7);
    if (v >= 0) (G[tKey(q)] = G[tKey(q)] || []).push([v + Math.random() * .3, q]); }
  const groups = Object.values(G).map(g => g.sort((a, b) => b[0] - a[0])).sort((a, b) => b[0][0] - a[0][0]), out = [];
  while (out.length < n && groups.some(g => g.length)) for (const g of groups) { if (out.length >= n) break; if (g.length) out.push(g.shift()[1]); }
  return spread(out, tKey);
}
function mixedSetup() {
  const bs = S.books.filter(B => S.qs.some(q => q.book === B.id && !front(q) && !q.pp)), st = {f: 'bal', n: 8};
  const mo = openModal(`<h3 style="margin:0 0 4px;font:600 21px/1.25 var(--f-read)">Mixed practice</h3><p class="meta" style="margin:0">Questions from different topics back to back. It feels harder than doing one topic at a time, but you learn to spot which method a question needs, and it sticks better in the exam.</p>
    <div class="fl">Subjects</div><div class="row" id="mxB">${bs.map(B => `<label class="ck"><input type="checkbox" value="${B.id}" ${B === S.book || bs.length === 1 ? 'checked' : ''}>${esc(B.subject)}</label>`).join('')}</div>
    <div class="fl">Focus</div><div class="seg" id="mxF">${[['bal', 'Balanced'], ['weak', 'Weak spots'], ['new', 'Not tried yet']].map(([k, l]) => `<button data-v="${k}" class="${k === st.f ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="fl">Questions</div><div class="seg" id="mxN">${[5, 8, 12, 20].map(k => `<button data-v="${k}" class="${k === st.n ? 'on' : ''}">${k}</button>`).join('')}</div>
    <label class="ck" style="margin-top:14px"><input type="checkbox" id="mxS" checked>Short questions only (no essays or long exam questions)</label>
    <div class="row" style="margin-top:18px"><span class="sp"></span><button id="mClose">Cancel</button><button class="pri" id="mxGo">Start</button></div>`);
  const segs = (id, k, num) => document.querySelectorAll(id + ' [data-v]').forEach(x => x.onclick = () => { st[k] = num ? +x.dataset.v : x.dataset.v; document.querySelectorAll(id + ' [data-v]').forEach(y => y.classList.toggle('on', y === x)); });

// ---------- daily review queue: due cards, a few new ones, mistakes, section checks, free recalls ----------
function reviewQueue() {
  const read = new Set(); for (const [k, o] of Object.entries(S.prog.secs || {})) { const b = k.split('|')[0]; for (const p of o.p || []) read.add(b + '|' + p); }
  const due = [], fresh = [];
  for (const c of allCards()) { const s = S.prog.terms[c.key]; if (s) { if (cardDue(s)) due.push(c); } else if (c.deck || read.has(c.book + '|' + c.n)) fresh.push(c); }
  const nw = fresh.sort((a, b) => (b.deck ? 1 : 0) - (a.deck ? 1 : 0)).slice(0, Math.max(0, NEW_PER_DAY - newToday()));
  const mist = mistakes().filter(m => m.ready).slice(0, 6), revs = reviewsDue().slice(0, 4), rc = recallDue().slice(0, 2);
  const total = due.length + nw.length + mist.length + revs.length + rc.length, mins = Math.round(Math.min(60, due.length) * .3 + nw.length * .5 + mist.length * 4 + revs.length * 3 + rc.length * 7);
  return {due, nw, mist, revs, rc, total, mins};
}
function reviewItems(Q) {
  const cards = [...Q.due.sort(() => Math.random() - .5).slice(0, 60), ...Q.nw].map(c => ({t: 'c', id: c.key, c}));
  const other = spread([...Q.mist.map(m => ({t: 'q', id: m.q.id, why: 'From your mistake log: ' + m.l.score + '/' + m.l.max + ' last time'})), ...Q.revs.map(r => ({t: 'rev', id: r.k, why: 'Section check due'})), ...Q.rc.map(r => ({t: 'rc', id: r.k, why: 'Free recall due: ' + Math.round(r.r.last * 100) + '% last time'}))], x => x.t);
  const out = []; let j = 0; for (let i = 0; i < cards.length; i++) { out.push(cards[i]); if ((i + 1) % 6 === 0 && j < other.length) out.push(other[j++]); }
  return [...out, ...other.slice(j)];
}
function forecast() { const D = Array(7).fill(0), now = Date.now(), t0 = pd(todayS()).getTime() - 12 * 36e5;
  for (const s of Object.values(S.prog.terms)) { const at = s.t + BOXDAYS[s.box] * 864e5; const d = at <= now ? 0 : Math.floor((at - t0) / 864e5); if (d >= 0 && d < 7) D[d]++; }
  for (const r of [...Object.values(S.prog.rev || {}), ...Object.values(S.prog.recall || {})]) if (r.due) { const d = r.due <= now ? 0 : Math.floor((r.due - t0) / 864e5); if (d >= 0 && d < 7) D[d]++; }
  return D; }

// ---------- For you: Claude picks the session from your strengths, weaknesses, forgetting and exams ----------
const FY_SYS = `You are an expert IB study coach choosing exactly what one student should study next, using the evidence given: topic mastery, the mistake log and what they got wrong, free-recall gaps, flashcards they keep forgetting (lapses) or that are due, topics not practised for a while, and upcoming exams (subjects with exams soon come first). Build the session like a good tutor: mostly weak or slipping areas, a couple of items from strong areas so they stay fresh, subjects and topics interleaved rather than in blocks, and an easy win first. Prefer short questions in a quick session. Use only ids from the candidate lists. You may also write up to 5 NEW flashcards for important gaps that no listed card covers (for example from mistake feedback or recall gaps).

  if (TABN[a] && a !== 'search') return go(a);
  go('home');
}
addEventListener('popstate', () => { if (S.books.length) { $('#modal') && $('#modal').remove(); route(); } });

// ---------- boot ----------
async function boot() {
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#main').innerHTML = '<p><span class="spin"></span> Loading…</p>';
  try { [S.books, S.qs] = await Promise.all([api('books'), api('qs')]); } catch (e) { $('#main').innerHTML = '<p>Could not load: ' + esc(e.message) + '</p>'; return; }
  drawMe(); drawPins(); pullProg(); loadPapers();
  const last = S.prog.last; S.book = (last && bookOf(last.b)) || S.books.find(x => x.pages) || S.books[0];
  if (!S.book) { $('#main').innerHTML = '<p>No books uploaded yet.</p>'; return; }
  S.n = last && last.b === S.book.id ? last.n : (S.book.start || 1); renderToc(); route();
}
document.querySelectorAll('.tabs [data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
$('#menuBtn').onclick = () => $('#toc').classList.toggle('open');
$('#toc').onclick = e => { const t = e.target.closest('.t'); if (t) openPage(S.book.id, +t.dataset.n); };
$('#q').oninput = e => suggest(e.target.value);
$('#q').onfocus = e => suggest(e.target.value);
$('#q').onblur = () => setTimeout(() => $('#sugg').classList.add('hide'), 120);
$('#q').onkeydown = e => {
  const n = SG.list.length, box = $('#sugg');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); SG.i = (SG.i + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; box.querySelectorAll('[data-i]').forEach(x => x.classList.toggle('on', +x.dataset.i === SG.i)); }
  else if (e.key === 'Enter') { e.preventDefault(); if (SG.i >= 0 && !box.classList.contains('hide')) pickSugg(SG.i); else { box.classList.add('hide'); search(e.target.value); } }
  else if (e.key === 'Escape') { box.classList.add('hide'); e.target.blur(); }
};
$('#dClose').onclick = closeDrawer;
$('#home').onclick = () => go('home');
$('#tutor').onclick = () => { if (S.tab === 'plan') return openChat({title: 'Planner assistant', agent: true, msgs: S.planChat || []});
  const w = where(), B = w && w.book ? bookOf(w.book) : S.book;
  openChat({title: 'Claude tutor · ' + B.subject, book: B.id, pages: [], intro: ''}); };
$('#cf').onsubmit = e => { e.preventDefault(); const v = $('#ci').value; $('#ci').value = ''; sendChat(v); };
$('#ci').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#cf').requestSubmit(); } };
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (S.tab === 'lib' && S.reading && S.mode !== 'scroll' && e.key === 'ArrowRight') openPage(S.book.id, S.n + 1);
  if (S.tab === 'lib' && S.reading && S.mode !== 'scroll' && e.key === 'ArrowLeft') openPage(S.book.id, S.n - 1);
  if (S.tab === 'lib' && S.reading && (e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey) toggleFocus();
  if (e.key === 'Escape' && document.body.classList.contains('focus') && !document.fullscreenElement) document.body.classList.remove('focus');
  if (e.key === ' ' && $('#flip')) { e.preventDefault(); $('#flip').click(); }
  if (/^[1-4]$/.test(e.key) && $(`[data-gr="${e.key - 1}"]`)) $(`[data-gr="${e.key - 1}"]`).click();
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});
// sign in: first name (+ the site password when the relay isn't in open mode)
// same key the relay uses, so "Finn", "finn" and "FINN" are one person
const ukey = n => String(n || '').trim().toLowerCase().normalize('NFKD').replace(/[^a-z0-9]/g, '').slice(0, 24);
function knownNames() { const seen = new Set(); return LS.get('ib-known', []).map(niceName).filter(n => { const k = ukey(n); if (!k || seen.has(k)) return false; seen.add(k); return true; }); }
async function signIn(name) {
  const u = await api('user', {name}); USER = {key: u.key, name: u.name, tok: u.tok}; LS.set('ib-user', USER);
  const kn = knownNames().filter(x => ukey(x) !== u.key); kn.unshift(u.name); LS.set('ib-known', kn.slice(0, 6));
  const gp = LS.get('ib-prog:guest', null), gl = LS.get('ib-plan:guest', null) || [];
  loadLocal(); if (S.books.length) await pullProg();
  if (gp) { mergeIn({pins: [], marks: [], hls: [], ...gp, pt: 0}); for (const k of ['pins', 'marks', 'hls']) for (const x of gp[k] || []) if (!S.prog[k].some(y => JSON.stringify(y) === JSON.stringify(x))) S.prog[k].push(x); }
  if (gl.length) { let sp = []; try { sp = await api('plan'); } catch (e) {} S.plan = [...(Array.isArray(sp) ? sp : []), ...gl.filter(x => !(sp || []).some(y => y.id === x.id))]; LS.set(LSK('ib-plan'), S.plan); await api('plan', {data: S.plan}).catch(() => {}); }
  else S.planLoaded = 0;
  LS.set('ib-prog:guest', null); LS.set('ib-plan:guest', null); saveProg(true);
  if (S.books.length) { drawMe(); drawPins(); route(); } else boot();
}
$('#lf').onsubmit = async e => { e.preventDefault(); $('#le').textContent = '';
  try { PASS = $('#lp').value.trim(); await api('login'); LS.set('ib-pass', PASS); const v = $('#ln').value.trim(); if (v) await signIn(v); else { loadLocal(); boot(); } } catch (err) { $('#le').textContent = err.message; } };
function showLogin(needPass) {
  $('#lp').classList.toggle('hide', !needPass); $('#login').classList.remove('hide');
  const kn = knownNames(); $('#known').innerHTML = kn.length ? '<div class="meta" style="width:100%">On this device</div>' + kn.map(n => `<button type="button" data-n="${esc(n)}"><span class="av" style="width:22px;height:22px;font-size:11px">${esc(n[0].toUpperCase())}</span>${esc(n)}</button>`).join('') : '';
  $('#known').querySelectorAll('[data-n]').forEach(b => b.onclick = () => signIn(b.dataset.n)); $('#ln').focus();
}
// open mode: the relay lets requests without a password through; ?login shows the password box
(async () => {
  let open = false;
  if (!PASS && !new URLSearchParams(location.search).has('login')) try { const r = await fetch(RELAY + '/ib/books', {method: 'POST', body: '{}'}); open = r.ok; } catch (e) {}
  if (!PASS && !open) return showLogin(true);
  loadLocal(); boot();
})();
</script>
</body>
