<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>IB Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
<style>
/* Exercise-book world: paper ground, fountain-pen ink, teacher's red pen for marking */
:root{
  --bg:#f3f0e8;--panel:#fbfaf6;--sunk:#ece8dd;--ink:#1c2230;--ink2:#3a4252;--mut:#646b78;--line:#ddd7c9;--line2:#cfc8b7;
  --acc:#24408e;--acc-ink:#fff;--acc2:#e3e8f5;--red:#b8321b;--red2:#f6e2dc;--good:#2e6b40;--good2:#e1eee3;--warn:#9a5a0c;--warn2:#f5ead6;
  --kt:#f4ecd6;--cs:#e8ecf3;--sh:0 1px 2px rgba(40,34,20,.06),0 6px 20px -8px rgba(40,34,20,.12);
  --r:10px;--f-ui:"Hanken Grotesk",system-ui,sans-serif;--f-read:"Newsreader",Georgia,serif
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#15171c;--panel:#1c1f26;--sunk:#121418;--ink:#ebe7dd;--ink2:#cfcabe;--mut:#9a9fa9;--line:#2c3039;--line2:#3a3f4a;
  --acc:#9db1ff;--acc-ink:#111526;--acc2:#252d45;--red:#ff8a6b;--red2:#3a221d;--good:#86d39a;--good2:#1d3123;--warn:#f0b35a;--warn2:#33281a;
  --kt:#2c2819;--cs:#20263a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5)}}
:root[data-theme=dark]{--bg:#15171c;--panel:#1c1f26;--sunk:#121418;--ink:#ebe7dd;--ink2:#cfcabe;--mut:#9a9fa9;--line:#2c3039;--line2:#3a3f4a;
  --acc:#9db1ff;--acc-ink:#111526;--acc2:#252d45;--red:#ff8a6b;--red2:#3a221d;--good:#86d39a;--good2:#1d3123;--warn:#f0b35a;--warn2:#33281a;
  --kt:#2c2819;--cs:#20263a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5)}
:root{--bad:var(--red);--side:224px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased;caret-color:var(--acc)}
::selection{background:color-mix(in srgb,var(--acc) 28%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,background .15s}
button:hover{border-color:var(--ink2)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button.pri:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:none}
button.ghost:hover{background:var(--sunk)}
button:disabled{opacity:.5;cursor:default}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input,textarea,select{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
input::placeholder,textarea::placeholder{color:var(--mut)}
textarea{resize:vertical;line-height:1.6}
a{color:var(--acc);text-underline-offset:3px}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--sunk);padding:14px 10px}
.brand{font:600 20px/1 var(--f-read);letter-spacing:-.01em;padding:6px 10px 18px;cursor:pointer;white-space:nowrap}
.brand b{color:var(--red);font-weight:600}
.nv{display:flex;flex-direction:column;gap:1px}
.nv button{border:none;background:none;justify-content:flex-start;gap:10px;padding:8px 10px;color:var(--ink2);font-weight:500;border-radius:7px;width:100%;text-align:left}
.nv button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.nv button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--line)}
.nv button.on svg{color:var(--acc)}
.nv .grp{font-size:11.5px;font-weight:600;color:var(--mut);padding:16px 10px 5px;letter-spacing:.02em}
.nv .sub{padding:5px 10px 5px 36px;font-size:13px;font-weight:400;color:var(--mut)}
.nv .sub .dot{margin-right:2px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;border:none;background:none;padding:8px 10px;border-radius:8px;width:100%;text-align:left}
.me:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.col{min-width:0}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:0 20px;height:56px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
header h1{font:600 16px/1.2 var(--f-ui);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;gap:6px;align-items:center}
header h1 .crumb{color:var(--mut);font-weight:500;cursor:pointer}
header h1 .crumb:hover{color:var(--ink)}
header h1 .sep{color:var(--line2)}
#bot{display:none}
#meH{padding:2px;border:none;background:none}
.sib{padding:5px 12px;border:1px solid var(--line2);border-radius:8px;font-weight:600;background:var(--panel)}
.srch{margin-left:auto;flex:0 1 300px;position:relative}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;padding:4px;box-shadow:var(--sh);max-height:70vh;overflow:auto;min-width:300px}
.sugg>div{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:baseline;font-size:14px}
.sugg>div.on,.sugg>div:hover{background:var(--acc2)}
.sugg .k{font-size:11.5px;color:var(--mut);width:58px;flex:none}
.sugg .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* library shelf */
.lib{max-width:1040px;margin:0 auto}
.lib h2{font:600 30px/1.2 var(--f-read);letter-spacing:-.015em;margin:4px 0 4px}
.lib h3{font:600 15px/1.3 var(--f-ui);margin:26px 0 10px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.book{display:flex;gap:18px;padding:18px;align-items:stretch;cursor:pointer;position:relative;transition:border-color .15s}
.book:hover{border-color:var(--ink2)}
.cover{width:84px;height:116px;border-radius:3px 7px 7px 3px;flex:none;background:var(--bk);background-image:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,0) 14%,rgba(255,255,255,.06) 16%,rgba(0,0,0,0) 30%);color:#fff;padding:10px 9px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 3px 10px -2px rgba(0,0,0,.25)}
.cover b{font:600 13px/1.15 var(--f-read)}
.cover span{font-size:10px;opacity:.8;font-weight:600;letter-spacing:.04em}
.book .bi{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.book .bt{font:600 18px/1.25 var(--f-read);text-wrap:balance;padding-right:30px}
.book .bar{margin-top:auto}
.book .pin{position:absolute;top:10px;right:10px;padding:6px;border:none;background:none;color:var(--mut)}
.book .pin:hover{color:var(--ink);background:var(--sunk)}
.book .pin.on{color:var(--red)}
.book .pin.on svg{fill:currentColor}
.bms>div{display:flex;gap:12px;align-items:baseline;cursor:pointer}
.bms>div:hover{background:var(--sunk)}
.bms .x{margin-left:auto;padding:2px 6px;border:none;background:none;color:var(--mut)}
#bmk.on{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line2))}
#bmk.on svg{fill:currentColor}
.tochd{display:flex;gap:6px;align-items:center;padding:0 6px 10px}
.tochd select{flex:1;min-width:0}
.bsel{width:auto;max-width:260px;font-weight:500}
.wkst{display:flex;gap:4px}.wkst span{width:22px;height:22px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--mut);display:inline-flex;align-items:center;justify-content:center}
.wkst .half{background:color-mix(in srgb,var(--red) 22%,var(--panel));border-color:transparent}.wkst .on{background:var(--red);color:#fff;border-color:var(--red)}.wkst .td{outline:1.5px solid var(--ink2);outline-offset:1px}
.strk{display:flex;align-items:center;gap:12px}.strk b{font:600 22px/1 var(--f-read)}
.wrep{padding:18px 20px}.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:110px;align-items:end}
.wbars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.wbars i{display:block;width:100%;max-width:34px;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}.wbars span{font-size:11px;color:var(--mut)}
.wnums{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:16px}.wnums>div{display:flex;flex-direction:column}.wnums b{font:600 24px/1.1 var(--f-read)}
.ppbar{position:sticky;top:64px;z-index:4;display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:var(--sh)}#ppT{font:600 20px var(--f-read);min-width:80px;text-align:right}
.opt{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;cursor:pointer}.opt input{width:auto}
.selbar{position:absolute;z-index:40;display:flex;gap:2px;padding:3px;box-shadow:var(--sh)}.selbar button{border:none;padding:6px 10px;font-size:13px}
mark.hl{background:color-mix(in srgb,var(--warn) 30%,transparent);color:inherit;border-radius:2px;cursor:pointer;padding:0}mark.hl.nt{text-decoration:underline dotted var(--warn);text-decoration-thickness:2px;text-underline-offset:3px}
.vseg{margin:4px 0 14px}
.ctx{font-size:12px;color:var(--mut);padding:8px 16px;border-bottom:1px solid var(--line);background:var(--sunk)}
.srch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut)}
#q{padding-left:32px;background:var(--panel)}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 56px)}
aside{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px;padding:14px 8px 40px}
aside .t{display:flex;width:100%;text-align:left;border:none;background:none;padding:5px 10px;border-radius:6px;color:var(--ink2);font-size:13.5px;line-height:1.35;gap:8px}
aside .t span:first-child{flex:1}
aside .t:hover{background:var(--sunk);color:var(--ink)}
aside .t.on{background:var(--acc2);color:var(--acc);font-weight:600}
aside .l1{font-weight:600;color:var(--ink);margin-top:10px}
aside .l2{padding-left:18px}
aside .l3{padding-left:30px;font-size:12.5px;color:var(--mut)}
aside .pg{color:var(--mut);font-size:11.5px;font-weight:400;font-variant-numeric:tabular-nums}
main{padding:24px 28px 80px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.reader{max-width:760px;margin:0 auto}
.rbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rbar .sp,.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:none;border-radius:0;padding:6px 12px;background:none}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.page{padding:36px 48px;font-family:var(--f-read);font-size:18px;line-height:1.7;box-shadow:var(--sh)}
.page>*:first-child{margin-top:0}
.page h1,.page h2,.page h3{font-family:var(--f-read);letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
.page h1{font-size:30px;font-weight:600;margin:.2em 0 .6em}
.page h2{font-size:23px;font-weight:600;margin:1.6em 0 .5em}
.page h3{font-size:18.5px;font-weight:600;margin:1.4em 0 .4em;font-family:var(--f-ui)}
.page p{max-width:68ch}
.page table{border-collapse:collapse;font:14px/1.45 var(--f-ui);width:100%;margin:14px 0;display:block;overflow-x:auto;font-variant-numeric:tabular-nums}
.page th,.page td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.page th{font-weight:600;border-bottom:1.5px solid var(--ink2)}
.page blockquote{margin:16px 0;padding:12px 16px;background:var(--sunk);border-radius:8px;font:15px/1.55 var(--f-ui)}
.co{margin:20px 0;border-radius:var(--r);padding:12px 16px 12px;font:15px/1.55 var(--f-ui);background:var(--sunk);border:1px solid var(--line)}
.co .ct{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px;display:flex;gap:6px;align-items:baseline}
.co .ct b{font-size:15px;color:var(--ink);font-weight:600}
.co p{margin:.3em 0}
.co.keyterm{background:var(--kt);border-color:color-mix(in srgb,var(--warn) 25%,var(--line))}
.co.case,.co.concept,.co.nos,.co.link{background:var(--cs);border-color:color-mix(in srgb,var(--acc) 22%,var(--line))}
.co.questions,.co.activity,.co.exercise,.co.challenge,.co.practice{background:var(--panel);border-color:var(--line2)}
.co.worked{background:var(--good2);border-color:color-mix(in srgb,var(--good) 25%,var(--line))}
.co.tip{background:var(--red2);border-color:color-mix(in srgb,var(--red) 22%,var(--line))}
.page em.fig{display:block;color:var(--mut);font:italic 14px/1.45 var(--f-ui);padding:10px 14px;background:var(--sunk);border-radius:8px;margin:14px 0}
.scan{width:100%;display:block;border-radius:var(--r);border:1px solid var(--line);background:#fff;box-shadow:var(--sh)}
mark{background:#ffe28a;color:#1c2230;border-radius:3px;padding:0 1px}
.pgnum{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.katex{font-size:1.04em}
.ask{position:fixed;right:20px;bottom:20px;z-index:8;gap:8px;filter:drop-shadow(0 6px 14px rgba(30,25,10,.18))}
.drawer{position:fixed;top:56px;right:0;bottom:0;width:min(460px,100%);z-index:9;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px -12px rgba(0,0,0,.18)}
.drawer .hd{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;gap:8px}
.drawer .hd span{flex:1;line-height:1.3}
.chat{flex:1;overflow:auto;padding:16px}
.msg{margin:0 0 14px;font-size:14.5px;line-height:1.6}
.msg.u{background:var(--acc2);margin-left:40px;padding:9px 13px;border-radius:12px 12px 4px 12px}
.msg.a{padding:0 2px}
.msg p{margin:.4em 0}.msg ul,.msg ol{margin:.3em 0;padding-left:20px}
.msg table{border-collapse:collapse;font-size:13.5px;margin:8px 0}.msg td,.msg th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left}
.chatin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chatin textarea{min-height:44px;max-height:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.qc{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.qc:hover{border-color:var(--ink2)}
.qc .qt{font-family:var(--f-read);font-size:16.5px;line-height:1.45}
.tag{display:inline-flex;align-items:center;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--ink2);font-weight:600;margin-right:4px;white-space:nowrap}
.tag.w{background:var(--warn2);color:var(--warn)}
.tag.g{background:var(--good2);color:var(--good)}
.tag.r{background:var(--red2);color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.filters select{width:auto}
.prac{max-width:880px;margin:0 auto}
.prac h2,.home h2{font:600 26px/1.2 var(--f-read);letter-spacing:-.015em;margin:0}
.qbig{padding:22px 26px;font-family:var(--f-read);font-size:19px;line-height:1.55}
.meta{color:var(--mut);font-size:13px}
.fb{padding:20px 24px;margin-top:14px}
.score{font:600 40px/1 var(--f-read);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--red)}
.fb h4{margin:18px 0 6px;font-size:13px;font-weight:600;color:var(--ink)}
.fb ul{margin:4px 0;padding-left:20px}.fb li{margin:3px 0}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.stat{padding:16px 18px}
.stat .n{font:600 30px/1.1 var(--f-read);font-variant-numeric:tabular-nums;margin-top:4px}
.flash{max-width:580px;margin:30px auto;padding:40px 32px;text-align:center;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:16px;box-shadow:var(--sh)}
.flash .term{font:600 30px/1.2 var(--f-read)}
.flash .def{font-family:var(--f-read);font-size:18px;text-align:left}
#login{max-width:360px;margin:16vh auto;padding:30px}
#login h2{margin:0 0 4px;font:600 28px var(--f-read)}#login h2 b{color:var(--red);font-weight:600}
#login label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px}
#known{display:flex;flex-wrap:wrap;gap:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hits .h{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.hits .h:last-child{border-bottom:none}
.hits .h:hover{background:var(--sunk)}
#menuBtn{display:none}
.lst>*{padding:11px 16px;border-bottom:1px solid var(--line)}.lst>*:last-child{border-bottom:none}
/* home */
.home{max-width:1120px;margin:0 auto}
.hhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:8px 0 22px;flex-wrap:wrap}
.hhead h2{font-size:34px}
.hgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
.hsec{margin-bottom:28px}
.hsec>h3{font:600 15px/1.3 var(--f-ui);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.hsec>h3 a{margin-left:auto;font-weight:500;font-size:13px}
.cont{display:flex;gap:20px;padding:20px 22px;align-items:center;cursor:pointer;box-shadow:var(--sh)}
.cont:hover{border-color:var(--ink2)}
.cont .ttl{font:600 21px/1.25 var(--f-read);margin:2px 0 6px;text-wrap:balance}
.spine{width:54px;height:72px;border-radius:3px 6px 6px 3px;flex:none;display:flex;align-items:flex-end;padding:6px;color:#fff;font:600 11px/1.1 var(--f-ui);background:var(--bk,#24408e);background-image:linear-gradient(90deg,rgba(0,0,0,.16),rgba(0,0,0,0) 22%);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bk{display:flex;gap:14px;padding:14px;align-items:center;cursor:pointer}
.bk:hover{border-color:var(--ink2)}
.bk b{display:block;font:600 16px/1.25 var(--f-read)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.act{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;align-items:flex-start;border-radius:var(--r)}
.act b{font-size:14.5px}
.act .n{font:600 24px/1.1 var(--f-read);font-variant-numeric:tabular-nums}

<script>
'use strict';
const RELAY = (new URLSearchParams(location.search).get('relay') || 'https://jjfanwars-relay.businessautomationvic.workers.dev').replace(/^ws/, 'http');
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const LS = {get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
let PASS = LS.get('ib-pass', ''), USER = LS.get('ib-user', null); // USER = {key, name, tok}
const UK = () => USER ? USER.key : '', LSK = k => k + ':' + (UK() || 'guest'); // no account = guest: everything stays in this browser
async function api(op, body = {}) {
  const r = await fetch(RELAY + '/ib/' + op, {method: 'POST', body: JSON.stringify({pass: PASS, user: UK(), name: USER ? USER.name : '', ...body})});
  const j = await r.json().catch(() => ({err: 'HTTP ' + r.status}));
  if (r.status === 403 && op !== 'login' && PASS) { LS.set('ib-pass', ''); PASS = ''; location.reload(); }
  if (j && j.err) throw new Error(j.err);
  return j;
}
const S = {books: [], qs: [], book: null, tab: 'home', n: 1, view: LS.get('ib-view', 'text'), cache: new Map(), hl: '', prog: null, reading: false};
// per-account local copies; the first account on this device inherits the data saved before accounts existed
function loadLocal() {
  const mig = !LS.get('ib-migrated', 0);
  S.prog = LS.get(LSK('ib-prog'), null) || (mig && LS.get('ib-prog', null)) || {att: {}, terms: {}, last: null};
  for (const k of ['pins', 'marks', 'hls']) S.prog[k] = S.prog[k] || []; S.prog.lastBy = S.prog.lastBy || {};
  S.plan = LS.get(LSK('ib-plan'), null) || (mig ? LS.get('ib-plan', null) : null);
  if (mig) { LS.set('ib-migrated', 1); LS.set(LSK('ib-prog'), S.prog); if (S.plan) LS.set(LSK('ib-plan'), S.plan); }
}

// ---------- markdown ----------
const CO = {keyterm: 'Key term', concept: 'Concept', case: 'Case study', activity: 'Activity', tok: 'TOK', atl: 'ATL skills', tip: 'Assessment tip', questions: 'Questions', box: ''};
// maths: books flagged math (and their chats) render $...$ / $$...$$ with KaTeX + mhchem; other books keep $ as money
let MATH = false;
function mathOut(src) {
  if (!MATH || !window.katex) return {src, put: h => h};
  const M = [], hold = (tex, disp) => { M.push([tex, disp]); return '\u0000' + (M.length - 1) + '\u0000'; };
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => hold(t, true)).replace(/\\\[([\s\S]+?)\\\]/g, (m, t) => hold(t, true))
    .replace(/\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g, (m, t) => hold(t, false)).replace(/\\\(([\s\S]+?)\\\)/g, (m, t) => hold(t, false));
  return {src, put: h => h.replace(/\u0000(\d+)\u0000/g, (m, i) => { const [t, d] = M[+i]; try { return katex.renderToString(t, {displayMode: d, throwOnError: false}); } catch (e) { return esc(t); } })};
}
const mdx = (src, inline) => { const m = mathOut(src); return m.put(inline ? marked.parseInline(m.src) : marked.parse(m.src)); };
function md(src) {
  src = src.replace(/^<!--.*?-->\s*/s, '').replace(/^\*\[(.+?)\]\*\s*$/gm, (m, t) => '<em class="fig">' + esc(t) + '</em>');
  const mo = mathOut(src); src = mo.src;
  let html = mo.put(marked.parse(src, {gfm: true, breaks: false}));
  html = html.replace(/<blockquote>\s*<p>\[!(\w+)\]\s*([^\n<]*)\n?([\s\S]*?)<\/blockquote>/g, (m, type, title, rest) => {
    type = type.toLowerCase(); const lab = CO[type] ?? type;
    return `<div class="co ${type}"><div class="ct">${lab}${title ? '<b>' + title + '</b>' : ''}</div><p>${rest}</div>`;
  });
  return html.replace(/<p><\/p>/g, '');
}
function highlight(el, q) {
  if (!q) return; const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  let first = null;
  for (const t of nodes) { if (!re.test(t.data)) continue; re.lastIndex = 0; const s = document.createElement('span'); s.innerHTML = esc(t.data).replace(re, m => '<mark>' + m + '</mark>'); t.replaceWith(s); first = first || s; }
  if (first) setTimeout(() => first.scrollIntoView({block: 'center'}), 50);
}

// ---------- data ----------
async function getPage(b, n) {
  const k = b + ':' + n; if (S.cache.has(k)) return S.cache.get(k);
  const p = api('page', {b, n}).catch(e => { S.cache.delete(k); throw e; }); S.cache.set(k, p); return p;
}
const imgUrl = (b, n) => `${RELAY}/ib/img?b=${b}&n=${n}&t=${encodeURIComponent(PASS)}`;
const bookOf = id => S.books.find(b => b.id === id);
const secOf = (b, n) => { let s = null; for (const t of b.toc) { if (t.n > n) break; if (t.lvl <= 3) s = t; } return s; };
let syncT = 0;
function saveProg(pref) { if (pref) S.prog.pt = Date.now(); LS.set(LSK('ib-prog'), S.prog); if (!USER) return; clearTimeout(syncT); syncT = setTimeout(() => api('sync', {data: S.prog}).catch(() => {}), 1500); }
async function pullProg() { if (!USER) return; try { const r = await api('sync'); if (r && r.att) mergeIn(r); } catch (e) {} }
function mergeIn(r) {
  { if (!r || !r.att) return;
    for (const [k, v] of Object.entries(r.att)) if (!S.prog.att[k]) S.prog.att[k] = v; else { const ids = new Set(S.prog.att[k].map(a => a.t)); for (const a of v) if (!ids.has(a.t)) S.prog.att[k].push(a); }
    for (const [k, v] of Object.entries(r.terms || {})) if (!S.prog.terms[k] || S.prog.terms[k].t < v.t) S.prog.terms[k] = v;
    if ((r.pt || 0) > (S.prog.pt || 0)) { S.prog.pins = r.pins || []; S.prog.marks = r.marks || []; S.prog.hls = r.hls || []; S.prog.pt = r.pt; }
    const D = S.prog.days = S.prog.days || {}; for (const [d, o] of Object.entries(r.days || {})) { const x = D[d] = D[d] || {}; for (const k of ['m', 'q', 'c', 'p']) x[k] = Math.max(x[k] || 0, o[k] || 0); }
    const PP = S.prog.pp = S.prog.pp || {}; for (const [k, v] of Object.entries(r.pp || {})) { const ts = new Set((PP[k] || []).map(x => x.t)); PP[k] = [...(PP[k] || []), ...v.filter(x => !ts.has(x.t))]; }
    for (const [k, v] of Object.entries(r.lastBy || {})) if (!S.prog.lastBy[k] || S.prog.lastBy[k].t < v.t) S.prog.lastBy[k] = v;
    if (r.last && (!S.prog.last || (r.last.t || 0) > (S.prog.last.t || 0))) S.prog.last = r.last;
    LS.set(LSK('ib-prog'), S.prog); drawPins(); if (S.tab === 'home') drawHome(); if (S.tab === 'lib' && !S.reading) renderShelf();
  }
}

// ---------- shell ----------
const TABN = {home: 'Home', lib: 'Library', prac: 'Practice', terms: 'Key terms', prog: 'Progress', plan: 'Planner', search: 'Search'};
// back/forward: each screen writes a hash; same-screen changes (page flips) replace instead of push
function setHash(h) { if (location.hash === h) return; const seg = x => x.split('/').slice(1, x.startsWith('#/lib/') ? 3 : 2).join('/'), a = seg(location.hash), b = seg(h); history[a === b ? 'replaceState' : 'pushState'](null, '', h); }
function title(parts) { $('#ttl').innerHTML = parts.map((x, i) => i < parts.length - 1 ? `<span class="crumb" data-go="${x[1]}">${esc(x[0])}</span><span class="sep">/</span>` : `<span>${esc(Array.isArray(x) ? x[0] : x)}</span>`).join('');
  $('#ttl').querySelectorAll('[data-go]').forEach(c => c.onclick = () => go(c.dataset.go)); }
function shell(t) { // chrome for a screen: nav highlight, contents panel, title
  if (S.tab !== t) closeDrawer();
  S.tab = t; document.querySelectorAll('.tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  const rd = t === 'lib' && S.reading; $('#toc').classList.toggle('hide', !rd); $('#menuBtn').classList.toggle('hide', !rd);
  document.querySelector('.wrap').style.gridTemplateColumns = rd ? '' : '1fr'; title([TABN[t]]);
  document.querySelectorAll('#pins [data-b]').forEach(x => x.classList.toggle('on', rd && x.dataset.b === S.book.id));
}
function tab(t) { shell(t); ({home: renderHome, lib: () => S.reading ? openPage(S.book.id, S.n) : renderShelf(), prac: () => renderPrac(), terms: () => renderTerms(), prog: renderProg, plan: () => renderPlan(true)})[t](); }
function go(t) { if (t === 'lib') S.reading = false; tab(t); }
function drawPins() { const el = $('#pins'); if (!el || !S.prog) return;
  el.innerHTML = S.prog.pins.map(bookOf).filter(Boolean).map(B => `<button class="sub" data-b="${B.id}"><span class="dot" style="background:${bookC(B)}"></span>${esc(B.subject || B.title)}</button>`).join('');
  el.querySelectorAll('[data-b]').forEach(x => x.onclick = () => openBook(x.dataset.b)); }
const bookBar = cur => S.books.length < 2 ? '' : `<select class="bsel" id="bsel">${S.books.map(x => `<option value="${x.id}" ${x.id === cur ? 'selected' : ''}>${esc(x.subject || x.title)}</option>`).join('')}</select>`;
function onBookBar(fn) { const el = $('#bsel'); if (el) el.onchange = () => { S.book = bookOf(el.value); renderToc(); fn(S.book); }; }

async function sendChat(text) {
  if (!CH || !text.trim() || CH.busy) return;
  const first = !CH.msgs.some(m => m.role === 'user'), w = CH.agent ? null : where();
  // one line saying where the student is (only when it changed); Claude fetches pages / the open question itself with tools
  let note = '';
  if (w && w.note !== CH.lastNote) { note = w.note + '\n'; CH.lastNote = w.note; }
  CH.msgs.push({role: 'user', content: note + (first && CH.intro ? CH.intro : '') + text, show: text}); CH.busy = true; drawChat(true);
  if (CH.agent) {
    if (!USER) { CH.msgs.push({role: 'assistant', content: 'Sign in (top right) to use the planner assistant. It saves to your account.'}); CH.busy = false; drawChat(); return; }
    try {
      const n = new Date(), r = await api('agent', {today: ymd(n), dow: n.toLocaleDateString('en', {weekday: 'long'}), now: n.toTimeString().slice(0, 5), tz: Intl.DateTimeFormat().resolvedOptions().timeZone, messages: CH.msgs.map(m => ({role: m.role, content: m.content}))});

    } catch (e) { CH.msgs.push({role: 'assistant', content: '**Error:** ' + e.message}); }
    S.planChat = CH.msgs; CH.busy = false; drawChat(); return;
  }
  const me = CH, out = {role: 'assistant', content: ''};
  try { // streamed: text appears as Claude writes it
    const r = await fetch(RELAY + '/ib/ask', {method: 'POST', body: JSON.stringify({mode: 'chat', stream: true, book: me.book, pages: me.pages, find: false, screen: w && w.screen, messages: me.msgs.map(m => ({role: m.role, content: m.content})), pass: PASS, user: UK()})});
    if (!r.ok || !(r.headers.get('content-type') || '').includes('event-stream')) { const j = await r.json().catch(() => ({})); throw new Error(j.err || 'HTTP ' + r.status); }
    me.fixed = true; me.msgs.push(out); const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '', t0 = 0;
    for (;;) { const {done, value} = await rd.read(); if (done) break; buf += dec.decode(value, {stream: true});
      let i; while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (!line.startsWith('data:')) continue;
        try { const ev = JSON.parse(line.slice(5)); if (ev.t) { out.content += ev.t; me.status = ''; } if (ev.tool) me.status = ev.tool === 'read_page' ? 'Reading p. ' + ev.arg : ev.tool === 'search_book' ? 'Searching for “' + ev.arg + '”' : 'Looking at your screen'; if (ev.err) out.content += '\n\n**Error:** ' + ev.err; } catch (e) {} }
      if (CH === me && Date.now() - t0 > 60) { t0 = Date.now(); drawChat(); } }
    me.status = '';
    if (!out.content) out.content = '(no reply)';
    if (me.onMsg) me.onMsg(me.msgs);
  } catch (e) { if (!me.msgs.includes(out)) me.msgs.push(out); out.content += '**Error:** ' + e.message; }
  me.busy = false; if (CH === me) drawChat();
}

const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };

// ---------- activity, streaks, weekly report ----------
// days[YYYY-MM-DD] = {m: active minutes, q: questions marked, c: cards reviewed, p: pages opened}
function act(k, n = 1) { if (!S.prog) return; const D = S.prog.days = S.prog.days || {}, d = todayS(), o = D[d] = D[d] || {m: 0, q: 0, c: 0, p: 0}; o[k] = (o[k] || 0) + n; saveProg(); }
let lastInput = Date.now(); for (const ev of ['keydown', 'pointerdown', 'scroll', 'mousemove']) addEventListener(ev, () => { lastInput = Date.now(); }, {passive: true, capture: true});
setInterval(() => { if (USER && S.prog && document.visibilityState === 'visible' && Date.now() - lastInput < 120000) act('m'); }, 60000);
const activeDay = o => o && (o.m >= 10 || o.q >= 1 || o.c >= 10);
function streak() { const D = S.prog.days || {}; let d = todayS(), n = 0; if (!activeDay(D[d])) d = addD(d, -1); while (activeDay(D[d])) { n++; d = addD(d, -1); } return n; }
function weekStrip() { const D = S.prog.days || {}, t = todayS(), mon = addD(t, -((pd(t).getDay() + 6) % 7));
  return `<div class="wkst">${Array.from({length: 7}, (_, i) => { const d = addD(mon, i), o = D[d]; return `<span class="${activeDay(o) ? 'on' : o && o.m ? 'half' : ''} ${d === t ? 'td' : ''}" title="${fmtD(d)}${o ? ' · ' + o.m + ' min' : ''}">${'MTWTFSS'[i]}</span>`; }).join('')}</div>`; }
function weekStats(off = 0) { // off = 0 this week (last 7 days), 1 the week before
  const D = S.prog.days || {}, t = todayS(), days = Array.from({length: 7}, (_, i) => addD(t, -6 + i - off * 7)), s = {m: 0, q: 0, c: 0, days};
  for (const d of days) { const o = D[d]; if (o) { s.m += o.m || 0; s.q += o.q || 0; s.c += o.c || 0; } }
  const from = pd(days[0]).getTime() - 12 * 36e5, to = pd(days[6]).getTime() + 12 * 36e5, at = Object.values(S.prog.att).flat().filter(a => a.t >= from && a.t < to && a.max);
  s.avg = at.length ? at.reduce((x, a) => x + a.score / a.max, 0) / at.length : null; s.n = at.length; return s; }
function weekReport() {
  const w = weekStats(0), p = weekStats(1), D = S.prog.days || {}, mx = Math.max(30, ...w.days.map(d => (D[d] || {}).m || 0));
  const slip = []; for (const q of S.qs) { const a = attOf(q.id); if (a.length >= 2) { const l = a[a.length - 1]; if (Date.now() - l.t < 7 * 864e5 && l.score / l.max < best(q.id) - .15) slip.push(q.topic || '?'); } }
  const dl = (a, b, f) => b == null || a == null ? '' : `<span class="meta" style="color:${a >= b ? 'var(--good)' : 'var(--red)'}">${a >= b ? '+' : ''}${f(a - b)} vs last week</span>`;
  return {html: `<div class="card wrep"><div class="wbars">${w.days.map(d => { const o = D[d] || {}; return `<div><i style="height:${Math.round((o.m || 0) / mx * 100)}%"></i><span>${fmtD(d, {weekday: 'narrow'})}</span></div>`; }).join('')}</div>
    <div class="wnums"><div><b class="num">${Math.round(w.m / 6) / 10}h</b><span class="meta">studied</span>${dl(w.m / 60, p.m / 60, x => Math.round(x * 10) / 10 + 'h')}</div><div><b class="num">${w.q}</b><span class="meta">questions marked</span></div><div><b class="num">${w.avg == null ? '–' : Math.round(w.avg * 100) + '%'}</b><span class="meta">average mark</span>${dl(w.avg, p.avg, x => Math.round(x * 100) + '%')}</div><div><b class="num">${w.c}</b><span class="meta">cards reviewed</span></div><div><b class="num">${streak()}</b><span class="meta">day streak</span></div></div>
    ${slip.length ? `<div class="meta" style="margin-top:10px">Slipping: ${[...new Set(slip)].slice(0, 5).map(esc).join(', ')}</div>` : ''}<div class="row" style="margin-top:12px"><button id="wRev"><svg class="i"><use href="#i-spark"/></svg>Weekly review with Claude</button></div></div>`,
    text: `Last 7 days: ${Math.round(w.m)} min studied (week before: ${Math.round(p.m)}), ${w.q} questions marked, average mark ${w.avg == null ? 'n/a' : Math.round(w.avg * 100) + '%'} (week before: ${p.avg == null ? 'n/a' : Math.round(p.avg * 100) + '%'}), ${w.c} flashcards, streak ${streak()} days. Daily minutes: ${w.days.map(d => fmtD(d, {weekday: 'short'}) + ' ' + ((D[d] || {}).m || 0)).join(', ')}. Slipping topics: ${[...new Set(slip)].join(', ') || 'none'}.\n` + S.books.map(progSummary).join('\n') + '\nMistakes waiting: ' + mistakes().length};
}
function weeklyReview() { const r = weekReport(); openChat({title: 'Weekly review', book: S.book.id, pages: [], intro: ''}); CH.lastNote = '-'; sendChat(`Give me my weekly review. Here are my stats:\n${r.text}\n\nKeep it short: what went well, what's slipping, and my 3 priorities for next week.`); CH.msgs[0].show = 'Weekly review'; drawChat(true); }

// ---------- mistake log: questions whose latest attempt was under 70% ----------
function mistakes(book) {
  return S.qs.filter(q => (!book || q.book === book)).map(q => { const a = attOf(q.id); if (!a.length) return null; const l = a[a.length - 1]; if (!l.max || l.score / l.max >= .7) return null;
    const lows = a.filter(x => x.max && x.score / x.max < .7).length, due = l.t + (lows > 1 ? 4 : 2) * 864e5;
    return {q, l, due, ready: Date.now() >= due}; }).filter(Boolean).sort((a, b) => a.due - b.due);
}

// ---------- past papers (PPP mode) ----------
// kv 'papers': [{id, book, title, session, paper, mins, total?, bounds?: [[7, pct], [6, pct], ...], instr?, qs: [{n, text, marks, kind?, ms?, ans?, opts?}]}]
const DEF_BOUNDS = [[7, 70], [6, 58], [5, 47], [4, 36], [3, 25], [2, 14], [1, 0]];
const ppQ = (P, q) => ({id: 'pp:' + P.id + ':' + q.n, book: P.book, kind: q.kind || (q.opts || q.ans ? 'mcq' : 'structured'), marks: q.marks, text: q.text, ms: q.ms, ans: q.ans, topic: q.topic, pp: P.id, ppn: q.n, bp: '', pages: []});
async function loadPapers() { if (S.papers) return S.papers; try { S.papers = await api('papers'); if (!Array.isArray(S.papers)) S.papers = []; } catch (e) { S.papers = []; }
  for (const P of S.papers) for (const q of P.qs || []) { const x = ppQ(P, q); if (!S.qs.some(y => y.id === x.id)) S.qs.push(x); } return S.papers; }
const gradeOf = (P, pc) => ((P.bounds || DEF_BOUNDS).find(([, m]) => pc * 100 >= m) || [1])[0];

function paintHls(el, b, n) {
  const hs = (S.prog.hls || []).filter(h => h.b === b && h.n === n); if (!hs.length) return;
  for (const h of hs) {
    const nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let all = '';
    while (w.nextNode()) { if (w.currentNode.parentNode.closest('.katex')) continue; nodes.push([w.currentNode, all.length]); all += w.currentNode.data; }
    const norm = s => s.replace(/\s+/g, ' '), key = norm(h.x).trim(); let flat = '', map = [];
    for (let i = 0; i < all.length; i++) { const c = /\s/.test(all[i]) ? ' ' : all[i]; if (c === ' ' && flat.endsWith(' ')) continue; flat += c; map.push(i); }
    const at = flat.indexOf(key); if (at < 0) continue; const s0 = map[at], s1 = map[at + key.length - 1] + 1;
    for (const [node, off] of nodes) { const a = Math.max(s0, off), z = Math.min(s1, off + node.data.length); if (a >= z) continue;
      const r = document.createRange(); r.setStart(node, a - off); r.setEnd(node, z - off); const m = document.createElement('mark'); m.className = 'hl' + (h.note ? ' nt' : ''); m.dataset.h = h.id; r.surroundContents(m); }
  }
  el.querySelectorAll('mark.hl').forEach(m => m.onclick = e => { e.stopPropagation(); hlPop(m.dataset.h, m); });
}

    ${kn.length ? `<div class="row">${kn.map(n => `<button type="button" data-n="${esc(n)}"><span class="av" style="width:22px;height:22px;font-size:11px">${esc(n[0].toUpperCase())}</span>${esc(n)}</button>`).join('')}</div>` : ''}
    <div class="row"><span class="sp"></span><button type="button" id="mClose">Cancel</button><button class="pri">Sign in</button></div></form>`);
  $('#sn').focus(); const go2 = n => signIn(n).then(() => m.remove(), e => { $('#se').textContent = e.message; });
  $('#sf').onsubmit = e => { e.preventDefault(); const v = $('#sn').value.trim(); if (v) go2(v); }; m.querySelectorAll('[data-n]').forEach(b => b.onclick = () => go2(b.dataset.n));
}
$('#me').onclick = $('#meH').onclick = meMenu;

// ---------- routing ----------
function route() {
  const [, a, b, c] = decodeURIComponent(location.hash).split('/');
  if (a === 'lib' && b && bookOf(b)) return openPage(b, +c || 1);
  if (a === 'lib') return go('lib');
  if (a === 'q' && b) return openQ(b);
  if (a === 'paper' && b) return loadPapers().then(() => openPaper(b));
  if (a === 'search' && b) { $('#q').value = b; return search(b); }
  if (TABN[a] && a !== 'search') return go(a);
  go('home');
}
addEventListener('popstate', () => { if (S.books.length) { $('#modal') && $('#modal').remove(); route(); } });

// ---------- boot ----------
async function boot() {
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#main').innerHTML = '<p><span class="spin"></span> Loading…</p>';
  try { [S.books, S.qs] = await Promise.all([api('books'), api('qs')]); } catch (e) { $('#main').innerHTML = '<p>Could not load: ' + esc(e.message) + '</p>'; return; }
  drawMe(); drawPins(); pullProg(); loadPapers();
  const last = S.prog.last; S.book = (last && bookOf(last.b)) || S.books[0];
  if (!S.book) { $('#main').innerHTML = '<p>No books uploaded yet.</p>'; return; }
  S.n = last && last.b === S.book.id ? last.n : (S.book.start || 1); renderToc(); route();
}
document.querySelectorAll('.tabs [data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
$('#menuBtn').onclick = () => $('#toc').classList.toggle('open');
$('#toc').onclick = e => { const t = e.target.closest('.t'); if (t) openPage(S.book.id, +t.dataset.n); };
$('#q').oninput = e => suggest(e.target.value);
$('#q').onfocus = e => suggest(e.target.value);
$('#q').onblur = () => setTimeout(() => $('#sugg').classList.add('hide'), 120);
$('#q').onkeydown = e => {
  const n = SG.list.length, box = $('#sugg');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); SG.i = (SG.i + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; box.querySelectorAll('[data-i]').forEach(x => x.classList.toggle('on', +x.dataset.i === SG.i)); }
  else if (e.key === 'Enter') { e.preventDefault(); if (SG.i >= 0 && !box.classList.contains('hide')) pickSugg(SG.i); else { box.classList.add('hide'); search(e.target.value); } }
  else if (e.key === 'Escape') { box.classList.add('hide'); e.target.blur(); }
};
$('#dClose').onclick = closeDrawer;
$('#home').onclick = () => go('home');
$('#tutor').onclick = () => { if (S.tab === 'plan') return openChat({title: 'Planner assistant', agent: true, msgs: S.planChat || []});
  const w = where(), B = w && w.book ? bookOf(w.book) : S.book;
  openChat({title: 'Claude tutor · ' + B.subject, book: B.id, pages: [], intro: ''}); };
$('#cf').onsubmit = e => { e.preventDefault(); const v = $('#ci').value; $('#ci').value = ''; sendChat(v); };
$('#ci').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#cf').requestSubmit(); } };
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (S.tab === 'lib' && e.key === 'ArrowRight') openPage(S.book.id, S.n + 1);
  if (S.tab === 'lib' && e.key === 'ArrowLeft') openPage(S.book.id, S.n - 1);
  if (e.key === ' ' && $('#flip')) { e.preventDefault(); $('#flip').click(); }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});
// sign in: first name (+ the site password when the relay isn't in open mode)
async function signIn(name) {
  const u = await api('user', {name}); USER = {key: u.key, name: u.name, tok: u.tok}; LS.set('ib-user', USER);
  const kn = LS.get('ib-known', []).filter(x => x !== u.name); kn.unshift(u.name); LS.set('ib-known', kn.slice(0, 6));
  const gp = LS.get('ib-prog:guest', null), gl = LS.get('ib-plan:guest', null) || [];
  loadLocal(); if (S.books.length) await pullProg();
  if (gp) { mergeIn({pins: [], marks: [], hls: [], ...gp, pt: 0}); for (const k of ['pins', 'marks', 'hls']) for (const x of gp[k] || []) if (!S.prog[k].some(y => JSON.stringify(y) === JSON.stringify(x))) S.prog[k].push(x); }
  if (gl.length) { let sp = []; try { sp = await api('plan'); } catch (e) {} S.plan = [...(Array.isArray(sp) ? sp : []), ...gl.filter(x => !(sp || []).some(y => y.id === x.id))]; LS.set(LSK('ib-plan'), S.plan); await api('plan', {data: S.plan}).catch(() => {}); }
  else S.planLoaded = 0;
  LS.set('ib-prog:guest', null); LS.set('ib-plan:guest', null); saveProg(true);
  if (S.books.length) { drawMe(); drawPins(); route(); } else boot();
}
$('#lf').onsubmit = async e => { e.preventDefault(); $('#le').textContent = '';
  try { PASS = $('#lp').value.trim(); await api('login'); LS.set('ib-pass', PASS); const v = $('#ln').value.trim(); if (v) await signIn(v); else { loadLocal(); boot(); } } catch (err) { $('#le').textContent = err.message; } };
function showLogin(needPass) {
  $('#lp').classList.toggle('hide', !needPass); $('#login').classList.remove('hide');
  const kn = LS.get('ib-known', []); $('#known').innerHTML = kn.length ? '<div class="meta" style="width:100%">On this device</div>' + kn.map(n => `<button type="button" data-n="${esc(n)}"><span class="av" style="width:22px;height:22px;font-size:11px">${esc(n[0].toUpperCase())}</span>${esc(n)}</button>`).join('') : '';
  $('#known').querySelectorAll('[data-n]').forEach(b => b.onclick = () => signIn(b.dataset.n)); $('#ln').focus();
}
// open mode: the relay lets requests without a password through; ?login shows the password box
(async () => {
  let open = false;
  if (!PASS && !new URLSearchParams(location.search).has('login')) try { const r = await fetch(RELAY + '/ib/books', {method: 'POST', body: '{}'}); open = r.ok; } catch (e) {}
  if (!PASS && !open) return showLogin(true);
  loadLocal(); boot();
})();
</script>
