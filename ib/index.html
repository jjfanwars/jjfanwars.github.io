<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>IB Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#f7f6f2;--panel:#fff;--ink:#1d1f24;--mut:#666b75;--line:#e4e2db;--acc:#1f6f5c;--acc2:#e7f2ee;--warn:#b5591b;--bad:#b3261e;--good:#1f7a3a;--kt:#fff4dc;--ktb:#f0b54a;--cs:#eef1fb;--csb:#6b7fd6;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15171b;--panel:#1d2026;--ink:#e7e7ea;--mut:#9aa0ab;--line:#2d3139;--acc:#5cc8a6;--acc2:#1b2e29;--warn:#e89150;--bad:#f2867c;--good:#6fd38e;--kt:#2d2716;--ktb:#a7802f;--cs:#1e2333;--csb:#6b7fd6;--sh:none}}
:root[data-theme=dark]{--bg:#15171b;--panel:#1d2026;--ink:#e7e7ea;--mut:#9aa0ab;--line:#2d3139;--acc:#5cc8a6;--acc2:#1b2e29;--warn:#e89150;--bad:#f2867c;--good:#6fd38e;--kt:#2d2716;--ktb:#a7802f;--cs:#1e2333;--csb:#6b7fd6;--sh:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
:root[data-theme=dark] button.pri,@media (prefers-color-scheme:dark){}
button.pri{color:var(--bg)}
button.ghost{border-color:transparent;background:none}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;line-height:1.6}
a{color:var(--acc)}
.hide{display:none!important}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0 8px 0 0;letter-spacing:-.01em}
header h1 b{color:var(--acc)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{border:none;background:none;color:var(--mut);font-weight:500}
nav.tabs button.on{color:var(--ink);background:var(--acc2)}
#q{max-width:300px;margin-left:auto}
.wrap{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 55px)}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;max-height:calc(100vh - 55px);position:sticky;top:55px;padding:10px 6px 40px}
aside .t{display:block;width:100%;text-align:left;border:none;background:none;padding:5px 10px;border-radius:6px;color:var(--ink);font-size:14px;line-height:1.35}
aside .t:hover{background:var(--acc2)}
aside .t.on{background:var(--acc2);color:var(--acc);font-weight:600}
aside .l1{font-weight:600;margin-top:8px}
aside .l2{padding-left:20px}
aside .l3{padding-left:34px;font-size:13px;color:var(--mut)}
aside .pg{float:right;color:var(--mut);font-size:12px;font-weight:400}
main{padding:18px 24px 80px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
.reader{max-width:760px;margin:0 auto}
.rbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 12px}
.seg button.on{background:var(--acc2);color:var(--acc);font-weight:600}
.page{padding:28px 36px;font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.7}
.page h1,.page h2,.page h3{font-family:Inter,system-ui,sans-serif;letter-spacing:-.01em;line-height:1.25}
.page h1{font-size:26px;color:var(--acc)} .page h2{font-size:21px} .page h3{font-size:17px}
.page table{border-collapse:collapse;font:14px/1.4 Inter,sans-serif;width:100%;margin:12px 0;display:block;overflow-x:auto}
.page th,.page td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.page th{background:var(--acc2)}
.page blockquote{margin:16px 0;padding:10px 14px;border-left:4px solid var(--line);background:var(--bg);border-radius:0 8px 8px 0;font:15px/1.55 Inter,sans-serif}
.co{margin:16px 0;border-radius:10px;padding:10px 14px;font:15px/1.55 Inter,sans-serif;border-left:4px solid var(--line);background:var(--bg)}
.co .ct{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:2px}
.co .ct b{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink);margin-left:4px}
.co p{margin:.3em 0}
.co.keyterm{background:var(--kt);border-color:var(--ktb)}
.co.case,.co.concept{background:var(--cs);border-color:var(--csb)}
.co.questions,.co.activity{background:var(--acc2);border-color:var(--acc)}
.page em.fig{display:block;color:var(--mut);font:italic 14px/1.4 Inter,sans-serif;padding:8px 12px;border:1px dashed var(--line);border-radius:8px}
.scan{width:100%;display:block;border-radius:12px;border:1px solid var(--line);background:#fff}
mark{background:#ffe48a;color:#000;border-radius:3px}
.pgnum{color:var(--mut);font-size:13px}
.ask{position:fixed;right:18px;bottom:18px;z-index:8}
.drawer{position:fixed;top:55px;right:0;bottom:0;width:min(440px,100%);z-index:9;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.drawer .hd{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
.drawer .hd span{flex:1}
.chat{flex:1;overflow:auto;padding:14px}
.msg{margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:14.5px}
.msg.u{background:var(--acc2);margin-left:30px}
.msg.a{background:var(--bg);border:1px solid var(--line)}
.msg p{margin:.35em 0}.msg ul,.msg ol{margin:.3em 0;padding-left:20px}
.chatin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chatin textarea{min-height:44px;max-height:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.qc{padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.qc:hover{border-color:var(--acc)}
.qc .qt{font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.45}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:600;margin-right:4px}
.tag.w{background:var(--kt);color:var(--warn)}
.tag.g{background:var(--acc2);color:var(--good)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.filters select{width:auto}
.prac{max-width:860px;margin:0 auto}
.qbig{padding:20px 24px;font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.5}
.meta{color:var(--mut);font-size:13px}
.fb{padding:18px 22px;margin-top:14px}
.score{font-size:34px;font-weight:700;letter-spacing:-.02em}
.fb h4{margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.fb ul{margin:4px 0;padding-left:20px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.stat{padding:16px}
.stat .n{font-size:28px;font-weight:700}
.flash{max-width:560px;margin:30px auto;padding:34px 28px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.flash .term{font-size:26px;font-weight:700}
.flash .def{font-family:"Source Serif 4",Georgia,serif;font-size:18px;text-align:left}
#login{max-width:360px;margin:12vh auto;padding:28px}
#login h2{margin:0 0 6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hits .h{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.hits .h:hover{background:var(--acc2)}
#menuBtn{display:none}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:55px;bottom:0;width:86%;max-width:320px;z-index:7;transform:translateX(-105%);transition:transform .2s;max-height:none;box-shadow:8px 0 30px rgba(0,0,0,.15)}
  aside.open{transform:none}
  #menuBtn{display:inline-block}
  main{padding:14px 16px 90px}
  .page{padding:18px 16px;font-size:16.5px}
  #q{max-width:none}
  header{flex-wrap:wrap}
  header .srch{order:9;width:100%}
}
</style>
</head>
<body>
<div id="login" class="card hide">
  <h2>IB Study</h2>
  <p class="meta">Enter the password to open your library.</p>
  <form id="lf" class="row" style="flex-direction:column;align-items:stretch"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><button class="pri">Open</button><div id="le" class="meta" style="color:var(--bad)"></div></form>
</div>
<div id="app" class="hide">
<header>
  <button id="menuBtn" class="ghost" aria-label="Contents">☰</button>
  <h1>IB <b>Study</b></h1>
  <nav class="tabs"><button data-tab="lib" class="on">Library</button><button data-tab="prac">Practice</button><button data-tab="terms">Key terms</button><button data-tab="prog">Progress</button></nav>
  <button class="pri" id="tutor" style="margin-left:auto">Ask Claude</button>
  <div class="srch" style="flex:0 1 300px"><input id="q" type="search" placeholder="Search the textbook…"></div>
</header>
<div class="wrap">
  <aside id="toc"></aside>
  <main id="main"></main>
</div>
</div>
<div id="drawer" class="drawer hide"><div class="hd"><span id="dTitle">Ask Claude</span><button class="ghost" id="dClose">✕</button></div><div class="chat" id="chat"></div><form class="chatin" id="cf"><textarea id="ci" rows="1" placeholder="Ask a question…"></textarea><button class="pri">Send</button></form></div>
<script>
'use strict';
const RELAY = (new URLSearchParams(location.search).get('relay') || 'https://jjfanwars-relay.businessautomationvic.workers.dev').replace(/^ws/, 'http');
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const LS = {get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
let PASS = LS.get('ib-pass', '');
async function api(op, body = {}) {
  const r = await fetch(RELAY + '/ib/' + op, {method: 'POST', body: JSON.stringify({...body, pass: PASS})});
  const j = await r.json().catch(() => ({err: 'HTTP ' + r.status}));
  if (r.status === 403 && op !== 'login') { LS.set('ib-pass', ''); location.reload(); }
  if (j && j.err) throw new Error(j.err);
  return j;
}
const S = {books: [], qs: [], book: null, tab: 'lib', n: 1, view: LS.get('ib-view', 'text'), cache: new Map(), hl: '', prog: LS.get('ib-prog', {att: {}, terms: {}, last: null})};

// ---------- markdown ----------
const CO = {keyterm: 'Key term', concept: 'Concept', case: 'Case study', activity: 'Activity', tok: 'TOK', atl: 'ATL skills', tip: 'Assessment tip', questions: 'Questions', box: ''};
function md(src) {
  src = src.replace(/^<!--.*?-->\s*/s, '').replace(/^\*\[(.+?)\]\*\s*$/gm, (m, t) => '<em class="fig">' + esc(t) + '</em>');
  let html = marked.parse(src, {gfm: true, breaks: false});
  html = html.replace(/<blockquote>\s*<p>\[!(\w+)\]\s*([^\n<]*)\n?([\s\S]*?)<\/blockquote>/g, (m, type, title, rest) => {
    type = type.toLowerCase(); const lab = CO[type] ?? type;
    return `<div class="co ${type}"><div class="ct">${lab}${title ? '<b>' + title + '</b>' : ''}</div><p>${rest}</div>`;
  });
  return html.replace(/<p><\/p>/g, '');
}
function highlight(el, q) {
  if (!q) return; const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  let first = null;
  for (const t of nodes) { if (!re.test(t.data)) continue; re.lastIndex = 0; const s = document.createElement('span'); s.innerHTML = esc(t.data).replace(re, m => '<mark>' + m + '</mark>'); t.replaceWith(s); first = first || s; }
  if (first) setTimeout(() => first.scrollIntoView({block: 'center'}), 50);
}

// ---------- data ----------
async function getPage(b, n) {
  const k = b + ':' + n; if (S.cache.has(k)) return S.cache.get(k);
  const p = api('page', {b, n}).catch(e => { S.cache.delete(k); throw e; }); S.cache.set(k, p); return p;
}
const imgUrl = (b, n) => `${RELAY}/ib/img?b=${b}&n=${n}&t=${encodeURIComponent(PASS)}`;
const bookOf = id => S.books.find(b => b.id === id);
const secOf = (b, n) => { let s = null; for (const t of b.toc) { if (t.n > n) break; if (t.lvl <= 3) s = t; } return s; };
let syncT = 0;
function saveProg() { LS.set('ib-prog', S.prog); clearTimeout(syncT); syncT = setTimeout(() => api('sync', {data: S.prog}).catch(() => {}), 1500); }
async function pullProg() {
  try { const r = await api('sync'); if (!r || !r.att) return;
    for (const [k, v] of Object.entries(r.att)) if (!S.prog.att[k]) S.prog.att[k] = v; else { const ids = new Set(S.prog.att[k].map(a => a.t)); for (const a of v) if (!ids.has(a.t)) S.prog.att[k].push(a); }
    for (const [k, v] of Object.entries(r.terms || {})) if (!S.prog.terms[k] || S.prog.terms[k].t < v.t) S.prog.terms[k] = v;
    LS.set('ib-prog', S.prog);
  } catch (e) {}
}

// ---------- shell ----------
function tab(t) {
  S.tab = t; document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#toc').classList.toggle('hide', t !== 'lib'); document.querySelector('.wrap').style.gridTemplateColumns = t === 'lib' ? '' : '1fr';
  closeDrawer(); ({lib: () => openPage(S.book.id, S.n), prac: renderPrac, terms: renderTerms, prog: renderProg})[t]();
}
function renderToc() {
  const b = S.book;
  $('#toc').innerHTML = `<div style="padding:4px 10px 8px"><select id="bk">${S.books.map(x => `<option value="${x.id}" ${x.id === b.id ? 'selected' : ''}>${esc(x.title)}</option>`).join('')}</select></div>` +
    b.toc.filter(t => t.lvl <= 2 || (t.lvl === 3 && /^\d/.test(t.num))).map(t => `<button class="t l${t.lvl}" data-n="${t.n}"><span class="pg">${esc(t.bp)}</span>${t.num ? esc(t.num) + ' ' : ''}${esc(t.title)}</button>`).join('');
  $('#bk').onchange = e => { S.book = bookOf(e.target.value); renderToc(); openPage(S.book.id, S.book.start || 1); };
}
function markToc() {
  let on = null; for (const el of document.querySelectorAll('#toc .t')) { el.classList.remove('on'); if (+el.dataset.n <= S.n) on = el; }
  if (on) { on.classList.add('on'); if (S.tab === 'lib') on.scrollIntoView({block: 'nearest'}); }
}

// ---------- library ----------
async function openPage(b, n, hl) {
  const B = bookOf(b); n = Math.max(1, Math.min(B.pages, n)); S.n = n; S.hl = hl || '';
  S.prog.last = {b, n}; LS.set('ib-prog', S.prog);
  if (S.tab !== 'lib') { S.tab = 'lib'; tab('lib'); return; }
  const sec = secOf(B, n);
  $('#main').innerHTML = `<div class="reader"><div class="rbar">
    <button id="pv">‹</button><span class="pgnum" id="pn"></span><button id="nx">›</button>
    <span class="sp"></span><div class="seg"><button data-v="text">Text</button><button data-v="scan">Scan</button></div></div>
    <div id="pg" class="card page"><span class="spin"></span></div><div class="rbar" style="margin-top:12px"><button id="pv2">‹ Previous page</button><span class="sp"></span><button id="nx2">Next page ›</button></div></div>
    <button class="pri ask" id="askP">Ask Claude about this page</button>`;
  $('#pv').onclick = $('#pv2').onclick = () => openPage(b, n - 1); $('#nx').onclick = $('#nx2').onclick = () => openPage(b, n + 1);
  document.querySelectorAll('.seg button').forEach(x => { x.classList.toggle('on', x.dataset.v === S.view); x.onclick = () => { S.view = x.dataset.v; LS.set('ib-view', S.view); openPage(b, n, hl); }; });
  $('#askP').onclick = () => openChat({title: 'Ask about p. ' + ($('#pn').dataset.bp || n), book: b, pages: [n - 1, n, n + 1].filter(x => x >= 1 && x <= B.pages), intro: `I'm reading page ${$('#pn').dataset.bp || n}${sec ? ' (' + (sec.num ? sec.num + ' ' : '') + sec.title + ')' : ''}. `});
  markToc(); window.scrollTo(0, 0); $('#toc').classList.remove('open');
  try {
    const p = await getPage(b, n); if (S.n !== n) return;
    const bp = p.bp && p.bp !== '-' ? p.bp : ''; $('#pn').textContent = (bp ? 'p. ' + bp + ' · ' : '') + `${n} / ${B.pages}`; $('#pn').dataset.bp = bp;
    const el = $('#pg');
    if (S.view === 'scan') { el.className = ''; el.innerHTML = `<img class="scan" alt="Page ${esc(bp)}" src="${imgUrl(b, n)}">`; }
    else { el.className = 'card page'; el.innerHTML = md(p.md || '*(empty page)*') + `<p class="meta" style="margin-top:28px;font-family:Inter">Text looks off? Switch to <a href="#" id="toScan">Scan</a> to see the original page.</p>`; $('#toScan').onclick = e => { e.preventDefault(); S.view = 'scan'; LS.set('ib-view', 'scan'); openPage(b, n); }; highlight(el, S.hl); }
    if (n < B.pages) getPage(b, n + 1).catch(() => {});
  } catch (e) { $('#pg').innerHTML = '<p>Could not load: ' + esc(e.message) + '</p>'; }
}
let searchT = 0;
async function search(q) {
  if (q.trim().length < 2) return;
  S.tab = 'search'; document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('on')); $('#toc').classList.add('hide'); document.querySelector('.wrap').style.gridTemplateColumns = '1fr';
  $('#main').innerHTML = '<div class="reader"><p><span class="spin"></span> Searching…</p></div>';
  const {hits} = await api('search', {q});
  if ($('#q').value !== q) return;
  $('#main').innerHTML = `<div class="reader"><h2 style="margin-top:0">${hits.length}${hits.length === 60 ? '+' : ''} pages mention “${esc(q)}”</h2><div class="card hits">${hits.map(h => { const B = bookOf(h.b), s = B && secOf(B, h.n);
    return `<div class="h" data-b="${h.b}" data-n="${h.n}"><div class="row"><b>p. ${esc(h.bp)}</b><span class="meta">${s ? esc((s.num ? s.num + ' ' : '') + s.title) : ''}</span></div><div class="meta">…${esc(h.s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => '<mark>' + m + '</mark>')}…</div></div>`; }).join('') || '<p style="padding:14px">Nothing found.</p>'}</div></div>`;
  document.querySelectorAll('.hits .h').forEach(h => h.onclick = () => { S.view = 'text'; S.tab = 'lib'; tab('lib'); openPage(h.dataset.b, +h.dataset.n, q); });
}

// ---------- Claude chat drawer ----------
let CH = null;
function openChat(o) {
  CH = {...o, msgs: o.msgs || []}; $('#dTitle').textContent = o.title || 'Ask Claude'; $('#drawer').classList.remove('hide'); drawChat(); $('#ci').focus();
}
function closeDrawer() { $('#drawer').classList.add('hide'); CH = null; }
function drawChat(busy) {
  $('#chat').innerHTML = (CH.msgs.length ? '' : `<p class="meta">Ask anything: explain a concept, quiz me on a section, plan an essay, find case studies, check my understanding. Claude finds the matching textbook pages and cites them.</p>`) +
    CH.msgs.filter(m => !m.hidden).map(m => `<div class="msg ${m.role === 'user' ? 'u' : 'a'}">${m.role === 'user' ? esc(m.show || m.content).replace(/\n/g, '<br>') : marked.parse(m.content)}</div>`).join('') + (busy ? '<div class="msg a"><span class="spin"></span> Thinking…</div>' : '');
  $('#chat').scrollTop = 1e9;
}
async function sendChat(text) {
  if (!CH || !text.trim()) return;
  const first = !CH.msgs.some(m => m.role === 'user');
  CH.msgs.push({role: 'user', content: (first && CH.intro ? CH.intro : '') + text, show: text}); drawChat(true);
  try {
    const r = await api('ask', {mode: 'chat', book: CH.book, pages: CH.pages, find: !CH.fixed, messages: CH.msgs.map(m => ({role: m.role, content: m.content}))});
    if (r.pages) { CH.pages = r.pages; CH.fixed = true; } // keep the same pages for the rest of the chat so the prompt cache hits
    CH.msgs.push({role: 'assistant', content: r.text || r.err || '(no reply)'});
    if (CH.onMsg) CH.onMsg(CH.msgs);
  } catch (e) { CH.msgs.push({role: 'assistant', content: '**Error:** ' + e.message}); }
  drawChat();
}

// ---------- practice ----------
const KIND = {essay: 'Paper 2 essay', p1: 'Paper 1', short: 'Short answer', activity: 'Activity', discuss: 'Discussion'};
const RUBRIC = {
  essay: `You are marking an IB Global Politics Paper 2 essay (15 marks) using the IB markbands: 0 = does not reach a standard; 1-3 = little understanding of the demands, little relevant knowledge, few or no examples, no or minimal argument or evaluation; 4-6 = some understanding, some relevant knowledge and examples but mostly descriptive, limited argument, few perspectives; 7-9 = mostly understands the demands, mostly accurate relevant knowledge with some appropriate examples, attempts structure and some analysis, some awareness of different perspectives, partial evaluation; 10-12 = understands the demands, accurate relevant knowledge, appropriate examples well used, clear structure, analysis with some evaluation, different perspectives considered; 13-15 = in-depth understanding, accurate and detailed knowledge, effective, varied and specific examples, a well-structured argument that is analytical and consistently evaluative, different perspectives explored and a well-supported conclusion. Judge the essay against the exact command term (to what extent, evaluate, compare and contrast, discuss, examine). If the answer is a plan or notes rather than a full essay, mark it as a plan and say what mark the essay it describes could reach.`,
  p1: `You are marking an IB Global Politics Paper 1 (source-based) answer. Mark strictly against the command term and the marks given for the question.`,
  short: `You are marking a short IB Global Politics answer. Award marks out of the stated total for accurate, relevant points and correct use of key terms; if no total is given, mark out of 10 for accuracy, depth, use of key terms and use of examples.`,
};
RUBRIC.activity = RUBRIC.discuss = RUBRIC.short;
const MARK_FMT = `\n\nReply with ONLY a JSON object, no code fence: {"score": integer, "max": integer, "band": "markband or level, e.g. 7-9", "verdict": "one sentence overall judgement", "good": ["specific things that earned marks"], "missed": ["specific things that were missing, wrong or weak, most important first"], "fix": ["concrete actions to lift the mark next time"], "plan": "a short model answer outline as markdown bullets (for essays: thesis, 3-4 paragraph points with an example each, conclusion)", "terms": ["key terms from the course the answer should have used"]}. Quote the student's own words when pointing out a weakness. Cite textbook pages as p. N where useful.`;
const qMax = q => q.marks || (q.kind === 'essay' ? 15 : 10);
const attOf = id => S.prog.att[id] || [];
const best = id => attOf(id).reduce((m, a) => a.max ? Math.max(m, a.score / a.max) : m, -1);
function topicName(B, t) { const s = B.toc.find(x => x.num === t); return s ? t + ' ' + s.title : t; }
function renderPrac(filter) {
  const F = filter || (S.pf = S.pf || {book: S.book.id, kind: '', topic: '', st: ''});
  const B = bookOf(F.book) || S.book, qs = S.qs.filter(q => q.book === B.id);
  const topics = [...new Set(qs.map(q => q.topic).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
  const list = qs.filter(q => (!F.kind || q.kind === F.kind) && (!F.topic || (q.topic || '').startsWith(F.topic)) &&
    (!F.st || (F.st === 'new' ? !attOf(q.id).length : F.st === 'weak' ? (best(q.id) >= 0 && best(q.id) < .6) : best(q.id) >= .6)));
  $('#main').innerHTML = `<div class="prac" style="max-width:1100px">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Practice</h2><button class="pri" id="rnd">Random question</button></div>
    <p class="meta">Write an answer, then Claude marks it against the IB criteria and tells you exactly what you missed. ${qs.length} questions.</p>
    <div class="filters"><select id="fk"><option value="">All types</option>${[...new Set(qs.map(q => q.kind))].map(k => `<option value="${k}" ${F.kind === k ? 'selected' : ''}>${KIND[k] || k}</option>`).join('')}</select>
    <select id="ft"><option value="">All topics</option>${topics.map(t => `<option value="${t}" ${F.topic === t ? 'selected' : ''}>${esc(topicName(B, t))}</option>`).join('')}</select>
    <select id="fs"><option value="">Any status</option><option value="new" ${F.st === 'new' ? 'selected' : ''}>Not tried</option><option value="weak" ${F.st === 'weak' ? 'selected' : ''}>Weak (under 60%)</option><option value="good" ${F.st === 'good' ? 'selected' : ''}>Done well</option></select></div>
    <div class="grid">${list.map(q => { const bs = best(q.id); return `<div class="card qc" data-id="${q.id}"><div>${'<span class="tag">' + (KIND[q.kind] || q.kind) + '</span>'}${q.marks ? '<span class="tag">' + q.marks + ' marks</span>' : ''}${bs >= 0 ? `<span class="tag ${bs < .6 ? 'w' : 'g'}">best ${Math.round(bs * 100)}%</span>` : ''}</div><div class="qt">${esc(q.text.length > 220 ? q.text.slice(0, 220) + '…' : q.text)}</div><div class="meta">${esc(q.topic ? topicName(B, q.topic) : '')}${q.bp ? ' · p. ' + q.bp : ''}</div></div>`; }).join('') || '<p>No questions match.</p>'}</div></div>`;
  $('#fk').onchange = e => { F.kind = e.target.value; renderPrac(F); }; $('#ft').onchange = e => { F.topic = e.target.value; renderPrac(F); }; $('#fs').onchange = e => { F.st = e.target.value; renderPrac(F); };
  document.querySelectorAll('.qc').forEach(c => c.onclick = () => openQ(c.dataset.id));
  $('#rnd').onclick = () => { const pool = list.length ? list : qs; if (pool.length) openQ(pool[Math.random() * pool.length | 0].id); };
}
function openQ(id) {
  const q = S.qs.find(x => x.id === id), B = bookOf(q.book), draft = LS.get('ib-d-' + id, ''), prev = attOf(id);
  $('#main').innerHTML = `<div class="prac"><div class="row" style="margin-bottom:10px"><button id="back">‹ All questions</button><span class="sp" style="flex:1"></span>${q.n ? `<button id="src">Open in textbook (p. ${esc(q.bp)})</button>` : ''}</div>
    <div class="card qbig"><div style="font-family:Inter;margin-bottom:8px"><span class="tag">${KIND[q.kind] || q.kind}</span>${q.marks ? '<span class="tag">' + q.marks + ' marks</span>' : ''}<span class="meta">${esc(q.topic ? topicName(B, q.topic) : '')}</span></div>${esc(q.text).replace(/\n/g, '<br>')}${q.ctx ? `<div class="meta" style="font-family:Inter;margin-top:10px">${esc(q.ctx)}</div>` : ''}</div>
    <div style="margin-top:14px"><textarea id="ans" rows="${q.kind === 'essay' ? 18 : 8}" placeholder="${q.kind === 'essay' ? 'Write your essay (or a detailed plan). Aim for an argument that answers the command term, with specific examples.' : 'Your answer…'}">${esc(draft)}</textarea>
    <div class="row" style="margin-top:8px"><span class="meta" id="wc"></span><span class="meta" id="tm"></span><span style="flex:1"></span><button id="hint">Hint</button><button class="pri" id="mark">Mark with Claude</button></div></div>
    <div id="fbx"></div>
    ${prev.length ? `<h3 style="margin-top:28px">Past attempts</h3>${prev.slice().reverse().map((a, i) => `<details class="card" style="padding:10px 14px;margin-bottom:8px"><summary><b>${a.score}/${a.max}</b> <span class="meta">${new Date(a.t).toLocaleString()}</span></summary><div class="fb" style="padding:6px 0 0">${fbHtml(a.fb)}<h4>Your answer</h4><div class="meta" style="white-space:pre-wrap">${esc(a.ans)}</div></div></details>`).join('')}` : ''}</div>`;
  const ta = $('#ans'), t0 = Date.now();
  const wc = () => { const n = (ta.value.match(/\S+/g) || []).length; $('#wc').textContent = n + ' words'; LS.set('ib-d-' + id, ta.value); }; ta.oninput = wc; wc();
  const tick = setInterval(() => { if (!document.body.contains(ta)) return clearInterval(tick); const s = (Date.now() - t0) / 1000 | 0; $('#tm').textContent = '· ' + (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); }, 1000);
  $('#back').onclick = () => renderPrac(); if ($('#src')) $('#src').onclick = () => { S.book = B; renderToc(); S.tab = 'lib'; tab('lib'); openPage(B.id, q.n); };
  $('#hint').onclick = () => openChat({title: 'Hint', book: q.book, pages: q.pages, intro: `Question (${KIND[q.kind]}${q.marks ? ', ' + q.marks + ' marks' : ''}): "${q.text}"\nGive me a hint to get started WITHOUT writing the answer for me: what the command term wants, 2-3 angles or concepts to consider, and which examples or textbook pages could help. `, msgs: []}) || sendChat('Give me a hint.');
  $('#mark').onclick = async () => {
    const ans = ta.value.trim(); if ((ans.match(/\S+/g) || []).length < 8) { $('#fbx').innerHTML = '<p class="meta">Write a bit more first.</p>'; return; }
    $('#mark').disabled = true; $('#fbx').innerHTML = '<div class="card fb"><span class="spin"></span> Claude is marking your answer… (10-40 s)</div>';
    const user = `Question (${KIND[q.kind] || q.kind}${q.marks ? ', ' + q.marks + ' marks' : ''}): ${q.text}${q.ctx ? '\nContext: ' + q.ctx : ''}\n\nStudent answer:\n"""\n${ans}\n"""`;
    try {
      const r = await api('ask', {mode: 'mark', rubric: (RUBRIC[q.kind] || RUBRIC.short) + MARK_FMT, book: q.book, pages: q.pages, messages: [{role: 'user', content: user}]});
      let fb; try { fb = JSON.parse(r.text.replace(/^```(json)?|```$/g, '').trim()); } catch (e) { fb = {score: 0, max: qMax(q), verdict: '', raw: r.text}; }
      fb.max = fb.max || qMax(q);
      const att = {t: Date.now(), score: +fb.score || 0, max: fb.max, ans, fb, secs: (Date.now() - t0) / 1000 | 0};
      (S.prog.att[id] = S.prog.att[id] || []).push(att); saveProg();
      $('#fbx').innerHTML = `<div class="card fb">${fbHtml(fb)}<div class="row" style="margin-top:14px"><button class="pri" id="disc">Ask Claude about this feedback</button><button id="again">Try again</button></div></div>`;
      $('#disc').onclick = () => openChat({title: 'Feedback discussion', book: q.book, pages: q.pages, fixed: true, msgs: [{role: 'user', content: user, show: 'My answer to: ' + q.text}, {role: 'assistant', content: fbMd(fb)}]});
      $('#again').onclick = () => { ta.focus(); window.scrollTo({top: 0, behavior: 'smooth'}); };
      $('#fbx').scrollIntoView({behavior: 'smooth'});
    } catch (e) { $('#fbx').innerHTML = `<div class="card fb">Marking failed: ${esc(e.message)}</div>`; }
    $('#mark').disabled = false;
  };
}
const li = a => (a || []).map(x => '<li>' + marked.parseInline(String(x)) + '</li>').join('');
function fbHtml(fb) {
  if (!fb) return '';
  if (fb.raw) return marked.parse(fb.raw);
  const pc = fb.max ? fb.score / fb.max : 0;
  return `<div class="row" style="gap:16px"><div class="score" style="color:${pc < .4 ? 'var(--bad)' : pc < .7 ? 'var(--warn)' : 'var(--good)'}">${fb.score}/${fb.max}</div><div>${fb.band ? '<span class="tag">band ' + esc(fb.band) + '</span>' : ''}<div>${esc(fb.verdict)}</div></div></div>
    ${fb.good && fb.good.length ? '<h4>What earned marks</h4><ul>' + li(fb.good) + '</ul>' : ''}${fb.missed && fb.missed.length ? '<h4>What you missed</h4><ul>' + li(fb.missed) + '</ul>' : ''}
    ${fb.fix && fb.fix.length ? '<h4>How to lift it</h4><ul>' + li(fb.fix) + '</ul>' : ''}${fb.terms && fb.terms.length ? '<h4>Key terms to use</h4><div>' + fb.terms.map(t => '<span class="tag">' + esc(t) + '</span>').join(' ') + '</div>' : ''}
    ${fb.plan ? '<details style="margin-top:12px"><summary><b>Model answer outline</b></summary>' + marked.parse(fb.plan) + '</details>' : ''}`;
}
const fbMd = fb => fb.raw || `Score ${fb.score}/${fb.max}${fb.band ? ' (band ' + fb.band + ')' : ''}. ${fb.verdict}\n\nEarned marks:\n${(fb.good || []).map(x => '- ' + x).join('\n')}\n\nMissed:\n${(fb.missed || []).map(x => '- ' + x).join('\n')}\n\nTo improve:\n${(fb.fix || []).map(x => '- ' + x).join('\n')}\n\nOutline:\n${fb.plan || ''}`;

// ---------- key terms (flashcards, Leitner boxes) ----------
const BOXDAYS = [0, 1, 3, 7, 16, 35];
function renderTerms(mode) {
  const B = S.book, terms = B.terms || [], now = Date.now();
  const due = terms.filter(t => { const s = S.prog.terms[B.id + ':' + t.k]; return !s || now >= s.t + BOXDAYS[s.box] * 864e5; });
  const known = terms.filter(t => (S.prog.terms[B.id + ':' + t.k] || {}).box >= 3).length;
  if (mode !== 'study') {
    $('#main').innerHTML = `<div class="prac"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Key terms</h2><button class="pri" id="st" ${due.length ? '' : 'disabled'}>Study ${due.length} due</button></div>
      <p class="meta">${terms.length} terms from ${esc(B.title)} · ${known} learned. Cards you get right come back later (1, 3, 7, 16, 35 days).</p>
      <input id="tf" placeholder="Filter terms…" style="margin:6px 0 12px"><div class="card" id="tl"></div></div>`;
    const draw = f => { $('#tl').innerHTML = terms.filter(t => !f || (t.k + t.d).toLowerCase().includes(f)).map(t => { const s = S.prog.terms[B.id + ':' + t.k];
      return `<div style="padding:10px 14px;border-bottom:1px solid var(--line)"><div class="row"><b>${esc(t.k)}</b>${s ? `<span class="tag ${s.box >= 3 ? 'g' : 'w'}">box ${s.box}</span>` : ''}<span style="flex:1"></span><a href="#" data-n="${t.n}" class="meta">p. ${esc(t.bp)}</a></div><div style="font-family:'Source Serif 4',serif">${esc(t.d)}</div></div>`; }).join('');
      document.querySelectorAll('#tl a').forEach(a => a.onclick = e => { e.preventDefault(); S.tab = 'lib'; tab('lib'); openPage(B.id, +a.dataset.n, ''); }); };
    $('#tf').oninput = e => draw(e.target.value.toLowerCase()); draw(''); $('#st').onclick = () => renderTerms('study'); return;
  }
  const deck = due.sort(() => Math.random() - .5).slice(0, 20); let i = 0, flipped = false;
  const show = () => {
    if (i >= deck.length) { $('#main').innerHTML = `<div class="card flash"><div class="term">Done</div><p>${deck.length} cards reviewed.</p><button class="pri" id="bk2">Back</button></div>`; $('#bk2').onclick = () => renderTerms(); return; }
    const t = deck[i];
    $('#main').innerHTML = `<div class="meta" style="text-align:center;margin-top:10px">${i + 1} / ${deck.length}</div><div class="card flash"><div class="term">${esc(t.k)}</div>${flipped ? `<div class="def">${esc(t.d)}</div><div class="row" style="justify-content:center"><button id="no">Didn't know</button><button class="pri" id="yes">Knew it</button></div>` : `<p class="meta">Say or think the definition, then reveal.</p><button class="pri" id="flip">Reveal (space)</button>`}</div>`;
    if (!flipped) $('#flip').onclick = () => { flipped = true; show(); };
    else { const g = ok => { const k = B.id + ':' + t.k, s = S.prog.terms[k] || {box: 0}; S.prog.terms[k] = {box: ok ? Math.min(5, s.box + 1) : 0, t: Date.now()}; saveProg(); i++; flipped = false; show(); }; $('#yes').onclick = () => g(1); $('#no').onclick = () => g(0); }
  };
  show();
}

// ---------- progress ----------
function renderProg() {
  const B = S.book, qs = S.qs.filter(q => q.book === B.id), tried = qs.filter(q => attOf(q.id).length), all = tried.flatMap(q => attOf(q.id));
  const avg = all.length ? Math.round(all.reduce((s, a) => s + a.score / a.max, 0) / all.length * 100) : 0;
  const byTopic = {}; for (const q of tried) { const t = (q.topic || '?').split('.').slice(0, 2).join('.'); const b = best(q.id); (byTopic[t] = byTopic[t] || []).push(b); }
  const rows = Object.entries(byTopic).map(([t, a]) => ({t, v: a.reduce((s, x) => s + x, 0) / a.length, n: a.length})).sort((a, b) => a.v - b.v);
  const terms = B.terms || [], known = terms.filter(t => (S.prog.terms[B.id + ':' + t.k] || {}).box >= 3).length;
  const recent = qs.flatMap(q => attOf(q.id).map(a => ({q, a}))).sort((x, y) => y.a.t - x.a.t).slice(0, 8);
  $('#main').innerHTML = `<div class="prac"><h2 style="margin-top:0">Progress</h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))"><div class="card stat"><div class="meta">Questions tried</div><div class="n">${tried.length}<span class="meta"> / ${qs.length}</span></div></div><div class="card stat"><div class="meta">Average mark</div><div class="n">${avg}%</div></div><div class="card stat"><div class="meta">Attempts</div><div class="n">${all.length}</div></div><div class="card stat"><div class="meta">Key terms learned</div><div class="n">${known}<span class="meta"> / ${terms.length}</span></div></div></div>
    <h3>Topics, weakest first</h3>${rows.length ? `<div class="card" style="padding:6px 14px">${rows.map(r => `<div style="padding:8px 0"><div class="row"><span>${esc(topicName(B, r.t))}</span><span style="flex:1"></span><span class="meta">${Math.round(r.v * 100)}% · ${r.n} q</span><button class="ghost" data-t="${r.t}">Practise</button></div><div class="bar"><i style="width:${Math.round(r.v * 100)}%;background:${r.v < .5 ? 'var(--bad)' : r.v < .7 ? 'var(--warn)' : 'var(--good)'}"></i></div></div>`).join('')}</div>` : '<p class="meta">Do some practice questions to see your weak topics here.</p>'}
    ${recent.length ? `<h3>Recent</h3><div class="card">${recent.map(({q, a}) => `<div class="h" style="padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer" data-id="${q.id}"><b>${a.score}/${a.max}</b> <span class="meta">${new Date(a.t).toLocaleDateString()}</span><div>${esc(q.text.slice(0, 140))}</div></div>`).join('')}</div>` : ''}</div>`;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.pf = {book: B.id, kind: '', topic: b.dataset.t, st: ''}; S.tab = 'prac'; document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'prac')); renderPrac(); });
  document.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { S.tab = 'prac'; document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'prac')); openQ(b.dataset.id); });
}

// ---------- boot ----------
async function boot() {
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#main').innerHTML = '<p><span class="spin"></span> Loading…</p>';
  try { [S.books, S.qs] = await Promise.all([api('books'), api('qs')]); } catch (e) { $('#main').innerHTML = '<p>Could not load: ' + esc(e.message) + '</p>'; return; }
  pullProg();
  const last = S.prog.last; S.book = (last && bookOf(last.b)) || S.books[0];
  if (!S.book) { $('#main').innerHTML = '<p>No books uploaded yet.</p>'; return; }
  renderToc(); openPage(S.book.id, last && last.b === S.book.id ? last.n : (S.book.start || 1));
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => tab(b.dataset.tab));
$('#menuBtn').onclick = () => { if (S.tab !== 'lib') tab('lib'); $('#toc').classList.toggle('open'); };
$('#toc').onclick = e => { const t = e.target.closest('.t'); if (t) openPage(S.book.id, +t.dataset.n); };
$('#q').oninput = e => { clearTimeout(searchT); const v = e.target.value; searchT = setTimeout(() => search(v), 350); };
$('#q').onkeydown = e => { if (e.key === 'Enter') { clearTimeout(searchT); search(e.target.value); } };
$('#dClose').onclick = closeDrawer;
$('#tutor').onclick = () => openChat({title: 'Claude tutor · ' + S.book.subject, book: S.book.id, pages: [], intro: ''});
$('#cf').onsubmit = e => { e.preventDefault(); const v = $('#ci').value; $('#ci').value = ''; sendChat(v); };
$('#ci').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#cf').requestSubmit(); } };
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (S.tab === 'lib' && e.key === 'ArrowRight') openPage(S.book.id, S.n + 1);
  if (S.tab === 'lib' && e.key === 'ArrowLeft') openPage(S.book.id, S.n - 1);
  if (e.key === ' ' && $('#flip')) { e.preventDefault(); $('#flip').click(); }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});
$('#lf').onsubmit = async e => {
  e.preventDefault(); PASS = $('#lp').value.trim(); $('#le').textContent = '';
  try { await api('login'); LS.set('ib-pass', PASS); boot(); } catch (err) { $('#le').textContent = err.message; }
};
if (PASS) boot(); else $('#login').classList.remove('hide');
</script>
