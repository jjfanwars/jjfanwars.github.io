<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>IB Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
<style>
/* Exercise-book world: paper ground, fountain-pen ink, teacher's red pen for marking */
:root{
  --bg:#f3f0e8;--panel:#fbfaf6;--sunk:#ece8dd;--ink:#1c2230;--ink2:#3a4252;--mut:#646b78;--line:#ddd7c9;--line2:#cfc8b7;
  --acc:#24408e;--acc-ink:#fff;--acc2:#e3e8f5;--red:#b8321b;--red2:#f6e2dc;--good:#2e6b40;--good2:#e1eee3;--warn:#9a5a0c;--warn2:#f5ead6;
  --kt:#f4ecd6;--cs:#e8ecf3;--sh:0 1px 2px rgba(40,34,20,.06),0 6px 20px -8px rgba(40,34,20,.12);
  --r:10px;--f-ui:"Hanken Grotesk",system-ui,sans-serif;--f-read:"Newsreader",Georgia,serif
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#15171c;--panel:#1c1f26;--sunk:#121418;--ink:#ebe7dd;--ink2:#cfcabe;--mut:#9a9fa9;--line:#2c3039;--line2:#3a3f4a;
  --acc:#9db1ff;--acc-ink:#111526;--acc2:#252d45;--red:#ff8a6b;--red2:#3a221d;--good:#86d39a;--good2:#1d3123;--warn:#f0b35a;--warn2:#33281a;
  --kt:#2c2819;--cs:#20263a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5)}}
:root[data-theme=dark]{--bg:#15171c;--panel:#1c1f26;--sunk:#121418;--ink:#ebe7dd;--ink2:#cfcabe;--mut:#9a9fa9;--line:#2c3039;--line2:#3a3f4a;
  --acc:#9db1ff;--acc-ink:#111526;--acc2:#252d45;--red:#ff8a6b;--red2:#3a221d;--good:#86d39a;--good2:#1d3123;--warn:#f0b35a;--warn2:#33281a;
  --kt:#2c2819;--cs:#20263a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased;caret-color:var(--acc)}
::selection{background:color-mix(in srgb,var(--acc) 28%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,background .15s}
button:hover{border-color:var(--ink2)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button.pri:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:none}
button.ghost:hover{background:var(--sunk)}
button:disabled{opacity:.5;cursor:default}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input,textarea,select{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
input::placeholder,textarea::placeholder{color:var(--mut)}
textarea{resize:vertical;line-height:1.6}
a{color:var(--acc);text-underline-offset:3px}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:0 20px;height:56px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
header h1{font:600 18px/1 var(--f-read);margin:0 14px 0 0;letter-spacing:-.01em;cursor:pointer;white-space:nowrap}
header h1 b{color:var(--red);font-weight:600}
nav.tabs{display:flex;gap:2px;height:100%}
nav.tabs button{border:none;background:none;color:var(--mut);font-weight:500;border-radius:0;padding:0 12px;height:100%;box-shadow:inset 0 -2px 0 transparent}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.srch{margin-left:auto;flex:0 1 280px;position:relative}
.srch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut)}
#q{padding-left:32px;background:var(--panel)}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 56px)}
aside{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px;padding:14px 8px 40px}
aside .t{display:flex;width:100%;text-align:left;border:none;background:none;padding:5px 10px;border-radius:6px;color:var(--ink2);font-size:13.5px;line-height:1.35;gap:8px}
aside .t span:first-child{flex:1}
aside .t:hover{background:var(--sunk);color:var(--ink)}
aside .t.on{background:var(--acc2);color:var(--acc);font-weight:600}
aside .l1{font-weight:600;color:var(--ink);margin-top:10px}
aside .l2{padding-left:18px}
aside .l3{padding-left:30px;font-size:12.5px;color:var(--mut)}
aside .pg{color:var(--mut);font-size:11.5px;font-weight:400;font-variant-numeric:tabular-nums}
main{padding:24px 28px 80px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.reader{max-width:760px;margin:0 auto}
.rbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rbar .sp,.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:none;border-radius:0;padding:6px 12px;background:none}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.page{padding:36px 48px;font-family:var(--f-read);font-size:18px;line-height:1.7;box-shadow:var(--sh)}
.page>*:first-child{margin-top:0}
.page h1,.page h2,.page h3{font-family:var(--f-read);letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
.page h1{font-size:30px;font-weight:600;margin:.2em 0 .6em}
.page h2{font-size:23px;font-weight:600;margin:1.6em 0 .5em}
.page h3{font-size:18.5px;font-weight:600;margin:1.4em 0 .4em;font-family:var(--f-ui)}
.page p{max-width:68ch}
.page table{border-collapse:collapse;font:14px/1.45 var(--f-ui);width:100%;margin:14px 0;display:block;overflow-x:auto;font-variant-numeric:tabular-nums}
.page th,.page td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.page th{font-weight:600;border-bottom:1.5px solid var(--ink2)}
.page blockquote{margin:16px 0;padding:12px 16px;background:var(--sunk);border-radius:8px;font:15px/1.55 var(--f-ui)}
.co{margin:20px 0;border-radius:var(--r);padding:12px 16px 12px;font:15px/1.55 var(--f-ui);background:var(--sunk);border:1px solid var(--line)}
.co .ct{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px;display:flex;gap:6px;align-items:baseline}
.co .ct b{font-size:15px;color:var(--ink);font-weight:600}
.co p{margin:.3em 0}
.co.keyterm{background:var(--kt);border-color:color-mix(in srgb,var(--warn) 25%,var(--line))}
.co.case,.co.concept,.co.nos,.co.link{background:var(--cs);border-color:color-mix(in srgb,var(--acc) 22%,var(--line))}
.co.questions,.co.activity,.co.exercise,.co.challenge,.co.practice{background:var(--panel);border-color:var(--line2)}
.co.worked{background:var(--good2);border-color:color-mix(in srgb,var(--good) 25%,var(--line))}
.co.tip{background:var(--red2);border-color:color-mix(in srgb,var(--red) 22%,var(--line))}
.page em.fig{display:block;color:var(--mut);font:italic 14px/1.45 var(--f-ui);padding:10px 14px;background:var(--sunk);border-radius:8px;margin:14px 0}
.scan{width:100%;display:block;border-radius:var(--r);border:1px solid var(--line);background:#fff;box-shadow:var(--sh)}
mark{background:#ffe28a;color:#1c2230;border-radius:3px;padding:0 1px}
.pgnum{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.katex{font-size:1.04em}
.ask{position:fixed;right:20px;bottom:20px;z-index:8;gap:8px;filter:drop-shadow(0 6px 14px rgba(30,25,10,.18))}
.drawer{position:fixed;top:56px;right:0;bottom:0;width:min(460px,100%);z-index:9;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px -12px rgba(0,0,0,.18)}
.drawer .hd{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;gap:8px}
.drawer .hd span{flex:1;line-height:1.3}
.chat{flex:1;overflow:auto;padding:16px}
.msg{margin:0 0 14px;font-size:14.5px;line-height:1.6}
.msg.u{background:var(--acc2);margin-left:40px;padding:9px 13px;border-radius:12px 12px 4px 12px}
.msg.a{padding:0 2px}
.msg p{margin:.4em 0}.msg ul,.msg ol{margin:.3em 0;padding-left:20px}
.msg table{border-collapse:collapse;font-size:13.5px;margin:8px 0}.msg td,.msg th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left}
.chatin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chatin textarea{min-height:44px;max-height:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.qc{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.qc:hover{border-color:var(--ink2)}
.qc .qt{font-family:var(--f-read);font-size:16.5px;line-height:1.45}
.tag{display:inline-flex;align-items:center;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--ink2);font-weight:600;margin-right:4px;white-space:nowrap}
.tag.w{background:var(--warn2);color:var(--warn)}
.tag.g{background:var(--good2);color:var(--good)}
.tag.r{background:var(--red2);color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.filters select{width:auto}
.prac{max-width:880px;margin:0 auto}
.prac h2,.home h2{font:600 26px/1.2 var(--f-read);letter-spacing:-.015em;margin:0}
.qbig{padding:22px 26px;font-family:var(--f-read);font-size:19px;line-height:1.55}
.meta{color:var(--mut);font-size:13px}
.fb{padding:20px 24px;margin-top:14px}
.score{font:600 40px/1 var(--f-read);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--red)}
.fb h4{margin:18px 0 6px;font-size:13px;font-weight:600;color:var(--ink)}
.fb ul{margin:4px 0;padding-left:20px}.fb li{margin:3px 0}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.stat{padding:16px 18px}
.stat .n{font:600 30px/1.1 var(--f-read);font-variant-numeric:tabular-nums;margin-top:4px}
.flash{max-width:580px;margin:30px auto;padding:40px 32px;text-align:center;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:16px;box-shadow:var(--sh)}
.flash .term{font:600 30px/1.2 var(--f-read)}
.flash .def{font-family:var(--f-read);font-size:18px;text-align:left}
#login{max-width:340px;margin:16vh auto;padding:28px}
#login h2{margin:0 0 14px;font:600 26px var(--f-read)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hits .h{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.hits .h:last-child{border-bottom:none}
.hits .h:hover{background:var(--sunk)}
#menuBtn{display:none}
.lst>*{padding:11px 16px;border-bottom:1px solid var(--line)}.lst>*:last-child{border-bottom:none}
/* home */
.home{max-width:1120px;margin:0 auto}
.hhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:8px 0 22px;flex-wrap:wrap}
.hhead h2{font-size:34px}
.hgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
.hsec{margin-bottom:28px}
.hsec>h3{font:600 15px/1.3 var(--f-ui);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.hsec>h3 a{margin-left:auto;font-weight:500;font-size:13px}
.cont{display:flex;gap:20px;padding:20px 22px;align-items:center;cursor:pointer;box-shadow:var(--sh)}
.cont:hover{border-color:var(--ink2)}
.cont .ttl{font:600 21px/1.25 var(--f-read);margin:2px 0 6px;text-wrap:balance}
.spine{width:54px;height:72px;border-radius:3px 6px 6px 3px;flex:none;display:flex;align-items:flex-end;padding:6px;color:#fff;font:600 11px/1.1 var(--f-ui);background:var(--bk,#24408e);background-image:linear-gradient(90deg,rgba(0,0,0,.16),rgba(0,0,0,0) 22%);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bk{display:flex;gap:14px;padding:14px;align-items:center;cursor:pointer}
.bk:hover{border-color:var(--ink2)}
.bk b{display:block;font:600 16px/1.25 var(--f-read)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.act{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;align-items:flex-start;border-radius:var(--r)}
.act b{font-size:14.5px}
.act .n{font:600 24px/1.1 var(--f-read);font-variant-numeric:tabular-nums}
.agl .when{width:74px;flex:none;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.agl>div{display:flex;gap:10px;align-items:baseline;cursor:pointer}
.agl>div:hover{background:var(--sunk)}
/* planner */
.plan{display:grid;grid-template-columns:250px 1fr;gap:24px;max-width:1400px;margin:0 auto}
.pside h3{font-size:13px;font-weight:600;margin:20px 0 8px}
.due{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.due:last-child{border-bottom:none}
.due input{width:auto;margin-top:3px;accent-color:var(--acc)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:none}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.mh{padding:8px 8px;font-size:12px;font-weight:600;color:var(--mut);border-bottom:1px solid var(--line)}
.mc{min-height:112px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.mc:nth-child(7n){border-right:none}
.mc:hover{background:var(--sunk)}
.mc.out{background:color-mix(in srgb,var(--sunk) 55%,var(--panel))}.mc.out .mn{opacity:.45}
.mn{font-size:12px;font-weight:600;padding:2px 5px;width:max-content;border-radius:99px;font-variant-numeric:tabular-nums}
.today .mn,.wh .today b{background:var(--red);color:#fff;padding:2px 7px}
.chip{font-size:12px;line-height:1.3;padding:2px 6px;margin:2px 0;border-radius:5px;background:color-mix(in srgb,var(--c) 15%,var(--panel));color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center;gap:5px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.chip.k-exam{background:var(--c);color:#fff;font-weight:600}.chip.k-exam::before{background:#fff}
.chip.dn{opacity:.45;text-decoration:line-through}
.more{font-size:11px;color:var(--mut);padding:0 6px}
.wk{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.wh{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--line);font-size:13px}
.wh>div{padding:6px 8px;min-width:0}
.wad .mc{min-height:34px;border-bottom:none;border-right:none;border-left:1px solid var(--line)}
.wb{padding-top:8px;display:grid;grid-template-columns:52px repeat(7,1fr);position:relative;overflow:hidden}
.wt div{font-size:11px;color:var(--mut);text-align:right;padding-right:6px;transform:translateY(-6px);font-variant-numeric:tabular-nums}
.wcol{position:relative;border-left:1px solid var(--line);cursor:pointer}
.wcol.today{background:color-mix(in srgb,var(--acc2) 50%,transparent)}
.hl{border-top:1px solid var(--line)}
.ev{position:absolute;left:3px;right:3px;white-space:normal;overflow:hidden;z-index:1;display:block}
.ev::before{display:none}
.now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2}
.ag{display:flex;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.agd{width:110px;font-weight:600}.agd.today{color:var(--red)}
.agi{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.dnt{text-decoration:line-through;opacity:.5}
#modal{position:fixed;inset:0;background:rgba(20,18,12,.35);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px}
.mbox{width:min(520px,100%);padding:22px 24px;box-shadow:0 20px 60px -20px rgba(0,0,0,.4)}
.ef{display:flex;flex-direction:column;gap:10px}
.ef label{font-size:12px;color:var(--mut);flex:1}
.ef .rowl{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.ef .rowl input{width:auto;accent-color:var(--acc)}
.ef .seg{flex-wrap:wrap}
a.btn{display:inline-flex;padding:7px 12px;border-radius:8px;text-decoration:none;background:var(--acc);color:var(--acc-ink);font-weight:600}
@media (max-width:900px){
  .hgrid{grid-template-columns:1fr}
  .acts{grid-template-columns:repeat(3,1fr)}
  .plan{grid-template-columns:1fr}.pside{order:2}
  .mc{min-height:70px}.chip{font-size:10.5px;padding:1px 4px}.chip::before{display:none}
  .wh,.wb{grid-template-columns:36px repeat(7,minmax(0,1fr))}
  .wrap{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:56px;bottom:0;width:86%;max-width:320px;z-index:7;transform:translateX(-105%);transition:transform .2s;max-height:none;background:var(--panel);box-shadow:8px 0 30px rgba(0,0,0,.15)}
  aside.open{transform:none}
  #menuBtn{display:inline-flex}
  main{padding:16px 16px 90px}
  .page{padding:22px 18px;font-size:17px}
  header{flex-wrap:wrap;height:auto;padding:8px 12px;row-gap:6px}
  nav.tabs{order:9;width:100%;overflow-x:auto;height:38px}
  nav.tabs button{white-space:nowrap}
  .srch{flex:1 1 140px}
  .acts{grid-template-columns:1fr}
  .act{flex-direction:row;align-items:baseline;gap:10px}.act .meta{width:72px}.act b{margin-left:auto}
  #tutor .lbl{display:none}
  .hhead h2{font-size:28px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-l" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
<symbol id="i-r" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
<symbol id="i-cap" viewBox="0 0 24 24"><path d="M3 9l9-4 9 4-9 4z"/><path d="M7 11v5c0 1.5 2.5 3 5 3s5-1.5 5-3v-5"/></symbol>
</svg>
<div id="login" class="card hide">
  <h2>IB Study</h2>
  
  <form id="lf" class="row" style="flex-direction:column;align-items:stretch"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><button class="pri">Open</button><div id="le" class="meta" style="color:var(--bad)"></div></form>
</div>
<div id="app" class="hide">
<header>
  <button id="menuBtn" class="ghost" aria-label="Contents"><svg class="i"><use href="#i-menu"/></svg></button>
  <h1 id="home">IB <b>Study</b></h1>
  <nav class="tabs"><button data-tab="home" class="on">Home</button><button data-tab="lib">Library</button><button data-tab="prac">Practice</button><button data-tab="terms">Key terms</button><button data-tab="prog">Progress</button><button data-tab="plan">Planner</button></nav>
  <div class="srch"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search books"></div>
  <button class="pri" id="tutor"><svg class="i"><use href="#i-spark"/></svg><span class="lbl">Ask Claude</span></button>
</header>
<div class="wrap">
  <aside id="toc"></aside>
  <main id="main"></main>
</div>
</div>
<div id="drawer" class="drawer hide"><div class="hd"><span id="dTitle">Ask Claude</span><button class="ghost" id="dClose" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div><div class="chat" id="chat"></div><form class="chatin" id="cf"><textarea id="ci" rows="1" placeholder="Message"></textarea><button class="pri">Send</button></form></div>
<script>
'use strict';
const RELAY = (new URLSearchParams(location.search).get('relay') || 'https://jjfanwars-relay.businessautomationvic.workers.dev').replace(/^ws/, 'http');
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const LS = {get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
let PASS = LS.get('ib-pass', '');
async function api(op, body = {}) {
  const r = await fetch(RELAY + '/ib/' + op, {method: 'POST', body: JSON.stringify({...body, pass: PASS})});
  const j = await r.json().catch(() => ({err: 'HTTP ' + r.status}));
  if (r.status === 403 && op !== 'login' && PASS) { LS.set('ib-pass', ''); PASS = ''; location.reload(); }
  if (j && j.err) throw new Error(j.err);
  return j;
}
const S = {books: [], qs: [], book: null, tab: 'lib', n: 1, view: LS.get('ib-view', 'text'), cache: new Map(), hl: '', prog: LS.get('ib-prog', {att: {}, terms: {}, last: null})};

// ---------- markdown ----------
const CO = {keyterm: 'Key term', concept: 'Concept', case: 'Case study', activity: 'Activity', tok: 'TOK', atl: 'ATL skills', tip: 'Assessment tip', questions: 'Questions', box: ''};
// maths: books flagged math (and their chats) render $...$ / $$...$$ with KaTeX + mhchem; other books keep $ as money
let MATH = false;
function mathOut(src) {
  if (!MATH || !window.katex) return {src, put: h => h};
  const M = [], hold = (tex, disp) => { M.push([tex, disp]); return '\u0000' + (M.length - 1) + '\u0000'; };
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => hold(t, true)).replace(/\\\[([\s\S]+?)\\\]/g, (m, t) => hold(t, true))
    .replace(/\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g, (m, t) => hold(t, false)).replace(/\\\(([\s\S]+?)\\\)/g, (m, t) => hold(t, false));
  return {src, put: h => h.replace(/\u0000(\d+)\u0000/g, (m, i) => { const [t, d] = M[+i]; try { return katex.renderToString(t, {displayMode: d, throwOnError: false}); } catch (e) { return esc(t); } })};
}
const mdx = (src, inline) => { const m = mathOut(src); return m.put(inline ? marked.parseInline(m.src) : marked.parse(m.src)); };
function md(src) {
  src = src.replace(/^<!--.*?-->\s*/s, '').replace(/^\*\[(.+?)\]\*\s*$/gm, (m, t) => '<em class="fig">' + esc(t) + '</em>');
  const mo = mathOut(src); src = mo.src;
  let html = mo.put(marked.parse(src, {gfm: true, breaks: false}));
  html = html.replace(/<blockquote>\s*<p>\[!(\w+)\]\s*([^\n<]*)\n?([\s\S]*?)<\/blockquote>/g, (m, type, title, rest) => {
    type = type.toLowerCase(); const lab = CO[type] ?? type;
    return `<div class="co ${type}"><div class="ct">${lab}${title ? '<b>' + title + '</b>' : ''}</div><p>${rest}</div>`;
  });
  return html.replace(/<p><\/p>/g, '');
}
function highlight(el, q) {
  if (!q) return; const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  let first = null;
  for (const t of nodes) { if (!re.test(t.data)) continue; re.lastIndex = 0; const s = document.createElement('span'); s.innerHTML = esc(t.data).replace(re, m => '<mark>' + m + '</mark>'); t.replaceWith(s); first = first || s; }
  if (first) setTimeout(() => first.scrollIntoView({block: 'center'}), 50);
}

// ---------- data ----------
async function getPage(b, n) {
  const k = b + ':' + n; if (S.cache.has(k)) return S.cache.get(k);
  const p = api('page', {b, n}).catch(e => { S.cache.delete(k); throw e; }); S.cache.set(k, p); return p;
}
const imgUrl = (b, n) => `${RELAY}/ib/img?b=${b}&n=${n}&t=${encodeURIComponent(PASS)}`;
const bookOf = id => S.books.find(b => b.id === id);
const secOf = (b, n) => { let s = null; for (const t of b.toc) { if (t.n > n) break; if (t.lvl <= 3) s = t; } return s; };
let syncT = 0;
function saveProg() { LS.set('ib-prog', S.prog); clearTimeout(syncT); syncT = setTimeout(() => api('sync', {data: S.prog}).catch(() => {}), 1500); }
async function pullProg() {
  try { const r = await api('sync'); if (!r || !r.att) return;
    for (const [k, v] of Object.entries(r.att)) if (!S.prog.att[k]) S.prog.att[k] = v; else { const ids = new Set(S.prog.att[k].map(a => a.t)); for (const a of v) if (!ids.has(a.t)) S.prog.att[k].push(a); }
    for (const [k, v] of Object.entries(r.terms || {})) if (!S.prog.terms[k] || S.prog.terms[k].t < v.t) S.prog.terms[k] = v;
    LS.set('ib-prog', S.prog);
  } catch (e) {}
}

// ---------- shell ----------
function tab(t) {
  S.tab = t; document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#toc').classList.toggle('hide', t !== 'lib'); document.querySelector('.wrap').style.gridTemplateColumns = t === 'lib' ? '' : '1fr';
  closeDrawer(); ({home: renderHome, lib: () => openPage(S.book.id, S.n), prac: renderPrac, terms: renderTerms, prog: renderProg, plan: () => renderPlan(true)})[t]();
}
function renderToc() {
  const b = S.book;
  $('#toc').innerHTML = `<div style="padding:4px 10px 8px"><select id="bk">${S.books.map(x => `<option value="${x.id}" ${x.id === b.id ? 'selected' : ''}>${esc(x.title)}</option>`).join('')}</select></div>` +
    b.toc.filter(t => (t.lvl <= 2 || (t.lvl === 3 && t.num)) && !(b.math && /^[ivxlc]+$/i.test(t.bp)) && !/^Exercises?$/i.test(t.title)).map(t => `<button class="t l${t.lvl}" data-n="${t.n}"><span>${t.num ? esc(t.num.replace(/^(Structure|Reactivity)\s+/, (m, w) => w[0])) + ' ' : ''}${esc(t.title)}</span><span class="pg">${t.bp && t.bp !== '-' ? esc(t.bp) : ''}</span></button>`).join('');
  $('#bk').onchange = e => { S.book = bookOf(e.target.value); renderToc(); openPage(S.book.id, S.book.start || 1); };
}
function markToc() {
  let on = null; for (const el of document.querySelectorAll('#toc .t')) { el.classList.remove('on'); if (+el.dataset.n <= S.n) on = el; }
  if (on) { on.classList.add('on'); if (S.tab === 'lib') on.scrollIntoView({block: 'nearest'}); }
}

// ---------- library ----------
async function openPage(b, n, hl) {
  const B = bookOf(b); MATH = !!B.math; n = Math.max(1, Math.min(B.pages, n)); S.n = n; S.hl = hl || '';
  S.prog.last = {b, n}; LS.set('ib-prog', S.prog);
  if (S.tab !== 'lib') { S.tab = 'lib'; tab('lib'); return; }
  const sec = secOf(B, n);
  $('#main').innerHTML = `<div class="reader"><div class="rbar">
    <button id="pv" aria-label="Previous page"><svg class="i"><use href="#i-l"/></svg></button><span class="pgnum" id="pn"></span><button id="nx" aria-label="Next page"><svg class="i"><use href="#i-r"/></svg></button>
    <span class="sp"></span>${B.file ? `<a class="meta" href="${RELAY}/ib/file?b=${b}&t=${encodeURIComponent(PASS)}" download title="Download the whole textbook PDF" style="display:inline-flex;gap:4px;align-items:center;text-decoration:none"><svg class="i"><use href="#i-dl"/></svg>PDF</a>` : ''}<div class="seg"><button data-v="text">Text</button><button data-v="scan">Scan</button></div></div>
    <div id="pg" class="card page"><span class="spin"></span></div><div class="rbar" style="margin-top:12px"><button id="pv2"><svg class="i"><use href="#i-l"/></svg>Previous</button><span class="sp"></span><button id="nx2">Next<svg class="i"><use href="#i-r"/></svg></button></div></div>
    <div class="ask row"><button id="teach"><svg class="i"><use href="#i-cap"/></svg>Teach me</button><button class="pri" id="askP"><svg class="i"><use href="#i-spark"/></svg>Ask</button></div>`;
  $('#pv').onclick = $('#pv2').onclick = () => openPage(b, n - 1); $('#nx').onclick = $('#nx2').onclick = () => openPage(b, n + 1);
  document.querySelectorAll('.seg button').forEach(x => { x.classList.toggle('on', x.dataset.v === S.view); x.onclick = () => { S.view = x.dataset.v; LS.set('ib-view', S.view); openPage(b, n, hl); }; });
  $('#askP').onclick = () => openChat({title: 'Ask about p. ' + ($('#pn').dataset.bp || n), book: b, pages: [n - 1, n, n + 1].filter(x => x >= 1 && x <= B.pages), intro: `I'm reading page ${$('#pn').dataset.bp || n}${sec ? ' (' + (sec.num ? sec.num + ' ' : '') + sec.title + ')' : ''}. `});
  $('#teach').onclick = () => { const secN = sec ? sec.n : n, nxt = B.toc.find(t => t.n > secN && t.lvl <= (sec ? sec.lvl : 3)), endN = nxt ? Math.min(nxt.n, secN + 8) : secN + 3, ps = []; for (let i = secN; i <= endN && i <= B.pages; i++) ps.push(i);
    openChat({title: 'Lesson: ' + (sec ? (sec.num ? sec.num + ' ' : '') + sec.title : 'p. ' + n), book: b, pages: ps, fixed: true, intro: ''}); sendChat(`Teach me ${sec ? (sec.num ? sec.num + ' ' : '') + sec.title : 'this page'} from my textbook, step by step. Start with the big idea and an analogy, then go through it in small chunks and check my understanding as we go. Don't dump everything at once.`); };
  markToc(); window.scrollTo(0, 0); $('#toc').classList.remove('open');
  try {
    const p = await getPage(b, n); if (S.n !== n) return;
    const bp = p.bp && p.bp !== '-' ? p.bp : ''; $('#pn').textContent = (bp ? 'p. ' + bp + ' · ' : '') + `${n} / ${B.pages}`; $('#pn').dataset.bp = bp;
    const el = $('#pg');
    if (S.view === 'scan') { el.className = ''; el.innerHTML = `<img class="scan" alt="Page ${esc(bp)}" src="${imgUrl(b, n)}">`; }
    else { el.className = 'card page'; el.innerHTML = md(p.md || '*(empty page)*') + ``; highlight(el, S.hl); }
    if (n < B.pages) getPage(b, n + 1).catch(() => {});
  } catch (e) { $('#pg').innerHTML = '<p>Could not load: ' + esc(e.message) + '</p>'; }
}
let searchT = 0;
async function search(q) {
  if (q.trim().length < 2) return;
  S.tab = 'search'; document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('on')); $('#toc').classList.add('hide'); document.querySelector('.wrap').style.gridTemplateColumns = '1fr';
  $('#main').innerHTML = '<div class="reader"><p><span class="spin"></span> Searching…</p></div>';
  const {hits} = await api('search', {q});
  if ($('#q').value !== q) return;
  $('#main').innerHTML = `<div class="reader"><h2 style="margin-top:0">${hits.length}${hits.length === 60 ? '+' : ''} pages mention “${esc(q)}”</h2><div class="card hits">${hits.map(h => { const B = bookOf(h.b), s = B && secOf(B, h.n);
    return `<div class="h" data-b="${h.b}" data-n="${h.n}"><div class="row"><b>p. ${esc(h.bp)}</b><span class="meta">${s ? esc((s.num ? s.num + ' ' : '') + s.title) : ''}</span></div><div class="meta">…${esc(h.s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => '<mark>' + m + '</mark>')}…</div></div>`; }).join('') || '<p style="padding:14px">Nothing found.</p>'}</div></div>`;
  document.querySelectorAll('.hits .h').forEach(h => h.onclick = () => { S.view = 'text'; S.tab = 'lib'; tab('lib'); openPage(h.dataset.b, +h.dataset.n, q); });
}

// ---------- Claude chat drawer ----------
let CH = null;
function openChat(o) {
  MATH = !!(o.book && (bookOf(o.book) || {}).math);
  CH = {...o, msgs: o.msgs || []}; $('#dTitle').textContent = o.title || 'Ask Claude'; $('#drawer').classList.remove('hide'); drawChat(); $('#ci').focus();
}
function closeDrawer() { $('#drawer').classList.add('hide'); CH = null; }
function drawChat(busy) {
  $('#chat').innerHTML = '' +
    CH.msgs.filter(m => !m.hidden).map(m => `<div class="msg ${m.role === 'user' ? 'u' : 'a'}">${m.role === 'user' ? esc(m.show || m.content).replace(/\n/g, '<br>') : mdx(m.content)}</div>`).join('') + (busy ? '<div class="msg a"><span class="spin"></span> Thinking…</div>' : '');
  $('#chat').scrollTop = 1e9;
}
async function sendChat(text) {
  if (!CH || !text.trim()) return;
  const first = !CH.msgs.some(m => m.role === 'user');
  CH.msgs.push({role: 'user', content: (first && CH.intro ? CH.intro : '') + text, show: text}); drawChat(true);
  if (CH.agent) {
    try {
      const n = new Date(), r = await api('agent', {today: ymd(n), dow: n.toLocaleDateString('en', {weekday: 'long'}), now: n.toTimeString().slice(0, 5), tz: Intl.DateTimeFormat().resolvedOptions().timeZone, messages: CH.msgs.map(m => ({role: m.role, content: m.content}))});
      CH.msgs.push({role: 'assistant', content: r.text || '(no reply)'}); if (r.items) { S.plan = r.items; LS.set('ib-plan', S.plan); drawPlan(); }
    } catch (e) { CH.msgs.push({role: 'assistant', content: '**Error:** ' + e.message}); }
    S.planChat = CH.msgs; drawChat(); return;
  }
  try {
    const r = await api('ask', {mode: 'chat', book: CH.book, pages: CH.pages, find: !CH.fixed, messages: CH.msgs.map(m => ({role: m.role, content: m.content}))});
    if (r.pages) { CH.pages = r.pages; CH.fixed = true; } // keep the same pages for the rest of the chat so the prompt cache hits
    CH.msgs.push({role: 'assistant', content: r.text || r.err || '(no reply)'});
    if (CH.onMsg) CH.onMsg(CH.msgs);
  } catch (e) { CH.msgs.push({role: 'assistant', content: '**Error:** ' + e.message}); }
  drawChat();
}

// ---------- practice ----------
const KIND = {essay: 'Paper 2 essay', p1: 'Paper 1', short: 'Short answer', activity: 'Activity', discuss: 'Discussion', mcq: 'Multiple choice', exercise: 'Exercise', challenge: 'Challenge', structured: 'Exam question'};
const RUBRIC = {
  essay: `You are marking an IB Global Politics Paper 2 essay (15 marks) using the IB markbands: 0 = does not reach a standard; 1-3 = little understanding of the demands, little relevant knowledge, few or no examples, no or minimal argument or evaluation; 4-6 = some understanding, some relevant knowledge and examples but mostly descriptive, limited argument, few perspectives; 7-9 = mostly understands the demands, mostly accurate relevant knowledge with some appropriate examples, attempts structure and some analysis, some awareness of different perspectives, partial evaluation; 10-12 = understands the demands, accurate relevant knowledge, appropriate examples well used, clear structure, analysis with some evaluation, different perspectives considered; 13-15 = in-depth understanding, accurate and detailed knowledge, effective, varied and specific examples, a well-structured argument that is analytical and consistently evaluative, different perspectives explored and a well-supported conclusion. Judge the essay against the exact command term (to what extent, evaluate, compare and contrast, discuss, examine). If the answer is a plan or notes rather than a full essay, mark it as a plan and say what mark the essay it describes could reach.`,
  p1: `You are marking an IB Global Politics Paper 1 (source-based) answer. Mark strictly against the command term and the marks given for the question.`,
  short: `You are marking a short IB Global Politics answer. Award marks out of the stated total for accurate, relevant points and correct use of key terms; if no total is given, mark out of 10 for accuracy, depth, use of key terms and use of examples.`,
};
RUBRIC.activity = RUBRIC.discuss = RUBRIC.short;
RUBRIC.mcq = `You are checking an IB Chemistry multiple-choice answer (1 mark). Work out the correct option yourself carefully first. Award 1 if the student's letter is correct, else 0. Explain why the right answer is right and why the student's choice (if wrong) is a tempting mistake. If the student gave reasoning, comment on it.`;
RUBRIC.exercise = RUBRIC.challenge = RUBRIC.structured = `You are marking an IB Chemistry HL answer like an IB examiner using a markscheme you write yourself: first solve the question fully and decide the marking points (one mark per correct step, value with correct units and significant figures, correct equation with state symbols where needed, correct explanation point). Award marks out of the total given (if none is given, out of the number of marking points you decided, max 10). Apply error carried forward (ECF) for later steps that correctly use an earlier wrong value. Show the full worked solution in "plan". Use LaTeX in $...$ and mhchem \\ce{} for chemistry.`;
const MARK_FMT = `\n\nReply with ONLY a JSON object, no code fence: {"score": integer, "max": integer, "band": "markband or level, e.g. 7-9", "verdict": "one sentence overall judgement", "good": ["specific things that earned marks"], "missed": ["specific things that were missing, wrong or weak, most important first"], "fix": ["concrete actions to lift the mark next time"], "plan": "a short model answer outline as markdown bullets (for essays: thesis, 3-4 paragraph points with an example each, conclusion)", "terms": ["key terms from the course the answer should have used"]}. Quote the student's own words when pointing out a weakness. Cite textbook pages as p. N where useful.`;
const front = q => /^[ivxlc]+$/i.test(q.bp || '');
const preview = t => { const cut = t.split(/\n\s*\n|\n\s*\||\n\s*(?:- )?\**[A-D]\.\s/)[0]; if (cut.length <= 240) return cut + (cut.length < t.length ? ' …' : ''); let c = cut.slice(0, 240); if ((c.match(/\$/g) || []).length % 2) c = c.slice(0, c.lastIndexOf('$')); return c.replace(/\s+\S*$/, '') + '…'; };
const qMax = q => q.marks || (q.kind === 'essay' ? 15 : q.kind === 'mcq' ? 1 : 10);
const attOf = id => S.prog.att[id] || [];
const best = id => attOf(id).reduce((m, a) => a.max ? Math.max(m, a.score / a.max) : m, -1);
function topicName(B, t) { const s = B.toc.find(x => x.num === t); return s ? t + ' ' + s.title : t; }
function renderPrac(filter) {
  const F = filter || (S.pf = S.pf || {book: S.book.id, kind: '', topic: '', st: ''});
  const B = bookOf(F.book) || S.book, qs = S.qs.filter(q => q.book === B.id && !front(q));
  const topics = [...new Set(qs.map(q => q.topic).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
  const list = qs.filter(q => (!F.kind || q.kind === F.kind) && (!F.topic || (q.topic || '').startsWith(F.topic)) &&
    (!F.st || (F.st === 'new' ? !attOf(q.id).length : F.st === 'weak' ? (best(q.id) >= 0 && best(q.id) < .6) : best(q.id) >= .6)));
  $('#main').innerHTML = `<div class="prac" style="max-width:1100px">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Practice</h2><button class="pri" id="rnd">Random question</button></div>
    <p class="meta">${qs.length} questions</p>
    <div class="filters"><select id="fk"><option value="">All types</option>${[...new Set(qs.map(q => q.kind))].map(k => `<option value="${k}" ${F.kind === k ? 'selected' : ''}>${KIND[k] || k}</option>`).join('')}</select>
    <select id="ft"><option value="">All topics</option>${topics.map(t => `<option value="${t}" ${F.topic === t ? 'selected' : ''}>${esc(topicName(B, t))}</option>`).join('')}</select>
    <select id="fs"><option value="">Any status</option><option value="new" ${F.st === 'new' ? 'selected' : ''}>Not tried</option><option value="weak" ${F.st === 'weak' ? 'selected' : ''}>Weak (under 60%)</option><option value="good" ${F.st === 'good' ? 'selected' : ''}>Done well</option></select></div>
    <div class="grid">${list.map(q => { const bs = best(q.id); return `<div class="card qc" data-id="${q.id}"><div>${'<span class="tag">' + (KIND[q.kind] || q.kind) + '</span>'}${q.marks ? '<span class="tag">' + q.marks + (q.marks === 1 ? ' mark' : ' marks') + '</span>' : ''}${bs >= 0 ? `<span class="tag ${bs < .6 ? 'w' : 'g'}">best ${Math.round(bs * 100)}%</span>` : ''}</div><div class="qt">${(MATH = !!B.math, mdx(preview(q.text), true))}</div><div class="meta">${esc(q.topic ? topicName(B, q.topic) : '')}${q.bp ? ' · p. ' + q.bp : ''}</div></div>`; }).join('') || '<p>No questions match.</p>'}</div></div>`;
  $('#fk').onchange = e => { F.kind = e.target.value; renderPrac(F); }; $('#ft').onchange = e => { F.topic = e.target.value; renderPrac(F); }; $('#fs').onchange = e => { F.st = e.target.value; renderPrac(F); };
  document.querySelectorAll('.qc').forEach(c => c.onclick = () => openQ(c.dataset.id));
  $('#rnd').onclick = () => { const pool = list.length ? list : qs; if (pool.length) openQ(pool[Math.random() * pool.length | 0].id); };
}
function openQ(id) {
  const q = S.qs.find(x => x.id === id), B = bookOf(q.book), draft = LS.get('ib-d-' + id, ''), prev = attOf(id); MATH = !!B.math;
  $('#main').innerHTML = `<div class="prac"><div class="row" style="margin-bottom:10px"><button id="back"><svg class="i"><use href="#i-l"/></svg>All questions</button><span class="sp" style="flex:1"></span>${q.n ? `<button id="src">Open in textbook (p. ${esc(q.bp)})</button>` : ''}</div>
    <div class="card qbig"><div style="font-family:var(--f-ui);margin-bottom:10px"><span class="tag">${KIND[q.kind] || q.kind}</span>${q.marks ? '<span class="tag">' + q.marks + (q.marks === 1 ? ' mark' : ' marks') + '</span>' : ''}<span class="meta">${esc(q.topic ? topicName(B, q.topic) : '')}</span></div>${mdx(q.text)}${q.ctx ? `<div class="meta" style="font-family:var(--f-ui);margin-top:10px">${esc(q.ctx)}</div>` : ''}</div>
    <div style="margin-top:14px"><textarea id="ans" rows="${q.kind === 'essay' ? 18 : 8}" placeholder="Answer">${esc(draft)}</textarea>

  document.querySelectorAll('[data-done]').forEach(cb => cb.onchange = () => { const it = S.plan.find(x => x.id === cb.dataset.done); it.done = true; savePlan(); setTimeout(drawPlan, 250); });
  $('#pAsk').onclick = () => openChat({title: 'Planner assistant', agent: true, msgs: S.planChat || []});
  if ($('#pIcs')) $('#pIcs').onclick = e => { e.preventDefault(); const url = RELAY.replace(/^http/, 'webcal') + '/ib/cal.ics?t=' + encodeURIComponent(PASS);
    openModal(`<h3 style="margin-top:0">Calendar feed</h3><input readonly value="${esc(url)}" onclick="this.select()"><p class="meta">Google Calendar: Other calendars → From URL (use https://).</p><div class="row"><a class="btn pri" href="${esc(url)}">Open in calendar app</a><button id="mClose">Close</button></div>`); };
}
function openModal(html) {
  let m = $('#modal'); if (!m) { m = document.createElement('div'); m.id = 'modal'; document.body.appendChild(m); m.onclick = e => { if (e.target === m) m.remove(); }; }
  m.innerHTML = `<div class="card mbox">${html}</div>`; const c = $('#mClose'); if (c) c.onclick = () => m.remove(); return m;
}
function editItem(it, date, time) {
  const isNew = !it; it = it || {kind: 'homework', title: '', date: date || todayS(), time: time || ''};
  if (isNew && time) it.kind = 'event';
  const subs = [...new Set(S.plan.map(x => x.subject).filter(Boolean))];
  const m = openModal(`<h3 style="margin-top:0">${isNew ? 'Add' : 'Edit'}</h3><form id="ef" class="ef">
    <div class="seg" style="margin-bottom:10px">${Object.entries(PK).map(([k, l]) => `<button type="button" data-k="${k}" class="${it.kind === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <input name="title" placeholder="What is it?" value="${esc(it.title)}" required autofocus>
    <input name="subject" list="subs" placeholder="Subject (optional)" value="${esc(it.subject || '')}"><datalist id="subs">${subs.map(s => `<option value="${esc(s)}">`).join('')}</datalist>
    <div class="row"><label>Date<input type="date" name="date" value="${it.date}" required></label><label>Start<input type="time" name="time" value="${it.time || ''}"></label><label>End<input type="time" name="end" value="${it.end || ''}"></label></div>
    <div class="row"><label class="rowl"><input type="checkbox" name="rep" ${it.rep === 'weekly' ? 'checked' : ''}> Repeats weekly</label><label>until<input type="date" name="until" value="${it.until || ''}"></label></div>
    <textarea name="notes" rows="3" placeholder="Notes">${esc(it.notes || '')}</textarea>
    ${isNew ? '' : `<label class="rowl"><input type="checkbox" name="done" ${it.done ? 'checked' : ''}> Done</label>`}
    <div class="row" style="margin-top:6px">${isNew ? '' : '<button type="button" id="eDel" style="color:var(--bad)">Delete</button>'}<span style="flex:1"></span><button type="button" id="mClose">Cancel</button><button class="pri">Save</button></div></form>`);
  let kind = it.kind;
  m.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { kind = b.dataset.k; m.querySelectorAll('[data-k]').forEach(x => x.classList.toggle('on', x === b)); });
  $('#ef').onsubmit = e => { e.preventDefault(); const f = new FormData(e.target), o = isNew ? {id: Math.random().toString(36).slice(2, 8)} : it;
    o.kind = kind; for (const k of ['title', 'subject', 'date', 'time', 'end', 'until', 'notes']) { const v = (f.get(k) || '').trim(); if (v) o[k] = v; else delete o[k]; }
    if (f.get('rep')) o.rep = 'weekly'; else { delete o.rep; delete o.until; } if (f.get('done')) o.done = true; else delete o.done;
    if (isNew) S.plan.push(o); savePlan(); m.remove(); drawPlan(); };
  if ($('#eDel')) $('#eDel').onclick = () => { if (!confirm('Delete "' + it.title + '"?')) return; S.plan = S.plan.filter(x => x !== it); savePlan(); m.remove(); drawPlan(); };
}

// ---------- home ----------
const BOOKC = {glopo: '#7a2e2e', chem: '#1f5f5b'};
const bookC = b => BOOKC[b.id] || subjColor(b.subject);
const spine = b => `<div class="spine" style="--bk:${bookC(b)}">${esc((b.subject || b.title).split(' ').map(w => w[0]).join('').slice(0, 3))}</div>`;
async function renderHome() {
  if (!S.plan) { S.plan = LS.get('ib-plan', []); loadPlan().then(() => { LS.set('ib-plan', S.plan); if (S.tab === 'home') drawHome(); }); }
  drawHome();
}
function drawHome() {
  const now = new Date(), h = now.getHours(), t = todayS();
  const last = S.prog.last, LB = last && bookOf(last.b), sec = LB && secOf(LB, last.n);
  const allQ = S.qs, tried = allQ.filter(q => attOf(q.id).length);
  const termsDue = S.books.reduce((n, B) => n + (B.terms || []).filter(x => { const s = S.prog.terms[B.id + ':' + x.k]; return !s || Date.now() >= s.t + BOXDAYS[s.box] * 864e5; }).length, 0);
  const m = dayMap(t, addD(t, 14)), up = [];
  for (const d of Object.keys(m).sort()) for (const it of m[d]) if (it.kind !== 'class') up.push([d, it]);
  const over = (S.plan || []).filter(it => (it.kind === 'homework' || it.kind === 'task') && !it.done && it.date < t);
  const rel = d => { const n = Math.round((pd(d) - pd(t)) / 864e5); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n < 7 ? fmtD(d, {weekday: 'short'}) : fmtD(d, {day: 'numeric', month: 'short'}); };
  const recent = allQ.flatMap(q => attOf(q.id).map(a => ({q, a}))).sort((x, y) => y.a.t - x.a.t).slice(0, 4);
  $('#main').innerHTML = `<div class="home">
    <div class="hhead"><h2>${h < 12 ? 'Morning' : h < 18 ? 'Afternoon' : 'Evening'}</h2><span class="meta">${now.toLocaleDateString(undefined, {weekday: 'long', day: 'numeric', month: 'long'})}</span></div>
    <div class="hgrid"><div>
      ${LB ? `<section class="hsec"><h3>Continue reading</h3><div class="card cont" id="hCont">${spine(LB)}<div style="min-width:0"><div class="meta">${esc(LB.title)}</div><div class="ttl">${sec ? esc(sec.title) : 'Page ' + last.n}</div><div class="meta">${sec && sec.num ? esc(sec.num) + ' · ' : ''}page ${last.n} of ${LB.pages}</div></div></div></section>` : ''}
      <section class="hsec"><div class="acts">
        <button class="card act" id="hPrac"><span class="meta">Practice</span><span class="n">${tried.length}<span class="meta"> / ${allQ.length}</span></span><b>Random question</b></button>
        <button class="card act" id="hTerms"><span class="meta">Key terms</span><span class="n">${termsDue}</span><b>${termsDue ? 'Review due cards' : 'All caught up'}</b></button>
        <button class="card act" id="hTeach"><span class="meta">Lesson</span><span class="n" style="font-size:17px;line-height:1.3">${sec ? esc(sec.title.length > 34 ? sec.title.slice(0, 34) + '…' : sec.title) : 'Current section'}</span><b>Teach me this</b></button>
      </div></section>
      <section class="hsec"><h3>Books</h3><div class="shelf">${S.books.map(B => `<div class="card bk" data-b="${B.id}">${spine(B)}<div style="min-width:0;flex:1"><b>${esc(B.title)}</b><span class="meta">${B.pages} pages · ${S.qs.filter(q => q.book === B.id).length} questions</span>${B.file ? `<div><a class="meta" href="${RELAY}/ib/file?b=${B.id}&t=${encodeURIComponent(PASS)}" download onclick="event.stopPropagation()">Download PDF</a></div>` : ''}</div></div>`).join('')}</div></section>
    </div><div>
      <section class="hsec"><h3>Coming up<a href="#" id="hPlan">Planner</a></h3><div class="card lst agl">${over.map(it => `<div data-id="${it.id}"><span class="when" style="color:var(--red)">Overdue</span><span><span class="dot" style="background:${subjColor(it.subject)}"></span>${esc(it.title)}</span></div>`).join('')}${up.slice(0, 8).map(([d, it]) => `<div data-id="${it.id}"><span class="when">${rel(d)}${it.time ? '<br>' + it.time : ''}</span><span><span class="dot" style="background:${subjColor(it.subject)}"></span>${esc(it.title)}${it.kind === 'exam' ? ' <span class="tag r">Exam</span>' : ''}</span></div>`).join('') || (over.length ? '' : '<div class="meta" style="cursor:default">Nothing in the next two weeks</div>')}</div></section>
      ${recent.length ? `<section class="hsec"><h3>Recent marks<a href="#" id="hProg">Progress</a></h3><div class="card lst agl">${recent.map(({q, a}) => `<div data-q="${q.id}"><span class="when num" style="color:${a.score / a.max < .4 ? 'var(--red)' : a.score / a.max < .7 ? 'var(--warn)' : 'var(--good)'};font-weight:600">${a.score}/${a.max}</span><span>${esc(q.text.replace(/\$[^$]*\$/g, '…').slice(0, 80))}${q.text.length > 80 ? '…' : ''}</span></div>`).join('')}</div></section>` : ''}
    </div></div></div>`;
  const go = t2 => { S.tab = t2; tab(t2); };
  if ($('#hCont')) $('#hCont').onclick = () => { S.book = LB; renderToc(); S.tab = 'lib'; tab('lib'); openPage(LB.id, last.n); };
  $('#hPrac').onclick = () => { go('prac'); $('#rnd') && $('#rnd').click(); };
  $('#hTerms').onclick = () => { go('terms'); if (termsDue && $('#st')) $('#st').click(); };
  $('#hTeach').onclick = () => { if (LB) { S.book = LB; renderToc(); } go('lib'); setTimeout(() => $('#teach') && $('#teach').click(), 50); };
  $('#hPlan').onclick = e => { e.preventDefault(); go('plan'); };
  if ($('#hProg')) $('#hProg').onclick = e => { e.preventDefault(); go('prog'); };
  document.querySelectorAll('.bk').forEach(el => el.onclick = () => { const B = bookOf(el.dataset.b); S.book = B; renderToc(); const n = S.prog.last && S.prog.last.b === B.id ? S.prog.last.n : (B.start || 1); S.n = n; go('lib'); openPage(B.id, n); });
  document.querySelectorAll('.agl [data-id]').forEach(el => el.onclick = () => { go('plan'); setTimeout(() => editItem(S.plan.find(x => x.id === el.dataset.id)), 30); });
  document.querySelectorAll('.agl [data-q]').forEach(el => el.onclick = () => { go('prac'); openQ(el.dataset.q); });
}

// ---------- boot ----------
async function boot() {
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#main').innerHTML = '<p><span class="spin"></span> Loading…</p>';
  try { [S.books, S.qs] = await Promise.all([api('books'), api('qs')]); } catch (e) { $('#main').innerHTML = '<p>Could not load: ' + esc(e.message) + '</p>'; return; }
  pullProg();
  const last = S.prog.last; S.book = (last && bookOf(last.b)) || S.books[0];
  if (!S.book) { $('#main').innerHTML = '<p>No books uploaded yet.</p>'; return; }
  S.n = last && last.b === S.book.id ? last.n : (S.book.start || 1); renderToc(); tab('home');
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => tab(b.dataset.tab));
$('#menuBtn').onclick = () => { if (S.tab !== 'lib') tab('lib'); $('#toc').classList.toggle('open'); };
$('#toc').onclick = e => { const t = e.target.closest('.t'); if (t) openPage(S.book.id, +t.dataset.n); };
$('#q').oninput = e => { clearTimeout(searchT); const v = e.target.value; searchT = setTimeout(() => search(v), 350); };
$('#q').onkeydown = e => { if (e.key === 'Enter') { clearTimeout(searchT); search(e.target.value); } };
$('#dClose').onclick = closeDrawer;
$('#home').onclick = () => tab('home');
$('#tutor').onclick = () => openChat({title: 'Claude tutor · ' + S.book.subject, book: S.book.id, pages: [], intro: ''});
$('#cf').onsubmit = e => { e.preventDefault(); const v = $('#ci').value; $('#ci').value = ''; sendChat(v); };
$('#ci').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#cf').requestSubmit(); } };
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (S.tab === 'lib' && e.key === 'ArrowRight') openPage(S.book.id, S.n + 1);
  if (S.tab === 'lib' && e.key === 'ArrowLeft') openPage(S.book.id, S.n - 1);
  if (e.key === ' ' && $('#flip')) { e.preventDefault(); $('#flip').click(); }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});
$('#lf').onsubmit = async e => {
  e.preventDefault(); PASS = $('#lp').value.trim(); $('#le').textContent = '';
  try { await api('login'); LS.set('ib-pass', PASS); boot(); } catch (err) { $('#le').textContent = err.message; }
};
// open mode: the relay lets requests without a password through (except PDF downloads); ?login shows the password box
(async () => {
  if (PASS || new URLSearchParams(location.search).has('login')) { if (PASS) boot(); else $('#login').classList.remove('hide'); return; }
  try { const r = await fetch(RELAY + '/ib/books', {method: 'POST', body: '{}'}); if (r.ok) return boot(); } catch (e) {}
  $('#login').classList.remove('hide');
})();
</script>
