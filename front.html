<!doctype html>
<!--
  jjfront: an OpenFront-style territory war game, played in the browser, online through the jjfanwars relay.

  Rules and numbers (troop cap, troop growth, attack-ratio slider, cities / defense posts, tribes + AI nations)
  follow OpenFront (https://openfront.io, https://github.com/openfrontio/OpenFrontIO), (c) OpenFront Inc. and
  contributors, AGPL-3.0 with additional attribution terms. This is an independent remake and NOT the official game.
  Code here is licensed AGPL-3.0 as well; source: https://github.com/jjfanwars/jjfanwars.github.io

  Netcode: deterministic lockstep. Every player runs the same simulation from the same seed. The host (or the
  solo player) collects intents, stamps them into a numbered turn every 100 ms and the relay forwards that turn to
  everyone. The sim therefore only uses + - * / sqrt and a seeded PRNG, never Math.random / Math.pow / time.
-->
<html lang="en"><head><meta charset="utf-8">

<title>jjfront</title>
<style>

<script id="sim">
'use strict';
// ===== Simulation (pure, deterministic). No DOM, no Math.random, no Math.pow. =====
const SP = 200;                       // spawn phase length in turns (100 ms each)
const TM = [0, 1, 1.5, 2.2];          // attack cost multiplier per terrain: water, plain, hills, mountain
const GROW = 0.1;                     // global troop growth scale (tuned for this map size)
const WIN_SHARE = 0.7;
const NUKE_COST = 400, NUKE_FLIGHT = 40, NUKE_R = 5; // a nuke takes 4 s to land: everyone sees it coming
const NATION_NAMES = ['Aldoria','Brevik','Cyrene','Dunmar','Estrel','Falkor','Gorvia','Hesper','Istria','Jorvan','Kelmar','Lysia','Morvane','Norland','Ostrava','Pelion','Quenta','Rhodan','Sarnia','Tyrell','Ulmar','Valdis','Wenmar','Xanth','Yorvik','Zelan','Arvane','Belgrim','Corvath','Dessar'];

function mulberry(seed) { let s = seed | 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y, s) { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1274126177) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// 0 water, 1 plains, 2 hills, 3 mountains. Only the biggest landmass is kept, so nobody spawns on an unreachable islet.
function genMap(W, H, seed) {
  const n = W * H, t = new Uint8Array(n), hv = new Float32Array(n), s = seed | 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let f = 0, a = 0.5, fr = 1 / 40, tot = 0;
    for (let o = 0; o < 5; o++) { f += a * vnoise(x * fr, y * fr, s + o * 101); tot += a; a *= 0.5; fr *= 2; }
    f /= tot;
    const dx = (x + 0.5) / W * 2 - 1, dy = (y + 0.5) / H * 2 - 1, e = dx * dx * 0.9 + dy * dy;
    const v = f + 0.2 - 0.45 * e;
    hv[y * W + x] = v; t[y * W + x] = v > 0.64 ? 3 : v > 0.55 ? 2 : v > 0.4 ? 1 : 0;
  }
  const comp = new Int32Array(n).fill(-1), q = new Int32Array(n); let best = -1, bestN = 0, cid = 0;
  for (let i = 0; i < n; i++) {
    if (!t[i] || comp[i] >= 0) continue;
    let h = 0, e = 0; q[e++] = i; comp[i] = cid;
    while (h < e) {
      const c = q[h++], x = c % W;
      if (x > 0 && t[c - 1] && comp[c - 1] < 0) { comp[c - 1] = cid; q[e++] = c - 1; }
      if (x < W - 1 && t[c + 1] && comp[c + 1] < 0) { comp[c + 1] = cid; q[e++] = c + 1; }
      if (c >= W && t[c - W] && comp[c - W] < 0) { comp[c - W] = cid; q[e++] = c - W; }
      if (c + W < n && t[c + W] && comp[c + W] < 0) { comp[c + W] = cid; q[e++] = c + W; }
    }
    if (e > bestN) { bestN = e; best = cid; }
    cid++;
  }
  for (let i = 0; i < n; i++) if (t[i] && comp[i] !== best) t[i] = 0;
  t.v = hv; // heights, display only
  return t;
}
function colorOf(i) { // display only (never feeds the sim)
  const h = (i * 137.508) % 360, s = 0.62 + (i % 3) * 0.08, l = 0.5 + (i % 2) * 0.06;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}

class Sim {
  // roster: [{name, human:bool, bot:'nation'|'tribe'}], player id = index + 1 (0 = nobody's land)
  constructor(cfg, roster) {
    this.cfg = cfg; const W = this.W = cfg.w, H = this.H = cfg.h, n = this.n = W * H;
    this.terr = genMap(W, H, cfg.seed); this.own = new Uint8Array(n); this.bld = new Uint8Array(n); // bld: 1 city, 2 defense post, 3 port
    this.land = 0; for (let i = 0; i < n; i++) if (this.terr[i]) this.land++;
    this.P = roster.map((r, i) => ({ id: i + 1, name: r.name, human: !!r.human, kind: r.human ? 'human' : r.bot, alive: true, spawn: -1, spawned: false,
      troops: 0, gold: 0, tiles: 0, sx: 0, sy: 0, cities: 0, ports: 0, posts: [], capital: -1, silos: [], sams: [], nukeAt: 0, col: colorOf(i) }));
    this.tick = 0; this.r = mulberry(cfg.seed ^ 0x5bd1e995); this.atks = []; this.dirty = []; this.log = []; this.over = null; this.ct = null; this.nukes = []; this.fx = []; this.samCd = new Map();
  }
  cap(p) {
    let m = 2 * (2000 * Math.sqrt(p.tiles) + 50000) + p.cities * 100000 + (p.capital >= 0 ? 50000 : 0);
    if (p.kind === 'tribe') m /= 3; else if (p.kind === 'nation') m *= 0.75;
    return m;
  }
  buildCost(p, b) { return b === 1 ? Math.round(250 * (1 + 0.5 * p.cities)) : b === 2 ? Math.round(100 * (1 + 0.3 * p.posts.length)) : b === 5 ? 500 : b === 6 ? 300 + 100 * p.sams.length : 150; }
  coastal(i) { const W = this.W, t = this.terr, x = i % W; return (x > 0 && !t[i - 1]) || (x < W - 1 && !t[i + 1]) || (i >= W && !t[i - W]) || (i + W < this.n && !t[i + W]); }
  say(msg) { this.log.push({ t: this.tick, msg }); }

  addB(p, i, b) { if (b === 1) p.cities++; else if (b === 2) p.posts.push(i); else if (b === 3) p.ports++; else if (b === 4) { if (p.capital < 0) p.capital = i; } else if (b === 5) p.silos.push(i); else p.sams.push(i); }
  remB(p, i, b) { const rm = a => { const k = a.indexOf(i); if (k >= 0) a.splice(k, 1); }; if (b === 1) p.cities--; else if (b === 2) rm(p.posts); else if (b === 3) p.ports--; else if (b === 4) { if (p.capital === i) p.capital = -1; } else if (b === 5) rm(p.silos); else rm(p.sams); }
  setOwner(i, id) {
    const o = this.own[i]; if (o === id) return;
    const x = i % this.W, y = (i / this.W) | 0, b = this.bld[i];
    if (o) { const q = this.P[o - 1]; q.tiles--; q.sx -= x; q.sy -= y; if (b) this.remB(q, i, b); }
    this.own[i] = id;
    if (id) { const q = this.P[id - 1]; q.tiles++; q.sx += x; q.sy += y; if (b) this.addB(q, i, b); } else this.bld[i] = 0;
    this.dirty.push(i);
    if (o && b === 4) { const q = this.P[o - 1]; q.troops *= 0.7; if (id) { const w = this.P[id - 1]; w.gold += 150; this.say(w.name + ' captured ' + q.name + "'s capital!"); } else this.say(q.name + "'s capital was destroyed!"); }
    if (o && this.P[o - 1].tiles === 0 && this.P[o - 1].spawned) this.kill(o, id);
  }
  kill(o, by) {
    const p = this.P[o - 1]; if (!p.alive) return; p.alive = false; p.troops = 0;
    for (const a of this.atks) { if (a.p === o) a.done = true; else if (a.t === o) this.endAtk(a); }
    this.say(p.name + ' was eliminated' + (by ? ' by ' + this.P[by - 1].name : ''));
  }

  apply(pid, it) {
    const p = this.P[pid]; if (!p || !it) return; const T = this.tick, W = this.W;
    const x = it.x | 0, y = it.y | 0, ok = x >= 0 && y >= 0 && x < W && y < this.H, i = y * W + x;
    switch (it.k) {
      case 'spawn': if (T <= SP && p.human && ok && this.terr[i] && this.terr[i] < 3) p.spawn = i; break;
      case 'atk': if (T > SP && p.alive && ok && this.terr[i]) this.launch(p, this.own[i], +it.r || 30); break;
      case 'build': {
        const b = it.b | 0; if (T <= SP || !p.alive || !ok || !(b === 1 || b === 2 || b === 3 || b === 5 || b === 6)) break;
        if (this.own[i] !== p.id || !this.terr[i] || this.bld[i] || (b === 3 && !this.coastal(i))) break;
        const c = this.buildCost(p, b); if (p.gold < c) break;
        p.gold -= c; this.bld[i] = b; this.addB(p, i, b); this.dirty.push(i); break;
      }
      case 'nuke': {
        if (T <= SP || !p.alive || !ok || !this.terr[i] || this.own[i] === p.id || !p.silos.length || T < p.nukeAt || p.gold < NUKE_COST) break;
        p.gold -= NUKE_COST; p.nukeAt = T + Math.floor(900 / p.silos.length);
        this.nukes.push({ p: p.id, from: p.silos[T % p.silos.length], i, t0: T, eta: T + NUKE_FLIGHT });
        const o = this.own[i]; this.say(p.name + ' launched a nuke' + (o ? ' at ' + this.P[o - 1].name : '') + '!'); break;
      }
      case 'ret': for (const a of this.atks) if (a.p === p.id && a.t === (it.t | 0) && !a.done) this.endAtk(a); break;
      case 'afk': if (p.kind === 'human') p.kind = 'nation'; break; // a player who left becomes an AI nation
    }
  }

  launch(p, t, pct) {
    const id = p.id; if (t === id || !p.alive || t < 0 || t > this.P.length) return;
    if (t && !this.P[t - 1].alive) return;
    pct = Math.max(1, Math.min(100, pct | 0)); const amt0 = Math.floor(p.troops * pct / 100); if (amt0 < 10) return;
    const W = this.W, n = this.n, own = this.own, terr = this.terr, q = [];
    for (let i = 0; i < n; i++) {
      if (own[i] !== t || !terr[i]) continue; const x = i % W;
      if ((x > 0 && own[i - 1] === id) || (x < W - 1 && own[i + 1] === id) || (i >= W && own[i - W] === id) || (i + W < n && own[i + W] === id)) q.push(i);
    }
    if (!q.length) return;
    p.troops -= amt0; let amt = amt0;
    if (t) { // two armies facing each other cancel out first
      for (const b of this.atks) if (!b.done && b.p === t && b.t === id) { const m = Math.min(amt, b.troops); amt -= m; b.troops -= m; if (b.troops <= 0) b.done = true; if (amt <= 0) return; }
    }
    const ex = this.atks.find(a => !a.done && a.p === id && a.t === t);
    if (ex) { ex.troops += amt; for (const i of q) if (!ex.mark[i]) { ex.mark[i] = 1; ex.q.push(i); } return; }
    const mark = new Uint8Array(n); for (const i of q) mark[i] = 1;
    this.atks.push({ p: id, t, troops: amt, q, h: 0, mark, done: false });
    if (t) this.say(p.name + ' attacks ' + this.P[t - 1].name);
  }
  endAtk(a) { a.done = true; const p = this.P[a.p - 1]; if (p.alive) p.troops += a.troops; a.troops = 0; }
  runAtk(a) {
    const p = this.P[a.p - 1]; if (!p.alive) { a.done = true; return; }
    const t = a.t, id = a.p, d = t ? this.P[t - 1] : null, W = this.W, n = this.n, own = this.own, terr = this.terr, q = a.q;
    if (d && !d.alive) { this.endAtk(a); return; }
    let budget = 4 + Math.min(70, (q.length - a.h) >> 2);
    while (budget-- > 0 && a.h < q.length) {
      const i = q[a.h++]; if (own[i] !== t) continue; const x = i % W;
      if (!((x > 0 && own[i - 1] === id) || (x < W - 1 && own[i + 1] === id) || (i >= W && own[i - W] === id) || (i + W < n && own[i + W] === id))) continue;
      const mul = TM[terr[i]]; let cost, dl = 0;
      if (!t) cost = 16 * mul;
