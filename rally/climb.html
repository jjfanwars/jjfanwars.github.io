<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ridge Runner</title>
<!--
  Ridge Runner: a side-view hill climb minigame on the Rally site. Original game in the 2D hill-climb genre.
  One file, canvas 2D, no libraries. The script with id "sim" is pure physics and rules (no DOM, runs in Node for tests);
  the script with id "app" is rendering, sound, input, menus, missions and the save (localStorage rr-save1). Test hook: ?test -> window.__RR.
-->
<style>
:root { --bg:#0b0e0c; --ink:#efe9dc; --dim:#a39d8f; --acc:#f2b632; --red:#e0483a; --green:#4cc38a; --blue:#5fb4ff; --panel:rgba(14,18,16,.88); --line:rgba(255,255,255,.09); --chip:#1b221e; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
.hidden { display:none !important; }
button { font:700 15px system-ui,sans-serif; color:var(--ink); background:#28312c; border:0; border-radius:10px; padding:11px 16px; cursor:pointer; transition:filter .15s, transform .08s; }
button:hover { filter:brightness(1.15); } button:active { transform:scale(.97); }
button:disabled { opacity:.4; cursor:default; filter:none; transform:none; }
button:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
.go { background:linear-gradient(180deg,#ffd15e,#f2a922); color:#1a1408; }
.cn { display:inline-block; width:.95em; height:.95em; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff3b0,#f6c533 45%,#c98a12); box-shadow:inset 0 0 0 1.5px rgba(120,70,0,.55); vertical-align:-.12em; margin-right:.25em; }
.scr { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; overflow:auto; }
.card { width:min(800px,100%); max-height:100%; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 30px 90px rgba(0,0,0,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.topR { display:flex; gap:8px; align-items:center; }
h1 { margin:0; font-size:clamp(32px,7vw,46px); font-weight:900; font-style:italic; letter-spacing:.02em; line-height:1; }
h1 b { color:var(--acc); }
.sub { color:var(--dim); margin:6px 0 0; }
.back { color:var(--dim); text-decoration:none; font-size:13px; display:inline-block; margin-bottom:8px; }
.back:hover { color:var(--ink); }
.wallet { font:900 22px system-ui; background:var(--chip); border:1px solid var(--line); border-radius:12px; padding:8px 14px; white-space:nowrap; }
.ico { width:44px; height:44px; padding:0; font-size:18px; border-radius:12px; background:var(--chip); border:1px solid var(--line); }
.daily { margin-top:14px; padding:10px 14px; border-radius:12px; background:linear-gradient(90deg,rgba(242,182,50,.22),rgba(242,182,50,.06)); border:1px solid rgba(242,182,50,.35); font-weight:700; display:flex; align-items:center; gap:10px; }
.daily b { color:var(--acc); }
h2 { margin:18px 0 8px; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); font-weight:800; }
.cards { display:flex; gap:10px; overflow-x:auto; padding:2px 2px 8px; scroll-snap-type:x proximity; }
.sc { flex:0 0 148px; scroll-snap-align:start; text-align:left; padding:0; overflow:hidden; border-radius:13px; background:var(--chip); border:2px solid transparent; font-weight:600; }
.sc.on { border-color:var(--acc); box-shadow:0 0 0 3px rgba(242,182,50,.15); }
.sc .th { height:62px; position:relative; }
.sc .th canvas { position:absolute; inset:0; width:100%; height:100%; }
.sc .tx { padding:8px 10px 10px; }
.sc .nm { font-weight:800; font-size:14px; }
.sc .mt { color:var(--dim); font-size:12px; font-weight:600; margin-top:2px; }
.sc .lock { color:var(--acc); font-weight:800; }
.sc.locked .th { filter:grayscale(.75) brightness(.55); }
.mis { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; }
.mi { background:var(--chip); border:1px solid var(--line); border-radius:12px; padding:9px 12px; font-size:13px; font-weight:700; }
.mi .rw { color:var(--acc); font-size:12px; float:right; }
.mi .b { height:6px; border-radius:3px; background:rgba(255,255,255,.1); margin-top:7px; overflow:hidden; } .mi .b i { display:block; height:100%; background:var(--green); }
.mi.done { border-color:var(--green); }
.vstat { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:0 0 10px; }
.vstat div { font-size:11px; font-weight:800; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; }
.vstat i { display:block; height:6px; border-radius:3px; background:rgba(255,255,255,.1); margin-top:4px; position:relative; overflow:hidden; }
.vstat i u { position:absolute; left:0; top:0; bottom:0; background:var(--blue); border-radius:3px; }
.ups { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
.up { background:var(--chip); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.up .nm { font-weight:800; font-size:14px; display:flex; justify-content:space-between; gap:6px; }
.up .nm span { color:var(--dim); font-size:12px; text-align:right; }
.pips { display:flex; gap:3px; margin:7px 0 9px; } .pips i { flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.1); } .pips i.f { background:var(--acc); }
.up button { width:100%; padding:8px; font-size:14px; }
.vdesc { color:var(--dim); font-size:13px; margin:0 0 8px; }
.play { display:flex; gap:10px; margin:18px -22px -22px; padding:12px 22px 16px; align-items:center; flex-wrap:wrap; position:sticky; bottom:-22px; background:linear-gradient(180deg,rgba(14,18,16,.7),rgba(14,18,16,.98) 30%); border-top:1px solid var(--line); }
.play .go { flex:1 1 220px; font-size:20px; padding:15px; font-weight:900; letter-spacing:.06em; }
.small { color:var(--dim); font-size:12px; }
#code { width:96px; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.14); background:#141a17; color:var(--ink); font:600 14px system-ui; text-transform:lowercase; }
#code:focus { outline:2px solid var(--acc); } #code.ok { border-color:var(--green); }
/* HUD */
#hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
#hud .tl { position:absolute; left:16px; top:12px; text-shadow:0 2px 6px rgba(0,0,0,.6); }
#dist { font:900 34px/1 system-ui; font-style:italic; } #dist small { font-size:16px; font-style:normal; opacity:.8; }
#bestL { font-size:13px; font-weight:700; opacity:.9; margin-top:3px; }
#hud .tc { position:absolute; left:50%; top:14px; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; }
.bar { display:flex; align-items:center; gap:8px; font:900 12px system-ui; letter-spacing:.1em; text-shadow:0 1px 3px #000; }
.bar .b { width:min(200px,38vw); height:16px; border-radius:9px; background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.25); overflow:hidden; }
.bar .b i { display:block; height:100%; width:100%; border-radius:9px; transition:width .1s linear; }
#fuel i { background:linear-gradient(90deg,#e0483a,#f2b632 45%,#4cc38a); background-size:min(200px,38vw) 100%; }
#fuelW.low .b { animation:blink .5s steps(2) infinite; }
#fuelW { position:relative; } #canD { position:absolute; left:100%; margin-left:8px; font:800 12px system-ui; letter-spacing:.04em; color:#ffd0c9; white-space:nowrap; } #canD::before { content:""; display:inline-block; width:8px; height:10px; margin-right:5px; border-radius:2px; background:#d8281f; box-shadow:inset 0 3px 0 #ffd15e; vertical-align:-1px; } #canD:empty { display:none; }
#fuelW.low #canD { color:#ffd15e; }
@keyframes blink { 50% { opacity:.35; } }
#boost i { background:linear-gradient(90deg,#ff7a1a,#ffd15e); }
#hud .tr { position:absolute; right:14px; top:12px; display:flex; gap:10px; align-items:center; }
#coinL { font:900 24px system-ui; text-shadow:0 2px 6px rgba(0,0,0,.6); }
#bPause { pointer-events:auto; width:42px; height:42px; padding:0; border-radius:12px; background:rgba(0,0,0,.45); font-size:15px; }
#pops { position:absolute; left:50%; top:22%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:4px; }
.pop { font:900 26px system-ui; font-style:italic; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.4); animation:pop 1.6s ease-out forwards; white-space:nowrap; }
.pop small { display:block; text-align:center; font-size:16px; color:var(--acc); font-style:normal; }
.pop.gold { color:var(--acc); } .pop.blue { color:#8fd3ff; } .pop.red { color:#ff7a6b; } .pop.green { color:#7dffb0; } .pop.big { font-size:38px; }
@keyframes pop { 0% { transform:scale(.4); opacity:0; } 12% { transform:scale(1.12); opacity:1; } 22% { transform:scale(1); } 75% { opacity:1; } 100% { transform:translateY(-36px); opacity:0; } }
#hint { position:absolute; left:50%; top:70px; transform:translateX(-50%); background:rgba(0,0,0,.55); padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600; transition:opacity 1s; white-space:nowrap; max-width:calc(100vw - 32px); overflow:hidden; text-overflow:ellipsis; }
#pedals { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:space-between; align-items:flex-end; padding:14px; z-index:6; pointer-events:none; }
#pedals button { pointer-events:auto; width:min(26vw,120px); height:min(22vw,100px); border-radius:20px; font:900 16px system-ui; letter-spacing:.1em; background:rgba(0,0,0,.38); border:2px solid rgba(255,255,255,.28); touch-action:none; }
#pedals button.dn { background:rgba(242,182,50,.45); border-color:var(--acc); transform:scale(.96); }
#pGas { color:#c9ffd9; } #pBrake { color:#ffd0c9; }
#pBoost { width:min(20vw,90px) !important; height:min(16vw,70px) !important; font-size:13px !important; color:#ffd9a8; margin-left:auto; margin-right:10px; }
@media (pointer:fine) { #pedals button { width:96px; height:78px; font-size:13px; opacity:.85; } }
/* game over */
.over { text-align:center; width:min(480px,100%); }
.over h1 { font-size:clamp(30px,8vw,42px); }
.why { color:var(--dim); margin:6px 0 14px; }
.stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:left; }
.stats div { background:var(--chip); border-radius:11px; padding:9px 12px; }
.stats b { display:block; font:900 20px system-ui; }
.stats span { color:var(--dim); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
.newb { display:inline-block; margin-left:6px; background:var(--acc); color:#1a1408; font-size:11px; font-weight:900; padding:2px 6px; border-radius:6px; vertical-align:3px; }
.brk { margin:10px 0 0; background:var(--chip); border-radius:11px; padding:10px 12px; text-align:left; font-size:14px; font-weight:700; }
.brk div { display:flex; justify-content:space-between; padding:2px 0; } .brk div span { color:var(--dim); }
.brk .tot { border-top:1px solid var(--line); margin-top:5px; padding-top:7px; font-size:18px; font-weight:900; } .brk .tot b { color:var(--acc); }
.next { margin:10px 0 0; background:var(--chip); border-radius:11px; padding:10px 12px; text-align:left; font-size:14px; font-weight:700; }
.next .b { height:8px; border-radius:4px; background:rgba(255,255,255,.1); margin-top:7px; overflow:hidden; } .next .b i { display:block; height:100%; background:var(--acc); }
.over .mis { margin-top:10px; text-align:left; grid-template-columns:1fr; }
.btns { display:flex; gap:10px; margin-top:16px; } .btns > * { flex:1; }
@media (max-width:520px) { .card { padding:16px; } .play { margin:18px -16px -16px; padding:12px 16px; bottom:-16px; } #dist { font-size:26px; } #coinL { font-size:19px; } .pop { font-size:21px; } .pop.big { font-size:30px; } .stats { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="tl"><div id="dist">0<small> m</small></div><div id="bestL"></div></div>
  <div class="tc">
    <div class="bar" id="fuelW">FUEL<div class="b" id="fuel"><i></i></div><span id="canD"></span></div>
    <div class="bar hidden" id="boostW">BOOST<div class="b" id="boost"><i></i></div></div>
  </div>
  <div class="tr"><div id="coinL"><i class="cn"></i>0</div><button id="bPause" aria-label="Pause">❚❚</button></div>
  <div id="pops"></div>
  <div id="hint"></div>
</div>
<div id="pedals" class="hidden"><button id="pBrake">BRAKE</button><button id="pBoost" class="hidden">BOOST</button><button id="pGas">GAS</button></div>

<div id="menu" class="scr">
  <div class="card">
    <a class="back" href="./">&lsaquo; Rally</a>
    <div class="top">
      <div><h1>RIDGE <b>RUNNER</b></h1><p class="sub">Climb as far as you can. Grab fuel, grab coins, flip for bonuses. Don't land on your head.</p></div>
      <div class="topR"><button class="ico" id="bSnd" aria-label="Sound">🔊</button><div class="wallet" id="wallet"><i class="cn"></i>0</div></div>
    </div>
    <div class="daily hidden" id="daily"></div>
    <h2>Missions</h2><div class="mis" id="mis"></div>
    <h2>Stage</h2><div class="cards" id="stages"></div>
    <h2>Vehicle</h2><div class="cards" id="vehs"></div>
    <h2 id="upH">Upgrades</h2><p class="vdesc" id="vdesc"></p><div class="vstat" id="vstat"></div><div class="ups" id="ups"></div>
    <div class="play"><button class="go" id="bGo">DRIVE</button><input id="code" maxlength="12" placeholder="Code" autocomplete="off" aria-label="Unlock code"><span class="small" id="keys"></span></div>
  </div>
</div>

<div id="over" class="scr hidden">
  <div class="card over">
    <h1 id="oT">OUT OF FUEL</h1><p class="why" id="oW"></p>
    <div class="stats">
      <div><span>Distance</span><b id="oD">0 m</b></div>
      <div><span>Best</span><b id="oB">0 m</b></div>
      <div><span>Tricks</span><b id="oF">0</b></div>
    </div>
    <div class="brk" id="oC"></div>
    <div class="mis" id="oM"></div>
    <div class="next" id="oN"></div>
    <div class="btns"><button id="bGarage">Garage</button><button class="go" id="bRetry">Retry (R)</button></div>
  </div>
</div>

<div id="pause" class="scr hidden">
  <div class="card over">
    <h1>PAUSED</h1><p class="why" id="pInfo"></p>
    <div class="btns" style="flex-direction:column"><button class="go" id="bResume">Resume</button><button id="bRestart">Restart</button><button id="bSnd2">Sound: on</button><button id="bQuit">Garage</button></div>
  </div>
</div>

<script id="sim">
'use strict';
// ---------- pure simulation: terrain, vehicle physics, run rules ----------
const G0 = 9.81, DT = 1 / 360;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t, ss = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
function hash(i, s) { let h = Math.imul(i | 0, 374761393) ^ Math.imul((s | 0) + 1013, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return (hash(i, s) * (1 - u) + hash(i + 1, s) * u) * 2 - 1; }

// stages (append only: the save uses the index). g = gravity factor, mu = grip, amp/freq = hill size, grow = metres until the
// hills are twice as big, climb = average uphill slope; ice / mud patches, craters, ridges, night, jumps are per-stage features
const STAGES = [
  { id: 'hills', name: 'Green Hills', desc: 'Rolling meadows. A gentle start.', cost: 0, sky: ['#5fb0e8', '#cdeeff'], far: '#8cbfa6', mid: '#5c9c6e', near: '#3f7f4c', ground: ['#7a5232', '#5a3b22'], top: '#5fbf3f', top2: '#3e8f2a', dust: '#a27d55', g: 1, mu: 1, amp: 3.2, freq: 1 / 40, grow: 900, climb: 0.03, rough: 0.22, decor: 'tree', sun: '#fff6c8', clouds: 1, grass: 1 },
  { id: 'dunes', name: 'Dune Sea', desc: 'Huge soft dunes. Big air, less grip.', cost: 5000, sky: ['#f0a052', '#ffe2ad'], far: '#e4b17a', mid: '#d39558', near: '#c4823f', ground: ['#dcae68', '#b8853f'], top: '#f2d08e', top2: '#d6aa5f', dust: '#e8c88c', g: 1, mu: 0.82, amp: 5.8, freq: 1 / 68, grow: 1100, climb: 0.02, rough: 0.1, decor: 'cactus', sun: '#fff0c0' },
  { id: 'glacier', name: 'Glacier', desc: 'Snow with patches of sheer ice.', cost: 15000, sky: ['#8fb8e0', '#eef6ff'], far: '#c8dbee', mid: '#a6c1db', near: '#8eabc6', ground: ['#8aa6bf', '#64819b'], top: '#f6fbff', top2: '#cfe2f4', dust: '#ffffff', g: 1, mu: 0.75, amp: 4, freq: 1 / 46, grow: 900, climb: 0.035, rough: 0.28, decor: 'pine', ice: 1, sun: '#ffffff', clouds: 1 },
  { id: 'moon', name: 'Moon Base', desc: 'Low gravity. Craters. Endless flips.', cost: 35000, sky: ['#04050b', '#171a30'], far: '#262a3d', mid: '#33374d', near: '#40445a', ground: ['#8c8e98', '#62646e'], top: '#c3c5ce', top2: '#9c9ea8', dust: '#c9cad2', g: 0.3, mu: 0.9, amp: 5, freq: 1 / 52, grow: 1000, climb: 0.02, rough: 0.3, decor: 'moon', craters: 1, stars: 1, earth: 1, fuel: 0.55 },
  { id: 'volcano', name: 'Volcano', desc: 'Sharp ridges, steep climbs, hot rocks.', cost: 70000, sky: ['#2a0e0b', '#9a3a22'], far: '#47201a', mid: '#5c2519', near: '#3a1712', ground: ['#3d2c27', '#251916'], top: '#5b3d33', top2: '#ff6a1a', dust: '#6b5650', g: 1, mu: 1, amp: 6.2, freq: 1 / 36, grow: 700, climb: 0.045, rough: 0.45, decor: 'rock', ridge: 1, embers: 1, sun: '#ffb070' },
  { id: 'swamp', name: 'Mud Bog', desc: 'Sticky mud pits that grab your wheels.', cost: 25000, sky: ['#7d9c8a', '#d7e6cf'], far: '#86a183', mid: '#5f7d58', near: '#46613f', ground: ['#5b4630', '#3f2f1f'], top: '#6f8f3a', top2: '#4d6a2a', dust: '#5a4a33', g: 1, mu: 0.95, amp: 3.6, freq: 1 / 38, grow: 900, climb: 0.02, rough: 0.3, decor: 'reed', mud: 1, clouds: 1, sun: '#fff4d0', grass: 1 },
  { id: 'night', name: 'Night Woods', desc: 'Pitch dark. Your headlights are all you get.', cost: 50000, sky: ['#05070f', '#16203a'], far: '#101828', mid: '#141d2c', near: '#0d141f', ground: ['#3a2c22', '#241a13'], top: '#2f5a2e', top2: '#1f3d1f', dust: '#5a4a3a', g: 1, mu: 1, amp: 4.2, freq: 1 / 40, grow: 850, climb: 0.03, rough: 0.3, decor: 'pine', night: 1, stars: 1, moonDisc: 1, grass: 1 },
  { id: 'canyon', name: 'Canyon Jumps', desc: 'Ramps over pits. Huge air, huge risk.', cost: 90000, sky: ['#e8925a', '#ffd7a0'], far: '#c27a4e', mid: '#a65f3a', near: '#8a4a2b', ground: ['#b8683c', '#8a4a28'], top: '#d48a52', top2: '#a6602f', dust: '#d8a070', g: 1, mu: 0.95, amp: 2.4, freq: 1 / 50, grow: 1400, climb: 0.01, rough: 0.15, decor: 'cactus', jumps: 1, sun: '#fff0c0' },
];
// jump layout on Canyon Jumps: a kicker, a pit with a climb-out slope on the far side, a landing slope
const JUMP0 = 78, JUMP_P = 150, jumpGap = (ci, sd) => 16 + hash(ci, sd + 61) * 8 + Math.min(10, ci * 0.6), jumpLip = (ci, sd) => 3.2 + hash(ci, sd + 63) * 1.2;

// vehicles (append only): chassis mass m (kg), body box L x Hh for inertia, wheels (local x/y anchor, radius, mass, drive share),
// suspension rest/travel/k/c, wheel torque T (N m total), power P (W), vmax (m/s), grip mu, air = tilt accel (rad/s^2),
// head (local) + hr: the driver's head; hull: body points that touch the ground
const VEH = [
  { id: 'buggy', name: 'Dune Buggy', desc: 'Light and bouncy. Easy to flip, easy to love.', cost: 0, col: '#e8452f', m: 260, L: 2.4, Hh: 0.7,
    wheels: [{ x: 1.05, y: -0.2, r: 0.42, m: 20, dr: 0.5 }, { x: -1.05, y: -0.2, r: 0.42, m: 20, dr: 0.5 }], rest: 0.5, travel: 0.3, k: 13000, c: 1050,
    T: 950, P: 26000, vmax: 30, mu: 1.05, air: 5.5, tank: 1, drag: 0.35, head: [-0.12, 0.95], hr: 0.21,
    hull: [[1.3, -0.15], [-1.25, -0.15], [1.1, 0.4], [-1.2, 0.5], [0.25, 0.8], [-0.45, 0.82]] },

function makeSpec(vi, up) {
  const S = JSON.parse(JSON.stringify(VEH[vi])), u = up || [0, 0, 0, 0];
  S.T *= 1 + 0.09 * u[0]; S.P *= 1 + 0.12 * u[0]; S.vmax *= 1 + 0.025 * u[0];
  S.k *= 1 + 0.05 * u[1]; S.c *= 1 + 0.08 * u[1]; S.travel *= 1 + 0.04 * u[1]; S.air *= 1 + 0.05 * u[1];
  S.mu *= 1 + 0.045 * u[2]; S.tank *= 1 + 0.13 * u[3];

// terrain: a height grid every 0.25 m, generated lazily; left of the start is a wall so you can't drive off backwards
class Terrain {
  constructor(st, seed) { this.st = st; this.seed = seed; this.dx = 0.25; this.h = new Float32Array(4096); this.n = 0; this.ensure(300); }

    const k = x - 18, ramp = Math.min(1, k / 50), diff = (1 + Math.min(2.4, k / S.grow)) * ramp;
    let n = vnoise(k * S.freq, sd) + 0.45 * vnoise(k * S.freq * 2.13, sd + 7) + 0.2 * vnoise(k * S.freq * 4.7, sd + 13);
    if (S.ridge) n = 0.55 * n + 0.9 * (0.45 - Math.abs(vnoise(k * S.freq * 1.4, sd + 29)));
    let y = n * S.amp * diff + k * S.climb * ramp + vnoise(k * 0.55, sd + 41) * S.rough * ramp * Math.min(1.6, diff);
    if (S.craters) { const ci = Math.floor(k / 55), c0 = ci * 55 + 12 + hash(ci, sd + 3) * 25, cr = 3 + hash(ci, sd + 5) * 4, d = Math.abs(k - c0) / cr;
      if (ci > 0 && d < 1.35) y += d < 1 ? -(1 - d * d) * cr * 0.42 : 0; if (ci > 0 && d > 0.75 && d < 1.35) y += (1 - Math.abs(d - 1.05) / 0.3) * cr * 0.12; }
    if (S.jumps && x >= JUMP0) {
      const ci = Math.floor((x - JUMP0) / JUMP_P), u = x - JUMP0 - ci * JUMP_P, gw = jumpGap(ci, sd), lip = jumpLip(ci, sd), land = lip - 0.8, e = 24 + gw;
      if (u < 24) y += lip * (u / 24) ** 2;                                         // kicker
      else if (u < 26.5) y += lerp(lip, -6, ss((u - 24) / 2.5));                     // the drop off the lip
      else if (u < e - 13) y += -6;                                                  // pit floor
      else if (u < e) y += lerp(-6, land, ss((u - e + 13) / 13));                    // climb-out slope (if you come up short)
      else if (u < e + 24) y += land * (1 - ss((u - e) / 24));                       // landing slope

  }
  ensure(x) {
    const need = Math.ceil(x / this.dx) + 3; if (need <= this.n) return;

    for (let i = this.n; i < need; i++) this.h[i] = this.raw(i * this.dx); this.n = need;
  }
  hi(i) { if (i < 0) return -i * this.dx * 1.6; if (i >= this.n) this.ensure(i * this.dx + 60); return this.h[i]; }

  closest(px, py, r) {

      let t = ((px - x0) * sx + (py - y0) * sy) / L2; t = t < 0 ? 0 : t > 1 ? 1 : t;
      const ex = px - (x0 + sx * t), ey = py - (y0 + sy * t), d = Math.hypot(ex, ey);

    }

    if (py < gy) { const sl = this.slope(px), L = Math.hypot(1, sl); return { d: -(gy - py) / L, nx: -sl / L, ny: 1 / L }; }
    return { d: best, nx, ny };

}

// one attempt on a stage: fuel, coins, cans, tricks, milestones, end conditions. Events go to `ev` for the app.
class Run {
